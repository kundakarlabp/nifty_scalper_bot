[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty-scalper-bot"
version = "0.1.0"
description = "Typed scaffolding for a Nifty intraday scalper bot"
authors = [{ name = "Refactor Assistant" }]
requires-python = ">=3.11"
dependencies = [
    "scipy>=1.13,<2",
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "pytz>=2024.1",
    "PyYAML>=6.0,<7",
    "prometheus-client>=0.20,<1",
    "tenacity>=8.2,<10",
    "uvicorn>=0.29,<1",
    "fastapi>=0.111,<1",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.2,<3",
    "pydantic>=2.7,<3",
    "requests>=2.31",
    "python-telegram-bot>=21.4",
    "kiteconnect>=5.0.1,<6",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nifty_scalper_bot*"]

[project.optional-dependencies]
dev = [
    "black>=24.3.0",
    "ruff>=0.5.0",
    "mypy>=1.9.0",
    "pytest>=7.4",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "nifty_scalper_bot"]
respect-gitignore = true

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/nifty_scalper_bot/execution/order_manager_core.py" = ["E501", "F401", "F821", "F841", "F601", "F811", "F541"]
"src/nifty_scalper_bot/strategies/runner.py" = ["E501", "F401", "F821", "F841", "F601", "E731"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
combine_as_imports = true
force_sort_within_sections = true
skip_gitignore = true
known_first_party = ["nifty_scalper_bot", "tests"]
src_paths = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
namespace_packages = true
show_error_codes = true
warn_unused_configs = true
ignore_errors = true

[tool.coverage.run]
source = ["src/nifty_scalper_bot"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = [
    "nifty_scalper_bot.execution.order_manager_core",
    "nifty_scalper_bot.execution.entry_recovery",
    "nifty_scalper_bot.execution.runtime_order_manager",
    "nifty_scalper_bot.execution.native_entry_gate",
    "nifty_scalper_bot.strategies.runner",
]
ignore_errors = true
