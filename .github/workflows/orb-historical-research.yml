name: ORB historical research

on:
  workflow_dispatch:
  issues:
    types: [opened, reopened]
  push:
    branches: [main]
    paths:
      - .github/workflows/orb-historical-research.yml
      - scripts/research_orb_multiyear.py
      - src/nifty_scalper_bot/backtesting/strategy_research.py
      - scripts/external_backtrader_oracle.py

permissions:
  contents: read

concurrency:
  # Research jobs use isolated runner temp paths. Keep routine pushes together,
  # while each explicit issue-triggered study gets its own lane.
  group: orb-historical-research-${{ github.event_name }}-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  monthly-options-study:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, '[ORB Research]') ||
      (startsWith(github.event.issue.title, '[Backtest] ORB') &&
      !startsWith(github.event.issue.title, '[Backtest] ORB Lifecycle') &&
      !startsWith(github.event.issue.title, '[Backtest] ORB Quality8') &&
      !startsWith(github.event.issue.title, '[Backtest] ORB ScoreCalibration'))))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXECUTION_MODE: SHADOW
      LIVE_TRADING_ENABLED: "false"
      PAPER_TRADING: "true"
      BROKER_API_KEY: offline_research_unused
      BROKER_API_SECRET: offline_research_unused
    steps:
      - uses: actions/checkout@v4
      - name: Set isolated research paths
        run: |
          printf 'SOURCE_DIR=%s/orb-public-source\nSTUDY_DIR=%s/orb-study\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install -e '.[research]'
      - name: Cache checksum-verified public archive
        uses: actions/cache@v4
        with:
          path: ${{ env.SOURCE_DIR }}
          key: zenodo-10899828-717d15361af52d1d654b4909d998967e
      - name: Verify and prepare historical baskets
        run: >-
          python scripts/research_orb_multiyear.py prepare
          --source "$SOURCE_DIR" --output "$STUDY_DIR"
      - name: Select settings on development years
        run: >-
          python scripts/research_orb_multiyear.py development
          --source "$SOURCE_DIR" --output "$STUDY_DIR" --workers 2
      - name: Validate frozen settings
        run: >-
          python scripts/research_orb_multiyear.py validation
          --source "$SOURCE_DIR" --output "$STUDY_DIR" --workers 2
      - name: Evaluate final held-out year
        run: >-
          python scripts/research_orb_multiyear.py final
          --source "$SOURCE_DIR" --output "$STUDY_DIR" --workers 2
      - name: Verify gross P&L with independent Backtrader engine
        run: >-
          python scripts/external_backtrader_oracle.py
          --study-dir "$STUDY_DIR"
          --output "$STUDY_DIR/external_backtrader.json"
      - name: Summarize conditional research evidence
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["STUDY_DIR"])
          manifest = json.loads((root / "data_manifest.json").read_text())
          selection = json.loads((root / "selection.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write("## ORB monthly-options research\n\n")
              stream.write(f"Sessions: {len(manifest['sessions'])}. ")
              stream.write(f"Frozen research candidate: {selection['candidate']}.\n\n")
              stream.write("Conditional bar research only. Timestamp conventions, ")
              stream.write("continuous future identity and executable quotes remain ")
              stream.write("unverified. Live settings are never promoted.\n\n")
              stream.write("| Period | Candidate | Slippage/side | Trades | Net P&L | PF |\n")
              stream.write("|---|---|---:|---:|---:|---:|\n")
              for phase in ("development", "validation", "final"):
                  for row in json.loads((root / f"{phase}_results.json").read_text()):
                      m = row["metrics"]
                      pf = "—" if m["profit_factor"] is None else f"{m['profit_factor']:.2f}"
                      unresolved = row["data_quality"]["unresolved_exit_count"]
                      stream.write(f"| {phase} | {row['candidate']} | ")
                      stream.write(f"{row['slippage_bps_per_side']} bps | ")
                      stream.write(
                          f"{m['trade_count']} (+{unresolved} unresolved) | "
                          f"{m['net_pnl']:.2f} | {pf} |\n"
                      )
          PY
      - name: Save research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orb-historical-research-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ env.STUDY_DIR }}/data_manifest.json
            ${{ env.STUDY_DIR }}/protocol.json
            ${{ env.STUDY_DIR }}/selection.json
            ${{ env.STUDY_DIR }}/*_results.json
            ${{ env.STUDY_DIR }}/external_backtrader.json


  five-run-lifecycle-study:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[Backtest] ORB Lifecycle')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXECUTION_MODE: SHADOW
      LIVE_TRADING_ENABLED: "false"
      PAPER_TRADING: "true"
      BROKER_API_KEY: offline_research_unused
      BROKER_API_SECRET: offline_research_unused
    steps:
      - uses: actions/checkout@v4
      - name: Set isolated lifecycle research paths
        run: |
          printf 'SOURCE_DIR=%s/orb-public-source\nSTUDY_DIR=%s/orb-lifecycle-study\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install -e '.[research]'
      - name: Cache checksum-verified public archive
        uses: actions/cache@v4
        with:
          path: ${{ env.SOURCE_DIR }}
          key: zenodo-10899828-717d15361af52d1d654b4909d998967e
      - name: Verify and prepare historical baskets
        run: >-
          python scripts/research_orb_multiyear.py prepare
          --source "$SOURCE_DIR" --output "$STUDY_DIR"
      - name: Run five ORB lifecycle experiments
        run: >-
          python scripts/research_orb_iterative.py
          --study-dir "$STUDY_DIR" --workers 2
      - name: Summarize five-run results
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["STUDY_DIR"])
          rows = json.loads((root / "iterative_summary.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write("## ORB five-run lifecycle research\n\n")
              stream.write("10 bps/side headline view; 25/50 bps stress is in artifacts.\n\n")
              stream.write("| Candidate | Dev P&L | 2019 P&L | 2020 P&L | Final PF | Final trades |\n")
              stream.write("|---|---:|---:|---:|---:|---:|\n")
              for row in rows:
                  dev = row.get("development", {})
                  val = row.get("validation", {})
                  final = row.get("final", {})
                  pf = final.get("profit_factor")
                  pf_text = "—" if pf is None else f"{pf:.2f}"
                  stream.write(
                      f"| {row['candidate']} | {dev.get('net_pnl', 0):.2f} | "
                      f"{val.get('net_pnl', 0):.2f} | {final.get('net_pnl', 0):.2f} | "
                      f"{pf_text} | {final.get('trades', 0)} |\n"
                  )
          PY
      - name: Save lifecycle research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orb-five-run-lifecycle-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ env.STUDY_DIR }}/data_manifest.json
            ${{ env.STUDY_DIR }}/iterative_protocol.json
            ${{ env.STUDY_DIR }}/iterative_*.json


  quality-score-8-study:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[Backtest] ORB Quality8')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXECUTION_MODE: SHADOW
      LIVE_TRADING_ENABLED: "false"
      PAPER_TRADING: "true"
      BROKER_API_KEY: offline_research_unused
      BROKER_API_SECRET: offline_research_unused
    steps:
      - uses: actions/checkout@v4
      - name: Set isolated score-8 research paths
        run: |
          printf 'SOURCE_DIR=%s/orb-public-source\nSTUDY_DIR=%s/orb-quality8-study\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install -e '.[research]'
      - name: Cache checksum-verified public archive
        uses: actions/cache@v4
        with:
          path: ${{ env.SOURCE_DIR }}
          key: zenodo-10899828-717d15361af52d1d654b4909d998967e
      - name: Verify and prepare historical baskets
        run: >-
          python scripts/research_orb_multiyear.py prepare
          --source "$SOURCE_DIR" --output "$STUDY_DIR"
      - name: Run ORB quality-score-8 experiment
        run: >-
          python scripts/research_orb_iterative.py
          --study-dir "$STUDY_DIR" --workers 2
          --candidate quality_score_8
      - name: Summarize score-8 results
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["STUDY_DIR"])
          rows = json.loads((root / "iterative_summary.json").read_text())
          row = rows[0]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write("## ORB quality score 8 research\n\n")
              stream.write("| Period | Trades | Net P&L | Expectancy | PF | Win rate | Max DD |\n")
              stream.write("|---|---:|---:|---:|---:|---:|---:|\n")
              for phase in ("development", "validation", "final"):
                  m = row.get(phase, {})
                  pf = m.get("profit_factor")
                  wr = m.get("win_rate")
                  stream.write(
                      f"| {phase} | {m.get('trades', 0)} | {m.get('net_pnl', 0):.2f} | "
                      f"{(m.get('expectancy') or 0):.2f} | "
                      f"{'—' if pf is None else f'{pf:.3f}'} | "
                      f"{'—' if wr is None else f'{wr:.1%}'} | "
                      f"{m.get('max_realized_drawdown', 0):.2f} |\n"
                  )
          PY
      - name: Save score-8 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orb-quality8-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ env.STUDY_DIR }}/data_manifest.json
            ${{ env.STUDY_DIR }}/iterative_protocol.json
            ${{ env.STUDY_DIR }}/iterative_*.json


  score-calibration-study:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[Backtest] ORB ScoreCalibration')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXECUTION_MODE: SHADOW
      LIVE_TRADING_ENABLED: "false"
      PAPER_TRADING: "true"
      BROKER_API_KEY: offline_research_unused
      BROKER_API_SECRET: offline_research_unused
    steps:
      - uses: actions/checkout@v4
      - name: Set isolated score-calibration paths
        run: |
          printf 'SOURCE_DIR=%s/orb-public-source\nSTUDY_DIR=%s/orb-score-calibration\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install -e '.[research]'
      - name: Cache checksum-verified public archive
        uses: actions/cache@v4
        with:
          path: ${{ env.SOURCE_DIR }}
          key: zenodo-10899828-717d15361af52d1d654b4909d998967e
      - name: Verify and prepare historical baskets
        run: >-
          python scripts/research_orb_multiyear.py prepare
          --source "$SOURCE_DIR" --output "$STUDY_DIR"
      - name: Run score-calibration reference
        run: >-
          python scripts/research_orb_iterative.py
          --study-dir "$STUDY_DIR" --workers 2
          --candidate lifecycle_reference_075_25
      - name: Analyze score calibration
        run: >-
          python scripts/analyze_orb_score_calibration.py
          --study-dir "$STUDY_DIR"
      - name: Save score-calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orb-score-calibration-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ env.STUDY_DIR }}/data_manifest.json
            ${{ env.STUDY_DIR }}/iterative_protocol.json
            ${{ env.STUDY_DIR }}/iterative_*.json
            ${{ env.STUDY_DIR }}/score_calibration.json
