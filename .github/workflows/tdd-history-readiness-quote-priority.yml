name: TDD history readiness quote priority

on:
  push:
    branches:
      - fix/readiness-freshest-cached-quote

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: pip install -e '.[test]'
      - name: Prove red test
        run: |
          set +e
          python -m pytest -q tests/core/test_history_readiness_cached_quote_priority.py
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected regression to fail before source correction.'
            exit 1
          fi
      - name: Apply minimal canonical-MDM-first fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/nifty_scalper_bot/core/history_readiness.py')
          text = path.read_text()
          old = '''def _get_cached_quote(ctx: "BotContext", symbol: str) -> Mapping[str, Any]:
    """Return cached quote/tick data without pulling broker APIs."""
    for provider in (getattr(ctx, "data_hub", None), getattr(ctx, "datahub", None)):
        if provider is None:
            continue
        fn = getattr(provider, "get_quote", None)
        if callable(fn):
            try:
                quote = fn(symbol, allow_pull=False)
            except TypeError:
                try:
                    quote = fn(symbol)
                except Exception:
                    quote = None
            except Exception:
                quote = None
            if isinstance(quote, Mapping):
                return quote
    mdm = getattr(ctx, "market_data_manager", None)
    for name in ("get_quote", "get_latest_tick", "get_last_tick"):
        fn = getattr(mdm, name, None)
        if callable(fn):
            try:
                quote = fn(symbol)
            except Exception:
                quote = None
            if isinstance(quote, Mapping):
                return quote
'''
          new = '''def _get_cached_quote(ctx: "BotContext", symbol: str) -> Mapping[str, Any]:
    """Return the canonical MDM cached tick, with DataHub as read-facade fallback."""
    mdm = getattr(ctx, "market_data_manager", None)
    for name in ("get_latest_tick", "get_last_tick", "get_quote"):
        fn = getattr(mdm, name, None)
        if callable(fn):
            try:
                quote = fn(symbol)
            except Exception:
                quote = None
            if isinstance(quote, Mapping) and quote:
                return quote
    for provider in (getattr(ctx, "data_hub", None), getattr(ctx, "datahub", None)):
        if provider is None:
            continue
        fn = getattr(provider, "get_quote", None)
        if callable(fn):
            try:
                quote = fn(symbol, allow_pull=False)
            except TypeError:
                try:
                    quote = fn(symbol)
                except Exception:
                    quote = None
            except Exception:
                quote = None
            if isinstance(quote, Mapping):
                return quote
'''
          if old not in text:
              raise SystemExit('target block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Prove green and focused readiness suite
        run: |
          python -m pytest -q tests/core/test_history_readiness_cached_quote_priority.py tests/core/test_readiness_live_tick_proof.py
          python -m compileall -q src
      - name: Commit source correction and remove helper workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/tdd-history-readiness-quote-priority.yml
          git add src/nifty_scalper_bot/core/history_readiness.py tests/core/test_history_readiness_cached_quote_priority.py .github/workflows/tdd-history-readiness-quote-priority.yml
          git commit -m 'fix: use canonical MDM quote for live readiness'
          git push origin HEAD:fix/readiness-freshest-cached-quote
