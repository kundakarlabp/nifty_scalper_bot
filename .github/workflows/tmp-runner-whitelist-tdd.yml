name: Temporary Runner Whitelist TDD

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/nifty_scalper_bot/strategies/runner.py'
      - 'tests/strategies/test_dynamic_symbol_activation.py'
      - '.github/workflows/tmp-runner-whitelist-tdd.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
      - name: Focused and adjacent runner tests
        env:
          BRACKET_AUTO_RESTORE: 'false'
        run: |
          python -m pytest -q \
            tests/strategies/test_dynamic_symbol_activation.py \
            tests/strategies/test_runner_active_basket_pending.py \
            tests/e2e/live_sim/test_post885_live_safety_architecture.py
      - name: Compile source tree
        run: python -m compileall -q src
      - name: Diff integrity
        run: git diff --check origin/main...HEAD
      - name: Ruff changed regression test
        run: python -m ruff check tests/strategies/test_dynamic_symbol_activation.py
      - name: Black changed regression test
        run: python -m black --check tests/strategies/test_dynamic_symbol_activation.py
      - name: Full test suite
        env:
          BRACKET_AUTO_RESTORE: 'false'
        run: python -m pytest -q
