name: Minimum Lot Affordability Commit

on:
  push:
    branches:
      - fix/minimum-lot-affordability-readiness-20260806

permissions:
  contents: write

concurrency:
  group: minimum-lot-affordability-commit
  cancel-in-progress: false

jobs:
  commit-validated-tree:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/minimum-lot-affordability-readiness-20260806
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q
          python -m pip install pyyaml -q

      - name: Reproduce the fully validated tree
        env:
          BRACKET_AUTO_RESTORE: 'false'
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          import yaml

          workflow = yaml.safe_load(
              Path('.github/workflows/minimum-lot-affordability-merge-ready.yml')
              .read_text(encoding='utf-8')
          )
          wanted = {
              'Apply production correction, uptime fix, and regressions',
              'Correct import ordering and format',
              'Focused and adjacent regressions',
              'Compile, fatal Ruff, and Black',
              'Complete repository suite',
          }
          env = dict(os.environ)
          env['BRACKET_AUTO_RESTORE'] = 'false'
          seen = set()
          for step in workflow['jobs']['validate-and-commit']['steps']:
              name = step.get('name')
              if name not in wanted:
                  continue
              subprocess.run(
                  step['run'],
                  shell=True,
                  executable='/bin/bash',
                  check=True,
                  env=env,
              )
              seen.add(name)
          missing = wanted - seen
          if missing:
              raise SystemExit(f'validated steps missing: {sorted(missing)}')
          PY

      - name: Remove runtime artifacts and verify change surface
        run: |
          git restore --source=HEAD --worktree --staged positions.json 2>/dev/null || rm -f positions.json
          rm -rf .pytest-data-dir
          python - <<'PY'
          import subprocess

          intended = {
              'src/nifty_scalper_bot/execution/affordability.py',
              'src/nifty_scalper_bot/execution/readiness.py',
              'src/nifty_scalper_bot/core/app.py',
              'src/nifty_scalper_bot/main.py',
              'tests/execution/test_minimum_lot_affordability.py',
              'tests/core/test_minimum_lot_affordability_readiness.py',
              'tests/core/test_readiness_live_tick_proof.py',
          }
          status = subprocess.check_output(
              ['git', 'status', '--porcelain'], text=True
          ).splitlines()
          actual = {line[3:] for line in status if len(line) >= 4}
          unexpected = {
              path
              for path in actual - intended
              if not path.startswith('.github/workflows/minimum-lot-')
              and not path.startswith('.ci/')
          }
          if unexpected:
              raise SystemExit(f'unexpected changes: {sorted(unexpected)}')
          if intended - actual:
              raise SystemExit(f'missing intended changes: {sorted(intended - actual)}')
          PY

      - name: Commit only production code and regressions
        run: |
          rm -rf .ci .pytest-data-dir
          find .github/workflows -maxdepth 1 -type f \
            -name 'minimum-lot-affordability-*.yml' -print -delete
          git restore --source=HEAD --worktree --staged positions.json 2>/dev/null || rm -f positions.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(execution): gate live readiness on minimum lot affordability [skip ci]'
          git push origin HEAD:fix/minimum-lot-affordability-readiness-20260806
