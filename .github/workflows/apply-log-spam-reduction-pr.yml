name: Apply log-spam reduction on PR

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply_log_spam_reduction_once.py
      - .github/workflows/apply-log-spam-reduction-pr.yml
      - .github/workflows/apply-log-spam-reduction-once.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply exact source and test patches
        run: python scripts/apply_log_spam_reduction_once.py

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q

      - name: Focused regression tests
        run: |
          python -m pytest -q \
            tests/core/test_production_log_noise_control.py \
            tests/core/test_boot_log_role_telemetry.py \
            tests/core/test_boot_log_safety.py \
            tests/utils/test_log_throttle_pending_regressions.py

      - name: Commit observability-only changes and remove one-shot helpers
        shell: bash
        run: |
          rm -f scripts/apply_log_spam_reduction_once.py
          rm -f .github/workflows/apply-log-spam-reduction-pr.yml
          rm -f .github/workflows/apply-log-spam-reduction-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: reduce steady-state production log noise"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
