name: Clean live-sim fixture import

on:
  push:
    branches:
      - fix/live-sim-expiry-fixture-20260827

permissions:
  contents: write

jobs:
  clean-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-sim-expiry-fixture-20260827
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q
      - name: Remove now-unused date import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/live_sim/test_live_runtime_startup_contract.py')
          text = path.read_text()
          old = 'from datetime import date, datetime\n'
          new = 'from datetime import datetime\n'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('expected datetime import line not found')
          PY
      - name: Targeted live runtime test
        env:
          ALLOW_NETWORK: 'false'
          ALLOW_REAL_BROKER: 'false'
          BROKER_SIMULATION: 'true'
          EXECUTION_MODE: LIVE_SIMULATION
        run: python -m pytest -q -m live_runtime_e2e tests/e2e/live_sim
      - name: Full regression suite
        env:
          BRACKET_AUTO_RESTORE: 'false'
        run: python -m pytest -q
      - name: Commit test-only cleanup
        run: |
          if git diff --quiet -- tests/e2e/live_sim/test_live_runtime_startup_contract.py; then
            echo 'Import already clean; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/live_sim/test_live_runtime_startup_contract.py
          git commit -m 'test(e2e): remove stale date import'
          git push origin HEAD:fix/live-sim-expiry-fixture-20260827
