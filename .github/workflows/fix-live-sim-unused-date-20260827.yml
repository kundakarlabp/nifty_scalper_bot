name: Finish live-sim fixture cleanup

on:
  push:
    branches:
      - fix/live-sim-expiry-fixture-20260827

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-sim-expiry-fixture-20260827
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]' -q
      - name: Remove unused import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/live_sim/test_live_runtime_startup_contract.py')
          text = path.read_text()
          old = 'from datetime import date, datetime\n'
          new = 'from datetime import datetime\n'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('expected datetime import line not found')
          PY
      - name: Targeted live-runtime validation
        env:
          ALLOW_NETWORK: 'false'
          ALLOW_REAL_BROKER: 'false'
          BROKER_SIMULATION: 'true'
          EXECUTION_MODE: LIVE_SIMULATION
        run: python -m pytest -q -m live_runtime_e2e tests/e2e/live_sim
      - name: Commit cleanup and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-live-sim-unused-date-20260827.yml
          git add tests/e2e/live_sim/test_live_runtime_startup_contract.py
          git commit -m 'test(e2e): finish current-contract fixture cleanup'
          git push origin HEAD:fix/live-sim-expiry-fixture-20260827
