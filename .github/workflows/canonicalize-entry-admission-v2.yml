name: Canonicalize entry admission v2

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'canonical-entry-admission-cleanup-20260913'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonical-entry-admission-cleanup-20260913
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply source migration
        shell: bash
        run: |
          python tools/canonicalize_entry_admission_once.py
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/core/test_strategy_setup_score_gate.py')
          text = path.read_text(encoding='utf-8')
          old = '''def test_context_cannot_promote_an_explicitly_failed_trigger() -> None:\n    manager = StrategyManager.__new__(StrategyManager)\n'''
          new = old + '    manager._last_no_signal_decision_by_symbol = {}\n'
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate source migration
        shell: bash
        run: |
          python -m pip install -e '.[dev]' -q
          python -m black \
            src/nifty_scalper_bot/core/strategy_manager.py \
            src/nifty_scalper_bot/core/strategy_vote_policy.py \
            src/nifty_scalper_bot/core/strategy_setup_score_gate.py \
            src/nifty_scalper_bot/core/__init__.py \
            src/nifty_scalper_bot/core/runtime_reliability_hardening.py \
            tests/core/test_postmerge_trade_path.py \
            tests/core/test_strategy_setup_score_gate.py
          python -m compileall -q src/nifty_scalper_bot/core src/nifty_scalper_bot/strategies
          python -m pytest -q \
            tests/core/test_strategy_setup_score_gate.py \
            tests/strategies/test_single_vote_score_floor.py \
            tests/core/test_postmerge_trade_path.py \
            tests/core/test_runtime_reliability_followup.py \
            tests/core/test_strategy_manager_regime_fallback.py \
            tests/strategies/test_vwap_metadata_contract_side.py
          python -m ruff check \
            src/nifty_scalper_bot/core/strategy_manager.py \
            src/nifty_scalper_bot/core/strategy_vote_policy.py \
            src/nifty_scalper_bot/core/strategy_setup_score_gate.py \
            src/nifty_scalper_bot/core/__init__.py \
            src/nifty_scalper_bot/core/runtime_reliability_hardening.py \
            tests/core/test_postmerge_trade_path.py \
            tests/core/test_strategy_setup_score_gate.py
          python -m black --check \
            src/nifty_scalper_bot/core/strategy_manager.py \
            src/nifty_scalper_bot/core/strategy_vote_policy.py \
            src/nifty_scalper_bot/core/strategy_setup_score_gate.py \
            src/nifty_scalper_bot/core/__init__.py \
            src/nifty_scalper_bot/core/runtime_reliability_hardening.py \
            tests/core/test_postmerge_trade_path.py \
            tests/core/test_strategy_setup_score_gate.py
      - name: Publish source migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/nifty_scalper_bot/core/strategy_manager.py \
            src/nifty_scalper_bot/core/strategy_vote_policy.py \
            src/nifty_scalper_bot/core/strategy_setup_score_gate.py \
            src/nifty_scalper_bot/core/__init__.py \
            src/nifty_scalper_bot/core/runtime_reliability_hardening.py \
            tests/core/test_postmerge_trade_path.py \
            tests/core/test_strategy_setup_score_gate.py
          if git diff --cached --quiet; then
            echo 'No source change required.'
            exit 0
          fi
          git commit -m 'Refactor: canonicalize entry admission ownership'
          git push origin HEAD:canonical-entry-admission-cleanup-20260913
