name: Live Entry Lifecycle Fix Once

on:
  push:
    branches:
      - fix/live-entry-lifecycle-20260904

permissions:
  contents: write

jobs:
  apply-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      BRACKET_AUTO_RESTORE: "false"
      NSB_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-entry-lifecycle-20260904
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q
      - name: Apply canonical corrections
        run: |
          python scripts/apply_live_entry_lifecycle_fix.py
      - name: Format new regression test only
        run: |
          python -m ruff check --fix tests/execution/test_live_entry_lifecycle_regressions.py
          python -m black tests/execution/test_live_entry_lifecycle_regressions.py
      - name: Incident and adjacent regressions
        run: |
          python -m pytest -q \
            tests/execution/test_live_entry_lifecycle_regressions.py \
            tests/execution/test_entry_recovery_hardening.py \
            tests/execution/test_bracket_manager_state.py \
            tests/execution/test_lifecycle_entry_guards.py \
            tests/execution/test_exit_reconciliation_race.py \
            tests/execution/test_canonical_execution_recovery.py \
            tests/core/test_watchdog_pair_transition_epoch.py \
            tests/strategies/test_continuous_live_entry_eval.py
      - name: Compile and changed-file quality
        run: |
          python -m compileall -q src dashboard scripts
          python -m ruff check --ignore E501 \
            src/nifty_scalper_bot/execution/runtime_order_manager.py \
            src/nifty_scalper_bot/strategies/runner.py
          python -m ruff check \
            tests/execution/test_live_entry_lifecycle_regressions.py
          python -m black --check tests/execution/test_live_entry_lifecycle_regressions.py
      - name: Full repository suite
        run: python -m pytest -q
      - name: Clean temporary implementation files
        run: |
          git checkout -- positions.json 2>/dev/null || true
          rm -rf .pytest-data-dir .pytest_cache
          rm -f scripts/apply_live_entry_lifecycle_fix.py
          rm -f .github/workflows/live-entry-lifecycle-fix-once.yml
      - name: Verify final diff scope
        run: |
          git status --short
          python - <<'PY'
          import subprocess
          allowed = {
              'src/nifty_scalper_bot/execution/runtime_order_manager.py',
              'src/nifty_scalper_bot/strategies/runner.py',
              'tests/execution/test_live_entry_lifecycle_regressions.py',
              'scripts/apply_live_entry_lifecycle_fix.py',
              '.github/workflows/live-entry-lifecycle-fix-once.yml',
          }
          lines = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          changed = {line[3:] for line in lines if len(line) > 3}
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f'unexpected files: {unexpected}')
          required = {
              'src/nifty_scalper_bot/execution/runtime_order_manager.py',
              'src/nifty_scalper_bot/strategies/runner.py',
              'tests/execution/test_live_entry_lifecycle_regressions.py',
          }
          missing = sorted(required - changed)
          if missing:
              raise SystemExit(f'missing expected source/test changes: {missing}')
          print('validated final files:', sorted(changed))
          PY
      - name: Commit validated correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(execution): converge cancelled flat entries and eval liveness'
          git push origin HEAD:fix/live-entry-lifecycle-20260904
