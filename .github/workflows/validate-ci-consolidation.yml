name: Validate CI Consolidation

on:
  push:
    branches: [ci-validation-proof-76d91db]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BRACKET_AUTO_RESTORE: "false"
      ALLOW_NETWORK: "false"
      ALLOW_REAL_BROKER: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9ea2f30f4d871122868a8a35fdbe7e089995aa6b
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q
      - name: Compile
        run: python -m compileall -q src dashboard scripts
      - name: CI architecture regressions
        run: |
          python -m pytest -q tests/architecture/test_ci_workflow_catalog.py
          python -m pytest -q tests/architecture/test_file_header_standard.py
      - name: Ruff and Black changed architecture tests
        run: |
          python -m ruff check tests/architecture/test_ci_workflow_catalog.py tests/architecture/test_file_header_standard.py
          python -m black --check --diff tests/architecture/test_ci_workflow_catalog.py tests/architecture/test_file_header_standard.py
      - name: Normal repository suite
        run: python -m pytest -q -m "not slow and not simulation_component and not live_runtime_e2e and not e2e_live_sim"
      - name: Deterministic E2E suite
        env:
          BROKER_SIMULATION: "true"
          EXECUTION_MODE: LIVE_SIMULATION
        run: python -m pytest -q tests/e2e/live_sim -m "simulation_component or live_runtime_e2e or e2e_live_sim"
