# File purpose: Authenticate a Breeze research session in isolation.
# Key responsibilities: Validate broker login and the documented option-history sample.
# Operational constraints: Read-only; no orders, live imports or public market-data artifacts.
name: Breeze research authentication smoke

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/breeze-auth-smoke.yml
      - scripts/archive_breeze_history.py

permissions:
  contents: read

jobs:
  authenticate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned official research SDK
        run: python -m pip install --disable-pip-version-check 'breeze-connect==1.0.69'
      - name: Validate only Breeze session (no orders or history downloads)
        env:
          BREEZE_API_KEY: ${{ secrets.BREEZE_API_KEY }}
          BREEZE_API_SECRET: ${{ secrets.BREEZE_API_SECRET }}
          BREEZE_SESSION_TOKEN: ${{ secrets.BREEZE_SESSION_TOKEN }}
        run: python scripts/archive_breeze_history.py --auth-only
      - name: Test read-only documented historical option pair (no artifact)
        env:
          BREEZE_API_KEY: ${{ secrets.BREEZE_API_KEY }}
          BREEZE_API_SECRET: ${{ secrets.BREEZE_API_SECRET }}
          BREEZE_SESSION_TOKEN: ${{ secrets.BREEZE_SESSION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/archive_breeze_history.py \
            --day 2025-02-03 --expiry 2025-02-06 --strike 23200 \
            --timestamp-convention bar_start --outdir "$RUNNER_TEMP/breeze-smoke" \
            > "$RUNNER_TEMP/breeze-summary.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "breeze-summary.json").read_text()
          )
          bars = {side: report["contracts"][side]["bars"] for side in ("CE", "PE")}
          print("Breeze historical read-only minute counts:", bars)
          if any(count < 1 for count in bars.values()):
              raise SystemExit("Broker history returned no observed minutes")
          PY
