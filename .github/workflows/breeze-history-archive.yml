# File purpose: Acquire historical NIFTY data without publishing broker data.
# Key responsibilities: Bounded offline collection and authenticated encryption.
# Operational constraints: Main only; no orders or production-host access.
name: Breeze private history archive

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - deploy/breeze_collection_request.json

permissions:
  contents: read

concurrency:
  group: breeze-history-archive
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated official SDK
        run: python -m pip install --disable-pip-version-check 'breeze-connect==1.0.69'
      - name: Prepare private temporary workspace and validate transport certificate
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/breeze-private" "$RUNNER_TEMP/breeze-export"
          openssl x509 -in deploy/breeze_transport_recipient.pem -noout -checkend 7200
      - name: Collect bounded market history
        timeout-minutes: 100
        env:
          BREEZE_API_KEY: ${{ secrets.BREEZE_API_KEY }}
          BREEZE_API_SECRET: ${{ secrets.BREEZE_API_SECRET }}
          BREEZE_SESSION_TOKEN: ${{ secrets.BREEZE_SESSION_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m scripts.archive_breeze_bulk
          --request deploy/breeze_collection_request.json
          --outdir "$RUNNER_TEMP/breeze-private"
      - name: Encrypt all collected market files including partial coverage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ -d "$RUNNER_TEMP/breeze-private" ]; then
            tar -czf "$RUNNER_TEMP/breeze-private.tar.gz" -C "$RUNNER_TEMP/breeze-private" .
            openssl cms -encrypt -binary -aes-256-gcm \
              -in "$RUNNER_TEMP/breeze-private.tar.gz" \
              -outform DER -out "$RUNNER_TEMP/breeze-export/history.cms" \
              deploy/breeze_transport_recipient.pem
            cd "$RUNNER_TEMP/breeze-export"
            sha256sum history.cms > history.cms.sha256
          fi
      - name: Preserve encrypted transport only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breeze-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/breeze-export/
          if-no-files-found: error
          retention-days: 3
