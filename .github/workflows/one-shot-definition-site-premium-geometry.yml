name: One-shot definition-site premium geometry

on:
  push:
    branches:
      - fix/definition-site-premium-geometry

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/definition-site-premium-geometry
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consolidate premium geometry at definition sites
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          ROOT = Path.cwd()

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")

          def replace_once(text: str, old: str, new: str, *, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          # 1. Convert the runtime patch module into a side-effect-free strategy helper.
          old_helper_path = "src/nifty_scalper_bot/execution/premium_risk_contract_patch.py"
          new_helper_path = "src/nifty_scalper_bot/strategies/premium_risk_geometry.py"
          old_helper = read(old_helper_path)
          function_start = old_helper.index("def _positive_float")
          function_end = old_helper.index("\ndef _enrich_virtual_bracket_kwargs", function_start)
          pure_functions = old_helper[function_start:function_end].rstrip()
          helper = '''"""Canonical option-premium risk geometry.

This module is deliberately side-effect free.  StrategyRunner calls these
functions directly, so live, paper, replay, and tests use identical geometry
without import-order hooks or class mutation.
"""

from __future__ import annotations

import dataclasses
from contextlib import suppress
from typing import Any, Mapping

_TICK_SIZE = 0.05

'''
          helper += pure_functions
          helper += '''\n\n__all__ = [
    "anchor_option_geometry_to_execution",
    "apply_premium_risk_contract",
    "validate_option_premium_geometry",
]\n'''
          write(new_helper_path, helper)
          (ROOT / old_helper_path).unlink()

          # 2. Make StrategyRunner own and call the canonical geometry directly.
          runner_path = "src/nifty_scalper_bot/strategies/runner.py"
          runner = read(runner_path)
          signal_import = "from nifty_scalper_bot.strategies.signal_generator import Signal\n"
          geometry_import = '''from nifty_scalper_bot.strategies.premium_risk_geometry import (
    anchor_option_geometry_to_execution,
    apply_premium_risk_contract,
    validate_option_premium_geometry,
)
'''
          runner = replace_once(
              runner,
              signal_import,
              geometry_import + signal_import,
              label="runner geometry import",
          )

          methods_start = runner.index("    def _validate_long_option_geometry(")
          methods_end = runner.index("    def aggregate_signals_by_symbol(", methods_start)
          canonical_methods = '''    def _validate_long_option_geometry(
        self,
        signal: Signal,
        entry_price: float,
        entry_side: OrderSide,
        atr: float,
    ) -> Signal:
        """Validate option exits in the premium price domain."""
        return validate_option_premium_geometry(
            self,
            signal,
            entry_price=entry_price,
            entry_side=entry_side,
            atr=atr,
        )

    def _anchor_sl_tp_to_execution(
        self,
        signal: Signal,
        *,
        signal_price: float,
        execution_price: float,
        entry_side: OrderSide,
        atr: float,
        sl_mult: float = 1.5,
        tp_mult: float = 3.0,
    ) -> Signal:
        """Translate valid distance geometry to execution without widening it."""
        return anchor_option_geometry_to_execution(
            self,
            signal,
            signal_price=signal_price,
            execution_price=execution_price,
            entry_side=entry_side,
            atr=atr,
            sl_mult=sl_mult,
            tp_mult=tp_mult,
        )

'''
          runner = runner[:methods_start] + canonical_methods + runner[methods_end:]

          materialise_old = '''            try:
                signal = dataclasses.replace(signal, metadata=dict(metadata))
                signal = self._materialize_option_trade_plan(
'''
          materialise_new = '''            try:
                signal = apply_premium_risk_contract(
                    dataclasses.replace(signal, metadata=dict(metadata)),
                    float(trade_price or 0.0),
                )
                signal = self._materialize_option_trade_plan(
'''
          runner = replace_once(
              runner,
              materialise_old,
              materialise_new,
              label="runner direct premium contract",
          )
          write(runner_path, runner)

          # 3. Reinflate TP1/trailing fields at the actual fill-registration site.
          order_core_path = "src/nifty_scalper_bot/execution/order_manager_core.py"
          order_core = read(order_core_path)
          trade_plan_marker = "\n\n@dataclass(slots=True)\nclass TradePlan:"
          helper_insert = '''

def _positive_exit_provenance_value(value: Any) -> float | None:
    """Return a finite positive provenance value, otherwise ``None``."""
    with suppress(TypeError, ValueError):
        parsed = float(value)
        if math.isfinite(parsed) and parsed > 0.0:
            return parsed
    return None


def _virtual_bracket_exit_fields(
    provenance: Mapping[str, Any] | None,
) -> dict[str, Any]:
    """Resolve optional bracket fields from durable trade provenance."""
    if not isinstance(provenance, Mapping):
        return {}
    nested = provenance.get("exit_plan")
    source = nested if isinstance(nested, Mapping) else provenance
    fields: dict[str, Any] = {}
    for key in ("tp1_price", "trailing_atr_mult"):
        value = _positive_exit_provenance_value(source.get(key))
        if value is not None:
            fields[key] = value
    for key in ("tp1_qty", "resolved_lot_size"):
        value = _positive_exit_provenance_value(source.get(key))
        if value is not None:
            fields[key] = int(value)
    return fields
'''
          order_core = replace_once(
              order_core,
              trade_plan_marker,
              helper_insert + trade_plan_marker,
              label="order core provenance helper",
          )

          method_start = order_core.index("    def _register_virtual_bracket_for_fill(")
          method_end = order_core.index("\n    def ", method_start + 10)
          method = order_core[method_start:method_end]
          registration_old = "                self._bracket_manager.register_virtual_bracket(\n"
          registration_new = '''                exit_fields = _virtual_bracket_exit_fields(
                    order.trade_provenance
                )
                resolved_lot_size = int(
                    getattr(order, "resolved_lot_size", 0) or 0
                )
                if resolved_lot_size > 0:
                    exit_fields.setdefault("resolved_lot_size", resolved_lot_size)
                self._bracket_manager.register_virtual_bracket(
'''
          method = replace_once(
              method,
              registration_old,
              registration_new,
              label="fill registration exit fields",
          )
          call_tail_old = '''                    intent=str(getattr(order, "intent", "ENTRY") or "ENTRY"),
                    trade_provenance=order.trade_provenance,
                )
'''
          call_tail_new = '''                    intent=str(getattr(order, "intent", "ENTRY") or "ENTRY"),
                    trade_provenance=order.trade_provenance,
                    **exit_fields,
                )
                tp1_armed = bool(
                    exit_fields.get("tp1_price") and exit_fields.get("tp1_qty")
                )
                self._logger.info(
                    "TP1_BRACKET_%s order_id=%s symbol=%s tp1_price=%s tp1_qty=%s lot_size=%s reason=%s",
                    "ARMED" if tp1_armed else "SKIPPED",
                    order.order_id,
                    order.symbol,
                    exit_fields.get("tp1_price"),
                    exit_fields.get("tp1_qty"),
                    exit_fields.get("resolved_lot_size"),
                    order.trade_provenance.get("tp1_skip_reason"),
                    extra={
                        "event": "TP1_BRACKET_ARMED" if tp1_armed else "TP1_BRACKET_SKIPPED",
                        "order_id": order.order_id,
                        "symbol": order.symbol,
                        "tp1_price": exit_fields.get("tp1_price"),
                        "tp1_qty": exit_fields.get("tp1_qty"),
                        "resolved_lot_size": exit_fields.get("resolved_lot_size"),
                        "reason": order.trade_provenance.get("tp1_skip_reason"),
                    },
                )
'''
          method = replace_once(
              method,
              call_tail_old,
              call_tail_new,
              label="fill registration kwargs",
          )
          order_core = order_core[:method_start] + method + order_core[method_end:]
          write(order_core_path, order_core)

          # 4. Keep TP1 enrichment durable and make armed/skipped state observable.
          runtime_path = "src/nifty_scalper_bot/execution/runtime_order_manager.py"
          runtime = read(runtime_path)
          enrich_start = runtime.index("def _enrich_trade_plan_exit_provenance(")
          enrich_end = runtime.index("\ndef _submit_core_with_exit_provenance", enrich_start)
          enrich_function = '''def _enrich_trade_plan_exit_provenance(plan: Any) -> Any:
    """Persist lot-aligned TP1/trailing inputs in TradePlan provenance."""
    if str(getattr(plan, "intent", "ENTRY") or "ENTRY").upper() not in {
        "ENTRY",
        "SCALE_IN",
        "REVERSAL",
    }:
        return plan

    provenance = getattr(plan, "trade_provenance", {})
    enriched = dict(provenance) if isinstance(provenance, Mapping) else {}
    quantity = _positive_int(getattr(plan, "quantity", 0))
    lot_size = _positive_int(getattr(plan, "resolved_lot_size", 0))
    entry = _positive_float(getattr(plan, "entry_price", None))
    stop = _positive_float(getattr(plan, "stop_loss", None))
    target = _positive_float(getattr(plan, "take_profit", None))
    side = str(getattr(plan, "side", "BUY") or "BUY").upper()

    if lot_size > 0:
        enriched.setdefault("resolved_lot_size", lot_size)

    risk = None
    reward = None
    if entry is not None and stop is not None and target is not None:
        risk = entry - stop if side == "BUY" else stop - entry
        reward = target - entry if side == "BUY" else entry - target
        if risk > 0.0 and reward > 0.0:
            enriched.setdefault("initial_risk_points", float(risk))
            enriched.setdefault("initial_reward_points", float(reward))
            enriched.setdefault("initial_reward_risk", float(reward / risk))
        else:
            risk = reward = None

    tp1_enabled = str(
        os.getenv("ENABLE_TP1_SCALE_OUT", "true") or "true"
    ).strip().lower() in {"1", "true", "yes", "on"}
    total_lots = quantity // lot_size if lot_size > 0 else 0
    existing_tp1_price = _positive_float(enriched.get("tp1_price"))
    existing_tp1_qty = _positive_int(enriched.get("tp1_qty"))
    tp1_status = "skipped"
    tp1_skip_reason = "unknown"

    if existing_tp1_price is not None and existing_tp1_qty > 0:
        tp1_status = "armed"
        tp1_skip_reason = ""
    elif lot_size <= 0:
        tp1_skip_reason = "lot_size_unresolved"
    elif not tp1_enabled:
        tp1_skip_reason = "disabled"
    elif total_lots < 2:
        tp1_skip_reason = "single_lot"
    elif risk is None or reward is None or entry is None or target is None:
        tp1_skip_reason = "invalid_geometry"
    else:
        tp1_r = _positive_float(os.getenv("TP1_R_MULT", "1.0")) or 1.0
        tp1_lots = max(1, total_lots // 2)
        tp1_qty = tp1_lots * lot_size
        tp1_price = entry + risk * tp1_r if side == "BUY" else entry - risk * tp1_r
        strictly_before_final = (
            entry < tp1_price < target
            if side == "BUY"
            else target < tp1_price < entry
        )
        if tp1_qty >= quantity:
            tp1_skip_reason = "no_remainder"
        elif not strictly_before_final:
            tp1_skip_reason = "not_before_final_target"
        else:
            enriched.setdefault("tp1_price", float(tp1_price))
            enriched.setdefault("tp1_qty", int(tp1_qty))
            tp1_status = "armed"
            tp1_skip_reason = ""

    enriched["tp1_status"] = tp1_status
    if tp1_skip_reason:
        enriched["tp1_skip_reason"] = tp1_skip_reason
    else:
        enriched.pop("tp1_skip_reason", None)

    trailing_mult = _positive_float(enriched.get("trailing_atr_mult"))
    if trailing_mult is None:
        trailing_mult = _positive_float(os.getenv("BRACKET_TRAILING_ATR_MULT", "0"))
    if trailing_mult is not None:
        enriched["trailing_atr_mult"] = float(trailing_mult)

    setattr(plan, "trade_provenance", enriched)
    return plan

'''
          runtime = runtime[:enrich_start] + enrich_function + runtime[enrich_end + 1:]
          submit_old = '''    def submit_trade_plan_result(self, plan: Any) -> Any:
        _enrich_trade_plan_exit_provenance(plan)
        blocked = self._blocked("submit_trade_plan_result", (plan,), {})
'''
          submit_new = '''    def submit_trade_plan_result(self, plan: Any) -> Any:
        _enrich_trade_plan_exit_provenance(plan)
        provenance = getattr(plan, "trade_provenance", {}) or {}
        tp1_armed = provenance.get("tp1_status") == "armed"
        self._logger.info(
            "TP1_PLAN_%s symbol=%s qty=%s lot_size=%s tp1_price=%s tp1_qty=%s reason=%s",
            "ARMED" if tp1_armed else "SKIPPED",
            getattr(plan, "symbol", ""),
            getattr(plan, "quantity", 0),
            getattr(plan, "resolved_lot_size", 0),
            provenance.get("tp1_price"),
            provenance.get("tp1_qty"),
            provenance.get("tp1_skip_reason"),
            extra={
                "event": "TP1_PLAN_ARMED" if tp1_armed else "TP1_PLAN_SKIPPED",
                "symbol": getattr(plan, "symbol", ""),
                "quantity": getattr(plan, "quantity", 0),
                "resolved_lot_size": getattr(plan, "resolved_lot_size", 0),
                "tp1_price": provenance.get("tp1_price"),
                "tp1_qty": provenance.get("tp1_qty"),
                "reason": provenance.get("tp1_skip_reason"),
            },
        )
        blocked = self._blocked("submit_trade_plan_result", (plan,), {})
'''
          runtime = replace_once(
              runtime,
              submit_old,
              submit_new,
              label="runtime TP1 plan telemetry",
          )
          write(runtime_path, runtime)

          # 5. Delete both import-order installers.
          core_path = "src/nifty_scalper_bot/core/__init__.py"
          core = read(core_path)
          installer_start = core.index("\ndef _install_premium_geometry_runtime_hardening()")
          installer_end = core.index("\ndef _apply_app_runtime_patches", installer_start)
          core = core[:installer_start] + "\n" + core[installer_end:]
          core = replace_once(
              core,
              "    _install_premium_geometry_runtime_hardening()\n",
              "",
              label="core premium installer call",
          )
          write(core_path, core)

          execution_init_path = "src/nifty_scalper_bot/execution/__init__.py"
          execution_init = read(execution_init_path)
          execution_init = replace_once(
              execution_init,
              "from nifty_scalper_bot.execution.premium_risk_contract_patch import apply_patches as _apply_premium_risk_contract_patches\n",
              "",
              label="execution premium patch import",
          )
          execution_init = replace_once(
              execution_init,
              "_apply_premium_risk_contract_patches()\n",
              "",
              label="execution premium patch call",
          )
          write(execution_init_path, execution_init)

          # 6. Point tests at canonical code and prove import-order invariance.
          premium_test_old = "tests/execution/test_premium_risk_contract_patch.py"
          premium_test_new = "tests/strategies/test_premium_risk_geometry.py"
          premium_test = read(premium_test_old)
          premium_test = premium_test.replace(
              "from nifty_scalper_bot.execution.premium_risk_contract_patch import (",
              "from nifty_scalper_bot.strategies.premium_risk_geometry import (",
          )
          premium_test = premium_test.replace(
              "    install_runner_geometry_hardening,\n",
              "",
          )
          installer_test_start = premium_test.index(
              "\ndef test_runner_geometry_installer_is_idempotent()"
          )
          premium_test = premium_test[:installer_test_start].rstrip() + "\n"
          premium_test = premium_test.replace(
              "from __future__ import annotations\n",
              "from __future__ import annotations\n\nimport inspect\nimport subprocess\nimport sys\n",
              1,
          )
          premium_test += '''


def test_runner_geometry_is_owned_at_definition_site() -> None:
    from nifty_scalper_bot.strategies.runner import StrategyRunner

    assert StrategyRunner._validate_long_option_geometry.__module__ == (
        "nifty_scalper_bot.strategies.runner"
    )
    assert StrategyRunner._anchor_sl_tp_to_execution.__module__ == (
        "nifty_scalper_bot.strategies.runner"
    )


def test_plain_runner_import_has_canonical_geometry_without_core_app() -> None:
    code = """
from nifty_scalper_bot.strategies.runner import StrategyRunner
print('VALIDATE=' + StrategyRunner._validate_long_option_geometry.__module__)
print('ANCHOR=' + StrategyRunner._anchor_sl_tp_to_execution.__module__)
"""
    result = subprocess.run(
        [sys.executable, "-c", code],
        check=True,
        capture_output=True,
        text=True,
    )

    assert "VALIDATE=nifty_scalper_bot.strategies.runner" in result.stdout
    assert "ANCHOR=nifty_scalper_bot.strategies.runner" in result.stdout


def test_geometry_helper_has_no_class_mutation_hooks() -> None:
    import nifty_scalper_bot.strategies.premium_risk_geometry as geometry

    source = inspect.getsource(geometry)
    assert "StrategyRunner." not in source
    assert "StrategyManager.generate_signal =" not in source
    assert "install_runner_geometry_hardening" not in source
    assert "install_bracket_exit_provenance_hardening" not in source
'''
          write(premium_test_new, premium_test)
          (ROOT / premium_test_old).unlink()

          exit_test_path = "tests/execution/test_exit_geometry_provenance.py"
          exit_test = read(exit_test_path)
          exit_test = exit_test.replace(
              "import types\n",
              "import logging\nimport types\nfrom types import SimpleNamespace\n",
              1,
          )
          exit_test = exit_test.replace(
              "from nifty_scalper_bot.execution.order_manager import TradePlan\n",
              "from nifty_scalper_bot.execution.order_manager import (\n    OrderDetails,\n    OrderManager,\n    OrderStatus,\n    OrderType,\n    TradePlan,\n)\n",
              1,
          )
          old_patch_import = '''from nifty_scalper_bot.execution.premium_risk_contract_patch import (
    _enrich_virtual_bracket_kwargs,
    install_bracket_exit_provenance_hardening,
)
'''
          exit_test = replace_once(
              exit_test,
              old_patch_import,
              "",
              label="exit test patch import",
          )
          first_removed = exit_test.index(
              "\ndef test_fill_registration_restores_optional_exit_fields_from_provenance()"
          )
          recovery_start = exit_test.index(
              "\ndef test_recovery_submit_enriches_rebuilt_plan", first_removed
          )
          direct_fill_test = '''

def test_fill_registration_passes_tp1_through_actual_order_manager_path() -> None:
    class CapturingBracketManager:
        def __init__(self) -> None:
            self.bracket = None
            self.registration = {}

        def get_bracket(self, order_id):
            return self.bracket

        def has_active_bracket(self, symbol):
            return False

        def register_virtual_bracket(self, **kwargs):
            self.registration = dict(kwargs)
            self.bracket = SimpleNamespace(entry_confirmed=False, active=False)

        def confirm_entry_fill(self, order_id, fill_price, filled_qty=None):
            self.bracket.entry_confirmed = True
            self.bracket.active = True
            return True

    bracket_manager = CapturingBracketManager()
    manager = SimpleNamespace(
        _bracket_manager=bracket_manager,
        _logger=logging.getLogger("tp1-fill-registration-test"),
        _notify_bracket_event=lambda *args, **kwargs: None,
    )
    order = OrderDetails(
        order_id="OID-TP1",
        symbol="NFO:NIFTY2680424400CE",
        side="BUY",
        quantity=130,
        order_type=OrderType.LIMIT,
        status=OrderStatus.FILLED,
        price=100.0,
        fill_price=100.0,
        average_price=100.0,
        filled_quantity=130,
        stop_loss=90.0,
        take_profit=120.0,
        intent="ENTRY",
        resolved_lot_size=65,
        trade_provenance={
            "tp1_price": 110.0,
            "tp1_qty": 65,
            "trailing_atr_mult": 1.25,
            "resolved_lot_size": 65,
            "tp1_status": "armed",
        },
    )

    OrderManager._register_virtual_bracket_for_fill(
        manager,
        order,
        source="test",
    )

    assert bracket_manager.registration["tp1_price"] == 110.0
    assert bracket_manager.registration["tp1_qty"] == 65
    assert bracket_manager.registration["trailing_atr_mult"] == 1.25
    assert bracket_manager.registration["resolved_lot_size"] == 65


def test_unresolved_lot_size_records_tp1_skip_reason() -> None:
    plan = _plan(quantity=130)
    plan.resolved_lot_size = 0

    _enrich_trade_plan_exit_provenance(plan)

    assert plan.trade_provenance["tp1_status"] == "skipped"
    assert plan.trade_provenance["tp1_skip_reason"] == "lot_size_unresolved"
'''
          exit_test = (
