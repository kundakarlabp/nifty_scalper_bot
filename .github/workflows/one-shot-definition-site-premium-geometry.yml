          PY

      - name: Syntax and diff validation
        shell: bash
        run: |
          python -m compileall -q src tests
          git diff --check

      - name: Commit canonical implementation
        shell: bash
        run: |
          git rm -- .github/workflows/one-shot-definition-site-premium-geometry.yml
