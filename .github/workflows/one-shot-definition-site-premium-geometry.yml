              + direct_fill_test
              + exit_test[recovery_start:]
          )
          exit_test = exit_test.replace(
              '    assert plan.trade_provenance["initial_reward_risk"] == 2.0\n',
              '    assert plan.trade_provenance["initial_reward_risk"] == 2.0\n    assert plan.trade_provenance["tp1_status"] == "armed"\n',
              1,
          )
          exit_test = exit_test.replace(
              '    assert "tp1_qty" not in plan.trade_provenance\n',
              '    assert "tp1_qty" not in plan.trade_provenance\n    assert plan.trade_provenance["tp1_status"] == "skipped"\n    assert plan.trade_provenance["tp1_skip_reason"] == "single_lot"\n',
              1,
