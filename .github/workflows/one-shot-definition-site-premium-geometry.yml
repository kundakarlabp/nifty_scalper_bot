          # Guard against leaving any premium geometry runtime mutation behind.
          forbidden = {
              "src/nifty_scalper_bot/core/__init__.py": (
                  "_install_premium_geometry_runtime_hardening",
              ),
              "src/nifty_scalper_bot/execution/__init__.py": (
