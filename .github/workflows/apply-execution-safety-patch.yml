name: Apply execution safety patch

on:
  push:
    branches:
      - fix/execution-safety-guardrails-20260628

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio

      - name: Apply anchored source changes
        run: |
          python tools/_apply_execution_safety_patch.py
          python - <<'PY'
          from pathlib import Path

          path = Path("src/nifty_scalper_bot/execution/bracket_core.py")
          source = path.read_text(encoding="utf-8")
          anchor = "from __future__ import annotations\n\n"
          replacement = "from __future__ import annotations\n\nfrom contextlib import suppress\n"
          if "from contextlib import suppress" not in source:
              if source.count(anchor) != 1:
                  raise RuntimeError("bracket_core future-import anchor changed")
              source = source.replace(anchor, replacement, 1)
              path.write_text(source, encoding="utf-8")
          PY

      - name: Compile source
        run: python -m compileall -q src

      - name: Run focused execution safety tests
        run: |
          pytest -q \
            tests/execution/test_execution_safety_audit_fixes.py \
            tests/execution/test_execution_policy.py \
            tests/execution/test_margin_engine.py \
            tests/execution/test_margin_clamp.py \
            tests/execution/test_virtual_bracket_safety.py \
            tests/execution/test_live_exit_hardening.py \
            tests/execution/test_external_close_reconcile.py

      - name: Run full test suite
        run: pytest -q

      - name: Remove temporary patch machinery
        run: |
          rm tools/_apply_execution_safety_patch.py
          rm .github/workflows/apply-execution-safety-patch.yml

      - name: Commit validated source and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 1
          fi
          git commit -m "fix(execution): harden state reconciliation and bracket recovery"
          git push origin HEAD:fix/execution-safety-guardrails-20260628
