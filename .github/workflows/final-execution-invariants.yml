name: Validate final execution invariants

on:
  push:
    branches:
      - fix/execution-safety-guardrails-20260628

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q

      - name: Apply final invariant patch
        run: python tools/_apply_final_execution_invariants.py

      - name: Compile
        run: python -m compileall -q src dashboard scripts

      - name: Focused safety tests
        run: |
          python -m pytest -q \
            tests/execution/test_execution_safety_audit_fixes.py \
            tests/execution/test_external_close_reconcile.py \
            tests/execution/test_bracket_exit_state_machine.py \
            tests/execution/test_ledger_bracket_runtime.py \
            tests/integration/test_persistent_recovery.py

      - name: Full test suite
        run: python -m pytest -q

      - name: Publish validated source
        run: |
          rm tools/_apply_final_execution_invariants.py
          rm .github/workflows/final-execution-invariants.yml
          rm -f data/virtual_brackets.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(execution): enforce final reconciliation invariants"
          git push origin HEAD:fix/execution-safety-guardrails-20260628
