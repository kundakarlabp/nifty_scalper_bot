name: apply-spot-direction-evidence-parity
on:
  push:
    branches: [fix/spot-direction-evidence-parity]
permissions:
  contents: write
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spot-direction-evidence-parity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply canonical context evidence parity
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/nifty_scalper_bot/core/strategy_manager.py')
          s = p.read_text()
          old = '''        def _history_ema(period: int) -> float | None:\n            if role != "futures_context":\n                return None\n            getter = getattr(getattr(self, "_indicator_engine", None), "get_ema", None)'''
          new = '''        def _history_ema(period: int) -> float | None:\n            # Spot and futures are co-equal underlying-direction authorities.\n            # Both must receive the same history-backed EMA evidence when the\n            # fast-path indicator payload omits precomputed EMA fields.\n            if role not in {"spot_context", "futures_context"}:\n                return None\n            getter = getattr(getattr(self, "_indicator_engine", None), "get_ema", None)'''
          if old not in s:
              raise SystemExit('EMA marker not found')
          s = s.replace(old, new, 1)
          old = '''        def _history_vwap_slope() -> float | None:\n            if role != "futures_context":\n                return None\n            getter = getattr('''
          new = '''        def _history_vwap_slope() -> float | None:\n            # Preserve evidence symmetry across the two underlying sources;\n            # option-premium history remains excluded from direction authority.\n            if role not in {"spot_context", "futures_context"}:\n                return None\n            getter = getattr('''
          if old not in s:
              raise SystemExit('VWAP marker not found')
          s = s.replace(old, new, 1)
          old = '''        if role == "futures_context":\n            if vwap_slope is None:\n                vwap_slope = _history_vwap_slope()'''
          new = '''        if role in {"spot_context", "futures_context"}:\n            if vwap_slope is None:\n                vwap_slope = _history_vwap_slope()'''
          if old not in s:
              raise SystemExit('fallback gate marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          t = Path('tests/core/test_spot_direction_evidence_parity.py')
          t.write_text('''from pathlib import Path\n\n\ndef test_spot_and_futures_share_history_backed_direction_evidence():\n    source = Path("src/nifty_scalper_bot/core/strategy_manager.py").read_text()\n    assert source.count('role not in {"spot_context", "futures_context"}') >= 2\n    assert 'if role in {"spot_context", "futures_context"}:\\n            if vwap_slope is None:' in source\n    assert 'if role == "futures_context":\\n            if vwap_slope is None:' not in source\n\n\ndef test_option_history_is_not_promoted_to_underlying_direction_authority():\n    source = Path("src/nifty_scalper_bot/core/strategy_manager.py").read_text()\n    assert 'OPTION PREMIUM DATA MUST NEVER AUTHORIZE UNDERLYING DIRECTION' in source\n    assert 'if role not in {"spot_context", "futures_context"}' in source\n''')
          PY
          python -m py_compile src/nifty_scalper_bot/core/strategy_manager.py
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Focused direction tests
        run: pytest -q tests/core/test_underlying_direction.py tests/core/test_spot_direction_evidence_parity.py tests/strategies/test_single_vote_score_floor.py
      - name: Full regression
        run: pytest -q
      - name: Commit validated change
        if: success()
        run: |
          rm .github/workflows/apply-spot-direction-evidence-parity.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/nifty_scalper_bot/core/strategy_manager.py tests/core/test_spot_direction_evidence_parity.py .github/workflows/apply-spot-direction-evidence-parity.yml
          git commit -m 'Fix spot direction evidence parity'
          git push origin HEAD:fix/spot-direction-evidence-parity