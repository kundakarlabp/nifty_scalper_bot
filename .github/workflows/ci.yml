# File purpose: Canonical pull-request/main validation for the NIFTY scalper.
# Key responsibilities: Run changed-code quality, shard the complete normal non-slow suite, and run deterministic E2E validation once.
# Operational constraints: Read-only CI; no broker/network access; do not duplicate marked E2E tests in the normal suite.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BRACKET_AUTO_RESTORE: "false"
  ALLOW_NETWORK: "false"
  ALLOW_REAL_BROKER: "false"

jobs:
  changed-code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]' -r dashboard/requirements.txt -q
      - name: Compile production, dashboard and tooling
        run: python -m compileall -q src dashboard scripts
      - name: Enforce architecture ownership
        run: python scripts/architecture_lint.py
      - name: Collect complete pytest tree
        run: python -m pytest tests --collect-only -q -o addopts="" --import-mode=importlib
      - name: Resolve changed Python files
        id: changed
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}" --depth=50
            base="origin/${{ github.base_ref }}"
          else
            base="HEAD^"
          fi
          mapfile -t files < <(git diff --diff-filter=ACMR --name-only "$base"...HEAD -- '*.py' \
            | grep -E '^(src|dashboard|scripts|tests)/' || true)
          printf '%s\n' "${files[@]}" > /tmp/changed-python.txt
          printf '%s\n' "$base" > /tmp/quality-base.txt
          if ((${#files[@]})); then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_python=false" >> "$GITHUB_OUTPUT"
          fi
          printf 'Changed Python files:\n'
          cat /tmp/changed-python.txt
      - name: Ruff changed Python
        if: steps.changed.outputs.has_python == 'true'
        run: >-
          python scripts/check_changed_ruff.py
          --base "$(cat /tmp/quality-base.txt)"
          --files-from /tmp/changed-python.txt
      - name: Black changed Python
        if: steps.changed.outputs.has_python == 'true'
        run: >-
          python scripts/check_changed_black.py
          --base "$(cat /tmp/quality-base.txt)"
          --files-from /tmp/changed-python.txt
      - name: Mypy changed production Python
        if: steps.changed.outputs.has_python == 'true'
        run: >-
          python scripts/check_changed_mypy.py
          --base "$(cat /tmp/quality-base.txt)"
          --files-from /tmp/changed-python.txt

  normal-test-shard:
    name: normal-tests-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]' -r dashboard/requirements.txt -q
      - name: Select deterministic normal-suite shard
        run: >-
          python scripts/ci_test_shard.py
          --shard-index "${{ strategy.job-index }}"
          --shard-count "${{ strategy.job-total }}"
          > /tmp/normal-test-shard.txt
      - name: Run normal suite shard excluding separately validated E2E markers
        shell: bash
        run: |
          mapfile -t files < /tmp/normal-test-shard.txt
          if ((${#files[@]} == 0)); then
            echo "ERROR: normal test shard is empty" >&2
            exit 2
          fi
          printf 'Normal test shard %s/%s: %s files\n' \
            "${{ strategy.job-index }}" "${{ strategy.job-total }}" "${#files[@]}"
          python -m pytest -q "${files[@]}" \
            -m "not slow and not simulation_component and not live_runtime_e2e and not e2e_live_sim"

  tests:
    name: tests
    if: always()
    needs: normal-test-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all normal test shards
        env:
          NORMAL_SHARDS_RESULT: ${{ needs.normal-test-shard.result }}
        run: |
          echo "Normal shard result: $NORMAL_SHARDS_RESULT"
          test "$NORMAL_SHARDS_RESULT" = "success"

  e2e-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BROKER_SIMULATION: "true"
      EXECUTION_MODE: LIVE_SIMULATION
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]' -q
      - name: Run deterministic broker-free E2E suites once
        run: >-
          python -m pytest -q tests/e2e/live_sim
          -m "simulation_component or live_runtime_e2e or e2e_live_sim"
      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-simulation-artifacts-${{ github.run_id }}
          path: |
            e2e_event_timeline.json
            e2e_orders.json
            e2e_positions.json
            e2e_candles.json
          if-no-files-found: ignore
          retention-days: 3
