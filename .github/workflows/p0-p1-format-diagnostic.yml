name: P0 P1 Format Diagnostic

on:
  push:
    branches:
      - fix/p0-p1-runtime-hardening-20260806

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-p1-runtime-hardening-20260806
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install black -q
      - name: Reconstruct and apply
        run: |
          cat scripts/p0p1_chunks/worker.part.* | base64 -d > /tmp/apply_worker.py
          cat scripts/p0p1_chunks/watchdog.raw.* > /tmp/apply_watchdog.py
          cat scripts/p0p1_chunks/app_main.part.* | base64 -d > /tmp/apply_app_main.py
          cat scripts/p0p1_chunks/tests.part.* | base64 -d > /tmp/apply_tests.py
          python /tmp/apply_worker.py
          python scripts/fix_worker_stop_wakeup.py
          python scripts/apply_reconcile.py
          python /tmp/apply_watchdog.py
          python /tmp/apply_app_main.py
          python /tmp/apply_tests.py
      - name: Capture Black output
        run: |
          set +e
          python -m black \
            src/nifty_scalper_bot/data/market_data_hardening.py \
            src/nifty_scalper_bot/execution/position_manager.py \
            src/nifty_scalper_bot/infra/watchdog.py \
            src/nifty_scalper_bot/core/app.py \
            src/nifty_scalper_bot/main.py \
            tests/data/test_fallback_tick_worker_lifecycle.py \
            tests/execution/test_position_reconcile_singleflight.py \
            tests/infra/test_market_data_supervisor.py \
            tests/core/test_minimum_lot_affordability_readiness.py \
            2>&1 | tee /tmp/black.log
          echo ${PIPESTATUS[0]} > /tmp/black.rc
      - name: Persist diagnostic report
        run: |
          mkdir -p diagnostics
          cp /tmp/black.log diagnostics/p0-p1-black.log
          cp /tmp/black.rc diagnostics/p0-p1-black.rc
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/p0-p1-black.log diagnostics/p0-p1-black.rc
          git commit -m 'ci: persist P0/P1 Black diagnostic [skip ci]' || true
          git push origin HEAD:fix/p0-p1-runtime-hardening-20260806
