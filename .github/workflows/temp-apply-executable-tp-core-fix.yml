name: Temporary targeted executable TP core edit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/executable-tp-trigger-semantics
          fetch-depth: 0
      - name: Apply exact TP trigger edit and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/nifty_scalper_bot/execution/bracket_core.py')
          text = path.read_text(encoding='utf-8')
          old_partial = "        # Check partial targets (TP1, TP2, etc.)\n        for target in bracket.tp_levels:\n            if target.executed:\n                continue\n\n            triggered = False\n            if bracket.side == \"BUY\" and ltp >= target.price:\n                triggered = True\n            elif bracket.side == \"SELL\" and ltp <= target.price:\n                triggered = True\n\n            if triggered:\n                return {\n                    \"decision\": BracketTickDecision.EXIT_TARGET.value,\n                    \"type\": \"PARTIAL_TP\",\n                    \"target\": target,\n                    \"price\": ltp,\n                    \"qty\": min(target.quantity, bracket.remaining_quantity),\n                    \"reason\": f\"{target.name} Hit ({ltp:.2f})\",\n                }"
          new_partial = "        # Profit targets use the same executable liquidation price as hard SL.\n        # For a long/BUY bracket that is the bid; for a short/SELL bracket it is\n        # the ask. Missing/stale depth retains the existing LTP fallback.\n        target_exit_px, target_exit_src = self._executable_exit_price(bracket, ltp)\n\n        # Check partial targets (TP1, TP2, etc.)\n        for target in bracket.tp_levels:\n            if target.executed:\n                continue\n\n            triggered = False\n            if bracket.side == \"BUY\" and target_exit_px >= target.price:\n                triggered = True\n            elif bracket.side == \"SELL\" and target_exit_px <= target.price:\n                triggered = True\n\n            if triggered:\n                return {\n                    \"decision\": BracketTickDecision.EXIT_TARGET.value,\n                    \"type\": \"PARTIAL_TP\",\n                    \"target\": target,\n                    \"price\": ltp,\n                    \"qty\": min(target.quantity, bracket.remaining_quantity),\n                    \"trigger_price_source\": target_exit_src,\n                    \"reason\": f\"{target.name} Hit ({ltp:.2f})\",\n                }"
          old_final = "        # Hard TP breach must take precedence to guarantee immediate exit.\n        if bracket.tp_trigger_price > 0:\n            triggered = False\n            if bracket.side == \"BUY\" and ltp >= bracket.tp_trigger_price:\n                triggered = True\n            elif bracket.side == \"SELL\" and ltp <= bracket.tp_trigger_price:\n                triggered = True\n\n            if triggered:\n                return {\n                    \"decision\": BracketTickDecision.EXIT_TARGET.value,\n                    \"type\": \"FINAL_TP\",\n                    \"price\": ltp,\n                    \"qty\": bracket.remaining_quantity,\n                    \"reason\": \"HARD_TP_BREACH\",\n                }"
          new_final = "        # Hard TP breach must take precedence to guarantee immediate exit.\n        if bracket.tp_trigger_price > 0:\n            triggered = False\n            if bracket.side == \"BUY\" and target_exit_px >= bracket.tp_trigger_price:\n                triggered = True\n            elif bracket.side == \"SELL\" and target_exit_px <= bracket.tp_trigger_price:\n                triggered = True\n\n            if triggered:\n                return {\n                    \"decision\": BracketTickDecision.EXIT_TARGET.value,\n                    \"type\": \"FINAL_TP\",\n                    \"price\": ltp,\n                    \"qty\": bracket.remaining_quantity,\n                    \"trigger_price_source\": target_exit_src,\n                    \"reason\": \"HARD_TP_BREACH\",\n                }"
          if text.count(old_partial) != 1:
              raise SystemExit(f'expected one partial TP block, found {text.count(old_partial)}')
          if text.count(old_final) != 1:
              raise SystemExit(f'expected one final TP block, found {text.count(old_final)}')
          text = text.replace(old_partial, new_partial).replace(old_final, new_final)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/temp-apply-executable-tp-core-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/nifty_scalper_bot/execution/bracket_core.py .github/workflows/temp-apply-executable-tp-core-fix.yml
          git commit -m "fix: trigger tp on executable exit price"
          git push origin HEAD:fix/executable-tp-trigger-semantics
