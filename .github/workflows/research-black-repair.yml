# Temporary, research-branch-only formatting repair. Never touches production.
name: Research PR Black formatting repair

on:
  push:
    branches:
      - research/strict-execution-evidence-20261109
    paths:
      - .github/workflows/research-black-repair.yml

permissions:
  contents: write

concurrency:
  group: research-pr-black-repair
  cancel-in-progress: false

jobs:
  repair-formatting:
    if: github.ref == 'refs/heads/research/strict-execution-evidence-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ALLOW_NETWORK: "false"
      ALLOW_REAL_BROKER: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/strict-execution-evidence-20261109
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install formatting tools only
        run: python -m pip install --disable-pip-version-check "black>=24.3" "ruff>=0.5"
      - name: Format only Python changed relative to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          mapfile -t paths < <(git diff --diff-filter=ACMR --name-only origin/main...HEAD -- '*.py' | grep -E '^(src|scripts|tests)/' || true)
          if (( ${#paths[@]} == 0 )); then
            echo "Nothing to format"
            exit 0
          fi
          python -m ruff check --select I --fix "${paths[@]}"
          python -m black --config pyproject.toml "${paths[@]}"
          python -m ruff check --select I "${paths[@]}"
          python -m black --check --config pyproject.toml "${paths[@]}"
          git diff --stat
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${paths[@]}"
            git commit -m "Format research-only backtesting changes with Black and Ruff imports"
            git push origin HEAD:refs/heads/research/strict-execution-evidence-20261109
          fi
