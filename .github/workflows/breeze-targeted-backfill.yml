# Read-only ICICI historical gap repair. Broker rows remain encrypted.
name: Breeze targeted history backfill

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - deploy/breeze_targeted_backfill_20261109.csv

permissions:
  contents: read

concurrency:
  group: breeze-targeted-history-backfill
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated official Breeze research SDK
        run: python -m pip install --disable-pip-version-check 'breeze-connect==1.0.69'
      - name: Prepare private temporary workspace
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/breeze-repair" "$RUNNER_TEMP/breeze-repair-export"
          openssl x509 -in deploy/breeze_transport_recipient.pem -noout -checkend 7200
      - name: Retry documented contract gaps only
        timeout-minutes: 30
        env:
          BREEZE_API_KEY: ${{ secrets.BREEZE_API_KEY }}
          BREEZE_API_SECRET: ${{ secrets.BREEZE_API_SECRET }}
          BREEZE_SESSION_TOKEN: ${{ secrets.BREEZE_SESSION_TOKEN }}
        run: >-
          python -m scripts.archive_breeze_backfill
          --plan deploy/breeze_targeted_backfill_20261109.csv
          --outdir "$RUNNER_TEMP/breeze-repair"
      - name: Encrypt private repair results including partial coverage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ -d "$RUNNER_TEMP/breeze-repair" ]; then
            tar -czf "$RUNNER_TEMP/breeze-repair.tar.gz" -C "$RUNNER_TEMP/breeze-repair" .
            openssl cms -encrypt -binary -aes-256-gcm \
              -in "$RUNNER_TEMP/breeze-repair.tar.gz" \
              -outform DER -out "$RUNNER_TEMP/breeze-repair-export/history.cms" \
              deploy/breeze_transport_recipient.pem
            cd "$RUNNER_TEMP/breeze-repair-export"
            sha256sum history.cms > history.cms.sha256
          fi
      - name: Preserve encrypted artifact only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breeze-targeted-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/breeze-repair-export/
          if-no-files-found: error
          retention-days: 30
