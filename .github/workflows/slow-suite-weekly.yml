name: slow-suite-weekly
# Item 7: the default suite runs -m "not slow"; this job exercises the
# slow/integration marker set weekly so regressions there are not invisible.
on:
  schedule:
    - cron: "30 3 * * 0"  # Sundays 03:30 UTC (09:00 IST)
  workflow_dispatch: {}
jobs:
  slow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pytest-asyncio streamlit hypothesis freezegun "pandas>=2.0,<3"
      - run: python -m pytest tests -m slow -q -o addopts=""
