name: Minimum Lot Affordability Validated

on:
  push:
    branches:
      - fix/minimum-lot-affordability-readiness-20260806

permissions:
  contents: write

concurrency:
  group: minimum-lot-affordability-validated
  cancel-in-progress: false

jobs:
  validate-and-commit:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/minimum-lot-affordability-readiness-20260806
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q

      - name: Apply production correction and regressions
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(
              '.github/workflows/minimum-lot-affordability-once.yml'
          ).read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Format changed Python"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          exec(
              compile(
                  textwrap.dedent(workflow[start:end]),
                  'affordability_patch.py',
                  'exec',
              ),
              {},
          )

          integration = Path(
              'tests/core/test_minimum_lot_affordability_readiness.py'
          )
          text = integration.read_text(encoding='utf-8')
          for old, new in (
              (
                  '            set_runtime_readiness=lambda **kw: calls.append(kw),\n        ),',
                  '            set_runtime_readiness=lambda **kw: calls.append(kw),\n            has_datahub_subscription=lambda *args, **kwargs: True,\n        ),',
              ),
              (
                  '    assert ctx.readiness_decision.primary_blocker == "minimum_lot_unaffordable"',
                  '    assert (\n        ctx.live_block_reason\n        == "execution_not_armed:minimum_lot_unaffordable"\n    )',
              ),
              (
                  '    assert ctx.readiness_decision.primary_blocker is None',
                  '    assert ctx.live_block_reason is None',
              ),
          ):
              assert text.count(old) == 1, (old, text.count(old))
              text = text.replace(old, new, 1)
          integration.write_text(text, encoding='utf-8')

          live_tick = Path('tests/core/test_readiness_live_tick_proof.py')
          text = live_tick.read_text(encoding='utf-8')
          old = '        broker_client=object(),\n        order_manager=object(),\n        active_trading_universe={'
          new = '        broker_client=object(),\n        order_manager=SimpleNamespace(\n            resolve_lot_size=lambda symbol: 65,\n            _margin_factor=1.0,\n            _margin_buffer=1.0,\n        ),\n        broker_balance_valid=True,\n        last_valid_broker_balance=100_000.0,\n        active_trading_universe={'
          assert text.count(old) == 1, text.count(old)
          live_tick.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Correct import ordering without removing compatibility exports
        run: |
          python -m ruff check --select I --fix \
            src/nifty_scalper_bot/core/app.py \
            src/nifty_scalper_bot/execution/affordability.py \
            src/nifty_scalper_bot/execution/readiness.py \
            src/nifty_scalper_bot/main.py \
            tests/execution/test_minimum_lot_affordability.py \
            tests/core/test_minimum_lot_affordability_readiness.py \
            tests/core/test_readiness_live_tick_proof.py
          python -m black \
            src/nifty_scalper_bot/core/app.py \
            src/nifty_scalper_bot/execution/affordability.py \
            src/nifty_scalper_bot/execution/readiness.py \
            src/nifty_scalper_bot/main.py \
            tests/execution/test_minimum_lot_affordability.py \
            tests/core/test_minimum_lot_affordability_readiness.py \
            tests/core/test_readiness_live_tick_proof.py

      - name: Focused and adjacent regressions
        env:
          BRACKET_AUTO_RESTORE: 'false'
        run: |
          python -m pytest -q \
            tests/execution/test_minimum_lot_affordability.py \
            tests/core/test_minimum_lot_affordability_readiness.py \
            tests/core/test_readiness_semantics.py \
            tests/core/test_readiness_live_tick_proof.py \
            tests/core/test_history_readiness_ssot.py \
            tests/core/test_active_basket_readiness_sync.py \
            tests/core/test_startup_risk_balance.py \
            tests/execution/test_margin_engine.py \
            tests/execution/test_margin_freshness_zero_balance.py \
            tests/execution/test_readiness_priority.py \
            tests/execution/test_readiness_execution_safety_blockers.py \
            tests/test_main_health_readiness.py \
            tests/test_market_open_rearm_loop.py

      - name: Compile and fatal Ruff policy
        run: |
          python -m compileall -q src tests
          python -m ruff check --select E9,F63,F7,F82,I \
            src/nifty_scalper_bot/core/app.py \
            src/nifty_scalper_bot/execution/affordability.py \
            src/nifty_scalper_bot/execution/readiness.py \
            src/nifty_scalper_bot/main.py \
            tests/execution/test_minimum_lot_affordability.py \
            tests/core/test_minimum_lot_affordability_readiness.py \
            tests/core/test_readiness_live_tick_proof.py
          python -m black --check \
            src/nifty_scalper_bot/core/app.py \
            src/nifty_scalper_bot/execution/affordability.py \
            src/nifty_scalper_bot/execution/readiness.py \
            src/nifty_scalper_bot/main.py \
            tests/execution/test_minimum_lot_affordability.py \
            tests/core/test_minimum_lot_affordability_readiness.py \
            tests/core/test_readiness_live_tick_proof.py

      - name: Complete repository suite
        env:
          BRACKET_AUTO_RESTORE: 'false'
        run: python -m pytest -q

      - name: Verify intended production change surface
        run: |
          python - <<'PY'
          import subprocess

          intended = {
              'src/nifty_scalper_bot/execution/affordability.py',
              'src/nifty_scalper_bot/execution/readiness.py',
              'src/nifty_scalper_bot/core/app.py',
              'src/nifty_scalper_bot/main.py',
              'tests/execution/test_minimum_lot_affordability.py',
              'tests/core/test_minimum_lot_affordability_readiness.py',
              'tests/core/test_readiness_live_tick_proof.py',
          }
          temporary = {
              '.ci/minimum-lot-diagnostics.txt',
              '.github/workflows/minimum-lot-affordability-once.yml',
              '.github/workflows/minimum-lot-affordability-retry.yml',
              '.github/workflows/minimum-lot-affordability-final.yml',
              '.github/workflows/minimum-lot-affordability-complete.yml',
              '.github/workflows/minimum-lot-affordability-seal.yml',
              '.github/workflows/minimum-lot-affordability-release.yml',
              '.github/workflows/minimum-lot-affordability-diagnostic.yml',
              '.github/workflows/minimum-lot-affordability-validated.yml',
          }
          status = subprocess.check_output(
              ['git', 'status', '--porcelain'], text=True
          ).splitlines()
          actual = {line[3:] for line in status if len(line) >= 4}
          allowed = intended | temporary
          if actual - allowed:
              raise SystemExit(f'unexpected changes: {sorted(actual - allowed)}')
          if intended - actual:
              raise SystemExit(f'missing intended changes: {sorted(intended - actual)}')
          PY

      - name: Commit validated correction and remove temporary tooling
        run: |
          git rm -f \
            .ci/minimum-lot-diagnostics.txt \
            .github/workflows/minimum-lot-affordability-once.yml \
            .github/workflows/minimum-lot-affordability-retry.yml \
            .github/workflows/minimum-lot-affordability-final.yml \
            .github/workflows/minimum-lot-affordability-complete.yml \
            .github/workflows/minimum-lot-affordability-seal.yml \
            .github/workflows/minimum-lot-affordability-release.yml \
            .github/workflows/minimum-lot-affordability-diagnostic.yml \
            .github/workflows/minimum-lot-affordability-validated.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/nifty_scalper_bot/execution/affordability.py \
            src/nifty_scalper_bot/execution/readiness.py \
            src/nifty_scalper_bot/core/app.py \
            src/nifty_scalper_bot/main.py \
            tests/execution/test_minimum_lot_affordability.py \
            tests/core/test_minimum_lot_affordability_readiness.py \
            tests/core/test_readiness_live_tick_proof.py
          git commit -m 'fix(execution): gate live readiness on minimum lot affordability [skip ci]'
          git push origin HEAD:fix/minimum-lot-affordability-readiness-20260806
