name: E2E live simulation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  simulation-components:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALLOW_NETWORK: "false"
      ALLOW_REAL_BROKER: "false"
      BROKER_SIMULATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run simulation component tests
        run: python -m pytest -q -m simulation_component tests/e2e/live_sim
      - name: Upload component artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-sim-component-artifacts
          path: |
            e2e_event_timeline.json
            e2e_orders.json
            e2e_positions.json
            e2e_candles.json
          if-no-files-found: ignore

  live-runtime-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ALLOW_NETWORK: "false"
      ALLOW_REAL_BROKER: "false"
      BROKER_SIMULATION: "true"
      EXECUTION_MODE: LIVE_SIMULATION
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install -r dashboard/requirements.txt
      - name: Prepare and apply futures-context correction
        if: github.head_ref == 'fix/remaining-live-path-hardening'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/apply_futures_context_fix.py')
          script = path.read_text()
          script, count = re.subn(
              r'''        source_age_seconds = resolve_tick_age_seconds\(indicators\)\n        if source_age_seconds is None:\n.*?        source_timestamp = indicators\.get\("timestamp"\) or indicators\.get\("context_timestamp_epoch"\) or 0\.0\n''',
              '''        source_age_seconds = resolve_tick_age_seconds(indicators)\n        source_timestamp = indicators.get("timestamp") or indicators.get("context_timestamp_epoch") or 0.0\n''',
              script,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit(f'freshness fallback rewrite count={count}')

          anchor = "old_age = '                indicators[\"context_age_seconds\"] = min(now_ts - float(spot_ctx.get(\"timestamp\", now_ts)) if spot_usable else max_context_age + 1, now_ts - float(fut_ctx.get(\"timestamp\", now_ts)) if fut_usable else max_context_age + 1)\\n'\n"
          insertion = '''caller_old = ''' + "'''" + '''        if symbol_role in {"spot_context", "futures_context"}:
            self._update_context_snapshot(symbol=symbol, indicators=indicators, role=symbol_role)
''' + "'''" + '''
caller_new = ''' + "'''" + '''        if symbol_role in {"spot_context", "futures_context"}:
            if resolve_tick_age_seconds(indicators) is None and self._data_hub is not None:
                try:
                    context_quote = _get_cached_quote_for_eval(self._data_hub, symbol)
                    context_age_s = resolve_tick_age_seconds(context_quote or {})
                    if context_age_s is not None:
                        indicators["tick_age_s"] = context_age_s
                except Exception as exc:  # noqa: BLE001
                    log.debug(
                        "CONTEXT_TICK_AGE_ENRICHMENT_FAILED symbol=%s error=%s",
                        symbol,
                        exc,
                        extra={"event": "CONTEXT_TICK_AGE_ENRICHMENT_FAILED", "symbol": symbol},
                    )
            self._update_context_snapshot(symbol=symbol, indicators=indicators, role=symbol_role)
''' + "'''" + '''
if caller_old not in text:
    raise SystemExit("context snapshot caller anchor missing")
text = text.replace(caller_old, caller_new, 1)

'''
          if anchor not in script:
              raise SystemExit('helper insertion anchor missing')
          path.write_text(script.replace(anchor, insertion + anchor, 1))
          PY
          python .github/apply_futures_context_fix.py
      - name: Compile and focused tests
        if: github.head_ref == 'fix/remaining-live-path-hardening'
        run: |
          python -m compileall -q src tests
          git diff --check
          mapfile -t TEST_FILES < <(find tests -type f \( -name 'test_strategy_manager*.py' -o -name 'test_vwap*.py' \) | sort)
          test ${#TEST_FILES[@]} -gt 0
          python -m pytest -q --tb=short "${TEST_FILES[@]}"
      - name: Core and strategy suites
        if: github.head_ref == 'fix/remaining-live-path-hardening'
        run: python -m pytest -q --tb=short tests/core tests/strategies
      - name: Run live runtime E2E tests
        run: python -m pytest -q -m live_runtime_e2e tests/e2e/live_sim
      - name: Full suite
        if: github.head_ref == 'fix/remaining-live-path-hardening'
        run: python -m pytest -q
      - name: Commit clean validated diff
        if: github.head_ref == 'fix/remaining-live-path-hardening'
        run: |
          git checkout origin/main -- \
            .github/workflows/e2e-live-sim.yml \
            .github/workflows/validate-market-aware-optimisations.yml
          rm -f \
            .github/apply_futures_context_fix.py \
            .github/workflows/apply-futures-context-fix.yml \
            .github/workflows/futures-context-finalize.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests .github
          git status --short
          git commit -m "fix: preserve authoritative futures context semantics"
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload runtime artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-runtime-e2e-artifacts
          path: |
            e2e_event_timeline.json
            e2e_orders.json
            e2e_positions.json
            e2e_candles.json
          if-no-files-found: ignore
