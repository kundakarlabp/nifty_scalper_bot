name: E2E live simulation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  simulation-components:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALLOW_NETWORK: "false"
      ALLOW_REAL_BROKER: "false"
      BROKER_SIMULATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run simulation component tests
        run: python -m pytest -q -m simulation_component tests/e2e/live_sim

  live-runtime-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ALLOW_NETWORK: "false"
      ALLOW_REAL_BROKER: "false"
      BROKER_SIMULATION: "true"
      EXECUTION_MODE: LIVE_SIMULATION
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install -r dashboard/requirements.txt
      - name: Pin deterministic expiry-gate clock
        if: github.head_ref == 'fix/remaining-live-path-hardening'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/live_sim/test_live_runtime_startup_contract.py')
          text = path.read_text()
          old = '    now_ist: datetime = _FIXED_RUNTIME_NOW_IST,\n'
          new = '    now_ist: datetime = _FIXED_RUNTIME_NOW_IST.replace(hour=10, minute=30, second=0, microsecond=0),\n'
          if old not in text:
              raise SystemExit('expiry-gate clock anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Compile and focused tests
        if: github.head_ref == 'fix/remaining-live-path-hardening'
        run: |
          python -m compileall -q src tests
          git diff --check
          mapfile -t TEST_FILES < <(find tests -type f \( -name 'test_strategy_manager*.py' -o -name 'test_vwap*.py' \) | sort)
          test ${#TEST_FILES[@]} -gt 0
          python -m pytest -q --tb=short "${TEST_FILES[@]}"
      - name: Core and strategy suites
        if: github.head_ref == 'fix/remaining-live-path-hardening'
        run: python -m pytest -q --tb=short tests/core tests/strategies
      - name: Run live runtime E2E tests
        id: live_runtime
        run: |
          set +e
          python -m pytest -q -m live_runtime_e2e tests/e2e/live_sim > /tmp/live-runtime.txt 2>&1
          STATUS=$?
          cat /tmp/live-runtime.txt
          exit $STATUS
      - name: Upload live runtime diagnostics
        if: always() && steps.live_runtime.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: futures-context-live-runtime
          path: /tmp/live-runtime.txt
          if-no-files-found: error
          retention-days: 1
      - name: Full suite
        id: full_suite
        if: github.head_ref == 'fix/remaining-live-path-hardening'
        run: |
          set +e
          python -m pytest -q --tb=short --maxfail=1 > /tmp/full-suite.txt 2>&1
          STATUS=$?
          cat /tmp/full-suite.txt
          exit $STATUS
      - name: Upload full suite diagnostics
        if: always() && steps.full_suite.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: futures-context-full-suite
          path: /tmp/full-suite.txt
          if-no-files-found: ignore
          retention-days: 1
      - name: Commit clean validated diff
        if: github.head_ref == 'fix/remaining-live-path-hardening'
        run: |
          git checkout origin/main -- \
            .github/workflows/e2e-live-sim.yml \
            .github/workflows/validate-market-aware-optimisations.yml
          rm -f \
            .github/apply_futures_context_fix.py \
            .github/workflows/apply-futures-context-fix.yml \
            .github/workflows/futures-context-finalize.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests .github
          git status --short
          git commit -m "fix: preserve authoritative futures context semantics"
          git push origin HEAD:${{ github.head_ref }}
