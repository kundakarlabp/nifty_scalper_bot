name: E2E live simulation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  simulation-components:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALLOW_NETWORK: "false"
      ALLOW_REAL_BROKER: "false"
      BROKER_SIMULATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run simulation component tests
        run: python -m pytest -q -m simulation_component tests/e2e/live_sim

  live-runtime-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ALLOW_NETWORK: "false"
      ALLOW_REAL_BROKER: "false"
      BROKER_SIMULATION: "true"
      EXECUTION_MODE: LIVE_SIMULATION
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install -r dashboard/requirements.txt
      - name: Apply futures-context correction
        if: github.head_ref == 'fix/remaining-live-path-hardening'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/apply_futures_context_fix.py')
          script = path.read_text()
          old = '''caller_new = ''' + "'''" + '''        if symbol_role in {"spot_context", "futures_context"}:
            if resolve_tick_age_seconds(indicators) is None and self._data_hub is not None:
                try:
                    context_quote = _get_cached_quote_for_eval(self._data_hub, symbol)
                    context_age_s = resolve_tick_age_seconds(context_quote or {})
                    if context_age_s is not None:
                        indicators["tick_age_s"] = context_age_s
                except Exception as exc:  # noqa: BLE001
                    log.debug(
                        "CONTEXT_TICK_AGE_ENRICHMENT_FAILED symbol=%s error=%s",
                        symbol,
                        exc,
                        extra={"event": "CONTEXT_TICK_AGE_ENRICHMENT_FAILED", "symbol": symbol},
                    )
            self._update_context_snapshot(symbol=symbol, indicators=indicators, role=symbol_role)
''' + "'''"
          new = '''caller_new = ''' + "'''" + '''        if symbol_role in {"spot_context", "futures_context"}:
            context_age_s = resolve_tick_age_seconds(indicators)
            if context_age_s is None:
                mdm = getattr(self, "_market_data_manager", None)
                for method_name in ("time_since_last_live_ws_tick", "time_since_last_tick"):
                    age_getter = getattr(mdm, method_name, None)
                    if not callable(age_getter):
                        continue
                    try:
                        candidate_age = age_getter(symbol)
                        context_age_s = None if candidate_age is None else max(0.0, float(candidate_age))
                    except (TypeError, ValueError, RuntimeError):
                        context_age_s = None
                    if context_age_s is not None:
                        break
            if context_age_s is None and self._data_hub is not None:
                try:
                    context_quote = _get_cached_quote_for_eval(self._data_hub, symbol)
                    context_age_s = resolve_tick_age_seconds(context_quote or {})
                except Exception as exc:  # noqa: BLE001
                    log.debug(
                        "CONTEXT_TICK_AGE_ENRICHMENT_FAILED symbol=%s error=%s",
                        symbol,
                        exc,
                        extra={"event": "CONTEXT_TICK_AGE_ENRICHMENT_FAILED", "symbol": symbol},
                    )
            if context_age_s is not None:
                indicators["tick_age_s"] = context_age_s
            self._update_context_snapshot(symbol=symbol, indicators=indicators, role=symbol_role)
''' + "'''"
          if old not in script:
              raise SystemExit('caller_new helper block missing')
          path.write_text(script.replace(old, new, 1))
          PY
          python .github/apply_futures_context_fix.py
      - name: Compile and focused tests
        if: github.head_ref == 'fix/remaining-live-path-hardening'
        run: |
          python -m compileall -q src tests
          git diff --check
          mapfile -t TEST_FILES < <(find tests -type f \( -name 'test_strategy_manager*.py' -o -name 'test_vwap*.py' \) | sort)
          test ${#TEST_FILES[@]} -gt 0
          python -m pytest -q --tb=short "${TEST_FILES[@]}"
      - name: Core and strategy suites
        if: github.head_ref == 'fix/remaining-live-path-hardening'
        run: python -m pytest -q --tb=short tests/core tests/strategies
      - name: Run live runtime E2E tests
        run: python -m pytest -q -m live_runtime_e2e tests/e2e/live_sim
      - name: Full suite
        if: github.head_ref == 'fix/remaining-live-path-hardening'
        run: python -m pytest -q
      - name: Commit clean validated diff
        if: github.head_ref == 'fix/remaining-live-path-hardening'
        run: |
          git checkout origin/main -- \
            .github/workflows/e2e-live-sim.yml \
            .github/workflows/validate-market-aware-optimisations.yml
          rm -f \
            .github/apply_futures_context_fix.py \
            .github/workflows/apply-futures-context-fix.yml \
            .github/workflows/futures-context-finalize.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests .github
          git status --short
          git commit -m "fix: preserve authoritative futures context semantics"
          git push origin HEAD:${{ github.head_ref }}
