name: Audit tick path once

on:
  push:
    branches:
      - fix/tick-path-latency-20260805

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect synchronous runner maintenance
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          file = Path('src/nifty_scalper_bot/strategies/runner.py')
          text = file.read_text(); lines = text.splitlines(); tree = ast.parse(text)
          names = {
              '_mirror_authoritative_candle_engine', '_run_health_watchdog_on_cadence',
              '_emit_composite_reports', '_notify_entry_eval_pending',
              '_entry_eval_worker_main', '_entry_eval_worker_loop',
              '_drain_entry_eval_pending', '_evaluate_pending_entry_tick',
              '_roles_for_symbol', '_is_context_symbol',
          }
          found = set()
          for node in ast.walk(tree):
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in names:
                  found.add(node.name); end = getattr(node, 'end_lineno', node.lineno)
                  print(f'\n--- {node.name} lines {node.lineno}-{end} ---')
                  print('\n'.join(lines[node.lineno-1:end]))
          print('missing:', sorted(names-found))
          PY
