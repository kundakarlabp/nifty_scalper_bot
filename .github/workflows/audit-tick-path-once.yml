name: Audit tick path once

on:
  push:
    branches:
      - fix/tick-path-latency-20260805

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static tick-path audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          targets = {
              'src/nifty_scalper_bot/data/market_data_manager.py': [
                  '_enqueue_tick_threadsafe', '_drain_pending_ticks_once',
                  '_process_queued_tick', '_emit_tick', '_dispatch_callback',
                  '_invoke_tick_callback', '_publish_tick_bus',
              ],
              'src/nifty_scalper_bot/data/data_hub.py': [
                  '_ingest_tick_impl', 'ingest_tick_sync', 'subscribe_ticks',
                  '_capture_option_metrics', 'checkpoint_quotes', '_mark_quotes_dirty',
              ],
              'src/nifty_scalper_bot/strategies/runner.py': [
                  '_on_tick', 'on_tick', '_queue_entry_evaluation',
                  '_entry_eval_worker_loop', '_process_entry_eval',
              ],
          }
          for file, names in targets.items():
              text = Path(file).read_text()
              tree = ast.parse(text)
              print(f'\n===== {file} =====')
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in names:
                      end = getattr(node, 'end_lineno', node.lineno)
                      lines = text.splitlines()
                      print(f'\n--- {node.name} lines {node.lineno}-{end} ---')
                      print('\n'.join(lines[node.lineno-1:end]))

          print('\n===== tick subscription call sites =====')
          for path in Path('src').rglob('*.py'):
              text = path.read_text(errors='ignore')
              for idx, line in enumerate(text.splitlines(), 1):
                  if any(token in line for token in ('subscribe_ticks(', '.subscribe(', 'attach_tick_bus(', 'tick_bus.subscribe(')):
                      if 'market_data' in str(path) or 'data_hub' in str(path) or 'runner' in str(path) or 'app.py' in str(path) or 'position' in str(path) or 'bracket' in str(path):
                          print(f'{path}:{idx}: {line.strip()}')
          PY
      - name: Existing latency and coalescing regressions
        run: |
          python -m pip install -e '.[dev]' -q
          python -m pytest -q \
            tests/data/test_mdm_tick_coalescing.py \
            tests/data/test_mdm_callback_dispatch.py \
            tests/data/test_datahub_single_tick_ingress.py \
            tests/strategies/test_entry_eval_coalescing.py
