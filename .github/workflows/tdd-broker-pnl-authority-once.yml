name: TDD broker PnL authority once

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  broker-pnl-authority:
    runs-on: ubuntu-latest
    env:
      BRACKET_AUTO_RESTORE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]' -q
      - name: Focused broker PnL authority regressions
        run: >-
          python -m pytest -q
          tests/execution/test_trading_incident_regressions.py
          -k 'authoritative_broker_realized or snapshot_without_realized_field or repeated_authoritative_broker_pnl_sync'
