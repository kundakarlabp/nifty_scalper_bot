name: Apply canonical direction authority fix

on:
  push:
    branches:
      - fix/canonical-underlying-direction-authority

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply focused source and architecture changes
        run: |
          git show 0e9d736c351b8e86bf8ad55e9e428eaf51b9ed5d:.github/workflows/apply-direction-authority-fix.yml > /tmp/original.yml
          python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/original.yml').read_text().splitlines()
          start = text.index("          python - <<'PY'") + 1
          end = text.index('          PY', start)
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in text[start:end])
          old = "replacement = '\\n'.join(line[2:] if line.startswith('  ') else line for line in replacement.splitlines()) + '\\n'"
          new = "import textwrap\nreplacement = textwrap.indent(textwrap.dedent(replacement).lstrip(), '            ') + '\\n'"
          if old not in code:
              raise SystemExit('reviewed transformer normalization marker changed')
          Path('/tmp/apply.py').write_text(code.replace(old, new, 1))
          PY
          python /tmp/apply.py
          python -m py_compile src/nifty_scalper_bot/core/strategy_manager.py src/nifty_scalper_bot/core/underlying_direction.py
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Focused directional TDD
        run: pytest -q tests/core/test_underlying_direction.py tests/strategies/test_single_vote_score_floor.py
      - name: Directional and live-safety regressions
        run: pytest -q tests/e2e/live_sim/test_post885_live_safety_architecture.py
      - name: Full regression suite
        run: pytest -q
      - name: Commit validated fix and remove one-shot workflow
        run: |
          rm -f .github/workflows/apply-direction-authority-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nifty_scalper_bot/core/strategy_manager.py README.md .github/workflows/apply-direction-authority-fix.yml
          git commit -m 'fix: make underlying direction authority atomic and fail closed'
          git push origin HEAD
