name: Strategy secondary canonical cleanup v2

on:
  push:
    branches:
      - strategy-secondary-canonical-cleanup-20260912

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Canonicalize and validate
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -q '\[secondary-canonicalized\]'; then
            echo 'validated source commit already applied'
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path

          # OrderFlow owns quote identity and can never be promoted by a sidecar.
          p = Path('src/nifty_scalper_bot/strategies/elite_strategies/order_flow.py')
          text = p.read_text()
          old = 'import time\nfrom typing import Any\n'
          new = 'import time\nfrom typing import Any, Mapping\nimport zlib\n'
          if text.count(old) != 1:
              raise SystemExit('order_flow import seam drifted')
          text = text.replace(old, new, 1)
          old = '''from nifty_scalper_bot.strategies.elite_strategies.order_flow_live_context_patch import (\n    apply_orderflow_live_context_proof,\n)\n'''
          if text.count(old) != 1:
              raise SystemExit('order_flow sidecar import seam drifted')
          text = text.replace(old, '', 1)
          anchor = '    return support, strong\n\n\nclass OrderFlowStrategy'
          helper = '''    return support, strong\n\n\ndef _safe_float_value(value: Any) -> float | None:\n    try:\n        number = float(value)\n    except (TypeError, ValueError):\n        return None\n    return number if number == number else None\n\n\ndef _stable_quote_version(value: Any) -> int:\n    try:\n        numeric = int(float(value))\n    except (TypeError, ValueError):\n        numeric = 0\n    if numeric > 0:\n        return numeric\n    return int(zlib.crc32(str(value).encode("utf-8")) & 0x7FFFFFFF) or 1\n\n\ndef _stamp_quote_update_identity(\n    metadata: dict[str, Any], indicators: Mapping[str, Any]\n) -> None:\n    """Preserve a real quote version or stable microstructure fingerprint."""\n    for source in (metadata, indicators):\n        for key in (\n            "quote_update_version",\n            "update_version",\n            "tick_version",\n            "last_tick_ts_ms",\n            "timestamp_ms",\n            "last_tick_timestamp",\n        ):\n            value = source.get(key)\n            if value not in (None, "", 0, 0.0):\n                metadata["quote_update_version"] = _stable_quote_version(value)\n                metadata.setdefault("quote_update_version_source", key)\n                return\n\n    bid = _safe_float_value(metadata.get("bid") or indicators.get("bid"))\n    ask = _safe_float_value(metadata.get("ask") or indicators.get("ask"))\n    imbalance = _safe_float_value(\n        metadata.get("depth_imbalance") or indicators.get("depth_imbalance")\n    )\n    tick_direction = str(\n        metadata.get("tick_direction") or indicators.get("tick_direction") or ""\n    ).upper()\n    if bid is None and ask is None and imbalance is None and not tick_direction:\n        return\n    raw = (\n        f"{bid if bid is not None else 'na'}:"\n        f"{ask if ask is not None else 'na'}:"\n        f"{imbalance if imbalance is not None else 'na'}:{tick_direction or 'na'}"\n    )\n    metadata["quote_update_version"] = _stable_quote_version(raw)\n    metadata["quote_update_version_source"] = "microstructure_fingerprint"\n\n\nclass OrderFlowStrategy'''
          if text.count(anchor) != 1:
              raise SystemExit('order_flow helper seam drifted')
          text = text.replace(anchor, helper, 1)
          old = '            return apply_orderflow_live_context_proof(signal, indicators)'
          new = '            _stamp_quote_update_identity(signal.metadata, indicators)\n            return signal'
          if text.count(old) != 1:
              raise SystemExit('order_flow sidecar call seam drifted')
          p.write_text(text.replace(old, new, 1))
          Path('src/nifty_scalper_bot/strategies/elite_strategies/order_flow_live_context_patch.py').unlink()

          # Tuesday gamma: expiry is explicit/calendar-aware; structure uses spot, not option premium.
          p = Path('src/nifty_scalper_bot/strategies/elite_tuesday_gamma_buyer.py')
          text = p.read_text()
          old = 'from nifty_scalper_bot.utils.logging import get_logger\n'
          new = '''from nifty_scalper_bot.utils.logging import get_logger\nfrom nifty_scalper_bot.utils.smart_symbol import (\n    WEEKLY_EXPIRY_WEEKDAY,\n    get_actual_expiry_date,\n)\n'''
          if text.count(old) != 1:
              raise SystemExit('Tuesday gamma import seam drifted')
          text = text.replace(old, new, 1)
          old = '''            if now_local is not None:\n                if now_local.weekday() != 1:\n                    return None\n                if now_local.hour < 9 or now_local.hour > 14:\n                    return None\n                if now_local.hour == 9 and now_local.minute < 20:\n                    return None\n                if now_local.hour == 14 and now_local.minute >= 45:\n                    return None\n'''
          new = '''            if now_local is not None:\n                raw_days_to_expiry = indicators.get('days_to_expiry')\n                if raw_days_to_expiry is not None:\n                    try:\n                        expiry_session = float(raw_days_to_expiry) <= 0.0\n                    except (TypeError, ValueError):\n                        expiry_session = False\n                else:\n                    today = now_local.date()\n                    expiry_session = (\n                        get_actual_expiry_date(today, WEEKLY_EXPIRY_WEEKDAY) == today\n                    )\n                if not expiry_session:\n                    return None\n                if now_local.hour < 9 or now_local.hour > 14:\n                    return None\n                if now_local.hour == 9 and now_local.minute < 20:\n                    return None\n                if now_local.hour == 14 and now_local.minute >= 45:\n                    return None\n'''
          if text.count(old) != 1:
              raise SystemExit('Tuesday gamma expiry seam drifted')
          text = text.replace(old, new, 1)
          old = '''            if current_price > recent_high:\n                score += 2\n            elif recent_low > 0 and current_price < recent_low:\n                score -= 2\n'''
          new = '''            if recent_high > 0 and spot > recent_high:\n                score += 2\n            elif recent_low > 0 and spot < recent_low:\n                score -= 2\n'''
          if text.count(old) != 1:
              raise SystemExit('Tuesday gamma price-domain seam drifted')
          p.write_text(text.replace(old, new, 1))

          # Remove obsolete OrderFlow trigger switches from example config.
          p = Path('.env.example')
          text = p.read_text()
          for line in (
              'ORDERFLOW_ALLOW_TRIGGER_ROLE=true\n',
              'ORDERFLOW_ALLOW_LIVE_TRIGGER=true\n',
              'ORDERFLOW_ALLOW_TRIGGER_WITHOUT_DIRECTION_LIVE=false\n',
          ):
              if line not in text:
                  raise SystemExit(f'missing obsolete env line: {line.strip()}')
              text = text.replace(line, '', 1)
          p.write_text(text)

          # Move quote-fingerprint observability test to the native owner.
          p = Path('tests/strategies/test_signal_observability_contract.py')
          text = p.read_text()
          old = '''from nifty_scalper_bot.strategies.elite_strategies.order_flow_live_context_patch import (\n    apply_orderflow_live_context_proof,\n)\n'''
          new = '''from nifty_scalper_bot.strategies.elite_strategies.order_flow import (\n    _stamp_quote_update_identity,\n)\n'''
          if text.count(old) != 1:
              raise SystemExit('observability import seam drifted')
          text = text.replace(old, new, 1)
          old = '''    first = apply_orderflow_live_context_proof(_orderflow_signal(), {})\n    repeated = apply_orderflow_live_context_proof(_orderflow_signal(), {})\n    changed = apply_orderflow_live_context_proof(_orderflow_signal(bid=99.6), {})\n\n    first_version = first.metadata["quote_update_version"]\n'''
          new = '''    first = _orderflow_signal()\n    repeated = _orderflow_signal()\n    changed = _orderflow_signal(bid=99.6)\n    _stamp_quote_update_identity(first.metadata, {})\n    _stamp_quote_update_identity(repeated.metadata, {})\n    _stamp_quote_update_identity(changed.metadata, {})\n\n    first_version = first.metadata["quote_update_version"]\n'''
          if text.count(old) != 1:
              raise SystemExit('observability quote identity seam drifted')
          p.write_text(text.replace(old, new, 1))
          PY

          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m compileall -q src
          python -m pytest -q \
            tests/strategies/test_signal_observability_contract.py \
            tests/strategies/test_orderflow_context_only_role.py \
            tests/strategies/test_elite_builder_mode.py
          python -m ruff check \
            src/nifty_scalper_bot/strategies/elite_strategies/order_flow.py \
            src/nifty_scalper_bot/strategies/elite_tuesday_gamma_buyer.py \
            tests/strategies/test_signal_observability_contract.py
          python -m black --check --diff \
            src/nifty_scalper_bot/strategies/elite_strategies/order_flow.py \
            src/nifty_scalper_bot/strategies/elite_tuesday_gamma_buyer.py \
            tests/strategies/test_signal_observability_contract.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nifty_scalper_bot/strategies/elite_strategies/order_flow.py \
                  src/nifty_scalper_bot/strategies/elite_strategies/order_flow_live_context_patch.py \
                  src/nifty_scalper_bot/strategies/elite_tuesday_gamma_buyer.py \
                  tests/strategies/test_signal_observability_contract.py \
                  .env.example
          git commit -m 'Canonicalize remaining secondary strategy seams [secondary-canonicalized]'
          git push origin HEAD:strategy-secondary-canonical-cleanup-20260912
