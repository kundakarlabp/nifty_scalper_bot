name: tmp-flat-row-pnl-tdd

on:
  push:
    branches:
      - fix/flat-row-realized-pnl-20260826

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[skip flat-pnl-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/flat-row-realized-pnl-20260826
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Add regression tests only
        env:
          TEST_ADDITION_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path('tests/execution/test_trading_incident_regressions.py')
          text = path.read_text()
          if 'def test_flat_broker_row_uses_day_pnl_when_realised_zero' not in text:
              addition = base64.b64decode(os.environ['TEST_ADDITION_B64']).decode()
              path.write_text(text.rstrip() + addition.rstrip() + '\n')
          PY
      - name: Prove regression is red before source fix
        run: |
          set +e
          pytest -q tests/execution/test_trading_incident_regressions.py::test_flat_broker_row_uses_day_pnl_when_realised_zero
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo 'Regression unexpectedly passed before source repair' >&2
            exit 1
          fi
          echo 'Expected RED reproduced.'
      - name: Apply narrow source repair
        env:
          OLD_B64: 
          NEW_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path('src/nifty_scalper_bot/execution/position_manager.py')
          text = path.read_text()
          old = base64.b64decode(os.environ['OLD_B64']).decode()
          new = base64.b64decode(os.environ['NEW_B64']).decode()
          if text.count(old) != 1:
              raise SystemExit(f'expected one source anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Focused validation
        run: |
          pytest -q tests/execution/test_trading_incident_regressions.py -k 'flat_broker_row or authoritative_broker_realized or snapshot_without_realized or repeated_authoritative_broker_pnl_sync'
          pytest -q tests/execution/test_lifecycle_entry_guards.py tests/execution/test_execution_safety_audit_fixes.py
          python -m compileall -q src
          git diff --check
      - name: Commit tested source and regressions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-flat-row-pnl-tdd.yml
          git add src/nifty_scalper_bot/execution/position_manager.py tests/execution/test_trading_incident_regressions.py
          git commit -m 'fix(pnl): derive flat-row realised PnL from broker day PnL [skip flat-pnl-patch]'
          git push origin HEAD:fix/flat-row-realized-pnl-20260826
