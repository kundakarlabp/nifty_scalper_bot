name: tmp-flat-row-pnl-tdd
on:
  push:
    branches:
      - fix/flat-row-realized-pnl-20260826
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/flat-row-realized-pnl-20260826
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          python -m pip install -q -e .
          python -m pip install -q pytest
      - name: Add regression tests only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/execution/test_trading_incident_regressions.py')
          text = path.read_text()
          addition = r'''


def test_flat_broker_row_uses_day_pnl_when_realised_zero(tmp_path) -> None:
    manager = PositionManager(state_file=str(tmp_path / "positions.json"))
    manager.establish_pnl_session_baseline(0.0)
    manager.synchronize_with_broker([{"symbol": SYMBOL, "product": "MIS", "quantity": 0, "pnl": -234.0, "realised": 0.0}])
    snapshot = manager.pnl_reconciliation_snapshot()
    assert snapshot["broker_realized_snapshot"] == pytest.approx(-234.0)
    assert manager.get_realized_pnl() == pytest.approx(-234.0)


def test_flat_broker_row_preserves_nonzero_realised_over_day_pnl(tmp_path) -> None:
    manager = PositionManager(state_file=str(tmp_path / "positions.json"))
    manager.establish_pnl_session_baseline(0.0)
    manager.synchronize_with_broker([{"symbol": SYMBOL, "product": "MIS", "quantity": 0, "pnl": -234.0, "realised": -210.0}])
    snapshot = manager.pnl_reconciliation_snapshot()
    assert snapshot["broker_realized_snapshot"] == pytest.approx(-210.0)
    assert manager.get_realized_pnl() == pytest.approx(-210.0)


def test_open_broker_row_never_promotes_day_pnl_to_realised(tmp_path) -> None:
    manager = PositionManager(state_file=str(tmp_path / "positions.json"))
    manager.establish_pnl_session_baseline(0.0)
    manager.synchronize_with_broker([{"symbol": SYMBOL, "product": "MIS", "quantity": 65, "average_price": 100.0, "last_price": 96.4, "pnl": -234.0, "realised": 0.0}])
    snapshot = manager.pnl_reconciliation_snapshot()
    assert snapshot["broker_realized_snapshot"] == pytest.approx(0.0)
    assert manager.get_realized_pnl() == pytest.approx(0.0)
'''
          if 'test_flat_broker_row_uses_day_pnl_when_realised_zero' in text:
              raise SystemExit('regression already present')
          path.write_text(text.rstrip() + addition + '\n')
          PY
      - name: Prove regression is red before source fix
        run: |
          set +e
          python -m pytest -q tests/execution/test_trading_incident_regressions.py -k flat_broker_row_uses_day_pnl_when_realised_zero
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo 'Expected regression to fail before source repair' >&2
            exit 1
          fi
      - name: Apply narrow source repair
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/nifty_scalper_bot/execution/position_manager.py')
          text = path.read_text()
          old = '''                quantity = row.quantity
                realized_pnl = get_float(record, ("realised", "realized"), default=0.0)
                if "realised" in record or "realized" in record:
                    snapshot_realized_seen = True
                    snapshot_realized_pnl += realized_pnl
                if quantity == 0:
'''
          new = '''                quantity = row.quantity
                realized_field_present = "realised" in record or "realized" in record
                realized_pnl = get_float(record, ("realised", "realized"), default=0.0)
                if (
                    quantity == 0
                    and realized_field_present
                    and realized_pnl == 0.0
                    and "pnl" in record
                ):
                    # Zerodha can leave `realised` at zero on a fully closed MIS
                    # row while `pnl` carries the broker's cumulative day P&L.
                    # Open-position `pnl` includes unrealised P&L and must never
                    # become realised authority.
                    realized_pnl = get_float(record, ("pnl",), default=0.0)
                if realized_field_present:
                    snapshot_realized_seen = True
                    snapshot_realized_pnl += realized_pnl
                if quantity == 0:
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one source anchor, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Focused validation
        run: |
          python -m pytest -q tests/execution/test_trading_incident_regressions.py -k 'flat_broker_row or authoritative_broker_realized or snapshot_without_realized or repeated_authoritative_broker_pnl_sync'
          python -m pytest -q tests/execution/test_lifecycle_entry_guards.py tests/execution/test_execution_safety_audit_fixes.py
          python -m compileall -q src
          git diff --check
      - name: Commit tested source and regressions
        run: |
          rm -f .github/workflows/tmp-flat-row-pnl-tdd.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(pnl): derive flat-row realised PnL from broker day PnL'
          git push origin HEAD:fix/flat-row-realized-pnl-20260826
