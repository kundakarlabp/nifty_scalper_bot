# File purpose: Validate focused live-exit safety changes without letting repo-wide lint debt block safety tests.
# Key responsibilities: Run scoped quality checks, execution lifecycle regressions, and the full test suite as independent jobs.
# Operational constraints: Safety tests must run even when lint/typecheck fails; do not claim repo-wide lint cleanliness.

name: Live Exit Safety CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-readiness-quote-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/readiness-freshest-cached-quote'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/readiness-freshest-cached-quote
          fetch-depth: 50
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
      - name: Apply minimal readiness ownership correction
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/nifty_scalper_bot/core/history_readiness.py')
          text = path.read_text()
          old = '''def _get_cached_quote(ctx: "BotContext", symbol: str) -> Mapping[str, Any]:
    """Return cached quote/tick data without pulling broker APIs."""
    for provider in (getattr(ctx, "data_hub", None), getattr(ctx, "datahub", None)):
        if provider is None:
            continue
        fn = getattr(provider, "get_quote", None)
        if callable(fn):
            try:
                quote = fn(symbol, allow_pull=False)
            except TypeError:
                try:
                    quote = fn(symbol)
                except Exception:
                    quote = None
            except Exception:
                quote = None
            if isinstance(quote, Mapping):
                return quote
    mdm = getattr(ctx, "market_data_manager", None)
    for name in ("get_quote", "get_latest_tick", "get_last_tick"):
        fn = getattr(mdm, name, None)
        if callable(fn):
            try:
                quote = fn(symbol)
            except Exception:
                quote = None
            if isinstance(quote, Mapping):
                return quote
'''
          new = '''def _get_cached_quote(ctx: "BotContext", symbol: str) -> Mapping[str, Any]:
    """Return canonical MDM cached tick; use DataHub only as read-facade fallback."""
    mdm = getattr(ctx, "market_data_manager", None)
    for name in ("get_latest_tick", "get_last_tick", "get_quote"):
        fn = getattr(mdm, name, None)
        if callable(fn):
            try:
                quote = fn(symbol)
            except Exception:
                quote = None
            if isinstance(quote, Mapping) and quote:
                return quote
    for provider in (getattr(ctx, "data_hub", None), getattr(ctx, "datahub", None)):
        if provider is None:
            continue
        fn = getattr(provider, "get_quote", None)
        if callable(fn):
            try:
                quote = fn(symbol, allow_pull=False)
            except TypeError:
                try:
                    quote = fn(symbol)
                except Exception:
                    quote = None
            except Exception:
                quote = None
            if isinstance(quote, Mapping):
                return quote
'''
          if old not in text:
              raise SystemExit('target readiness helper did not match current branch')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Focused red-green validation
        run: |
          python -m pytest -q tests/core/test_history_readiness_cached_quote_priority.py tests/core/test_readiness_live_tick_proof.py
          python -m compileall -q src
      - name: Restore CI and commit clean source/test diff
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/live-exit-safety-ci.yml
          rm -f .ci-trigger
          rm -f .github/workflows/tdd-history-readiness-quote-priority.yml
          rm -f .github/workflows/tdd-history-readiness-quote-priority-2.yml
          rm -f .github/workflows/apply-readiness-quote-fix.yml
          rm -f .github/workflows/apply-readiness-quote-fix-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nifty_scalper_bot/core/history_readiness.py tests/core/test_history_readiness_cached_quote_priority.py .github/workflows .ci-trigger
          git commit -m 'fix: use canonical MDM quote for live readiness'
          git push origin HEAD:fix/readiness-freshest-cached-quote

  changed-code-quality:
    runs-on: ubuntu-latest
    env:
      BRACKET_AUTO_RESTORE: "false"
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q
      - name: Compile production, dashboard and agent tooling
        run: python -m compileall -q src dashboard scripts
      - name: Scoped ruff lint
        run: |
          python -m ruff check \
            src/nifty_scalper_bot/execution/broker_position_evidence.py \
            src/nifty_scalper_bot/execution/order_state.py \
            tests/core/test_eod_flatten_schedule.py \
            tests/execution/test_broker_position_and_order_state.py
      - name: Scoped black format check
        run: |
          python -m black --check \
            src/nifty_scalper_bot/execution/broker_position_evidence.py \
            src/nifty_scalper_bot/execution/order_state.py \
            tests/core/test_eod_flatten_schedule.py \
            tests/execution/test_broker_position_and_order_state.py
      - name: Scoped mypy typecheck
        run: |
          python -m mypy --follow-imports=skip \
            src/nifty_scalper_bot/execution/broker_position_evidence.py \
            src/nifty_scalper_bot/execution/order_state.py \
            src/nifty_scalper_bot/execution/canonical_bracket_manager.py

  execution-safety-tests:
    runs-on: ubuntu-latest
    env:
      BRACKET_AUTO_RESTORE: "false"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q
      - name: Execution safety regressions
        run: |
          python -m pytest -q \
            tests/core/test_eod_flatten_schedule.py \
            tests/data/test_zerodha_auth_reprobe_latch.py \
            tests/execution/test_broker_position_and_order_state.py \
            tests/execution/test_explicit_exit_intent_safety.py \
            tests/execution/test_executable_tp_semantics.py \
            tests/execution/test_executable_trailing_watermark.py \
            tests/execution/test_cost_aware_live_entry_target.py \
            tests/execution/test_live_exit_hardening.py \
            tests/execution/test_virtual_bracket_safety.py \
            tests/execution/test_ledger_bracket_runtime.py \
            tests/execution/test_live_ledger_pnl_invariants.py \
            tests/execution/test_runtime_bracket_facade.py \
            tests/architecture/test_canonical_bo_ownership.py

  full-tests:
    runs-on: ubuntu-latest
    env:
      BRACKET_AUTO_RESTORE: "false"
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q
      - name: Full test suite
        run: python -m pytest -q
