name: One-shot futures volume and whitelist TDD

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-targeted-correction:
    if: github.head_ref == 'fix/futures-volume-provenance-whitelist-20260804'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/futures-volume-provenance-whitelist-20260804
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q

      - name: Keep helper checks patch-scoped
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/tmp_apply_futures_volume_whitelist_pr.py")
          text = path.read_text()
          text = text.replace(
              "test_futures_volume_ignores_trade_quantity_and_preserves_cumulative_baseline",
              "test_futures_volume_ignores_trade_quantity_and_keeps_baseline",
          )

          first_black = text.index(
              '\nrun(\n    sys.executable,\n    "-m",\n    "black",'
          )
          focused_pytest = text.index(
              '\nrun(\n    sys.executable,\n    "-m",\n    "pytest",',
              first_black,
          )
          text = text[:first_black] + text[focused_pytest:]

          ruff_check = text.index(
              '\nrun(\n    sys.executable,\n    "-m",\n    "ruff",'
          )
          git_config = text.index('\n\nrun("git", "config"', ruff_check)
          text = (
              text[:ruff_check]
              + '\nrun("git", "diff", "--check")'
              + text[git_config:]
          )
          path.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/tmp_apply_futures_volume_whitelist_pr.py
          git commit -m 'chore(tdd): keep helper validation patch-scoped'

      - name: Prove regressions, apply exact patch and validate
        id: targeted
        shell: bash
        run: |
          set +e
          python tools/tmp_apply_futures_volume_whitelist_pr.py > tdd-helper.log 2>&1
          rc=$?
          cat tdd-helper.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload TDD evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futures-volume-whitelist-tdd-log
          path: tdd-helper.log

      - name: Fail when targeted correction failed
        if: steps.targeted.outputs.rc != '0'
        run: exit 1
