name: One-shot futures volume and whitelist TDD

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-targeted-correction:
    if: github.head_ref == 'fix/futures-volume-provenance-whitelist-20260804'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/futures-volume-provenance-whitelist-20260804
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q

      - name: Keep generated regression name within lint width
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/tmp_apply_futures_volume_whitelist_pr.py")
          text = path.read_text()
          text = text.replace(
              "test_futures_volume_ignores_trade_quantity_and_preserves_cumulative_baseline",
              "test_futures_volume_ignores_trade_quantity_and_keeps_baseline",
          )
          path.write_text(text)
          PY

      - name: Prove regressions, apply exact patch, validate and commit
        run: python tools/tmp_apply_futures_volume_whitelist_pr.py
