name: Focused daily risk budget regression

on:
  push:
    branches:
      - ci/daily-risk-budget-focused-20260831

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
      - name: Compile
        run: python -m compileall -q src tests
      - name: Daily risk budget regression
        run: python -m pytest -q tests/execution/test_entry_daily_risk_budget.py
      - name: Margin engine regression
        run: python -m pytest -q tests/execution/test_margin_engine.py
      - name: Order manager trade-plan regression
        run: python -m pytest -q tests/execution/test_order_manager_trade_plan.py
      - name: Risk final-gate regression
        run: python -m pytest -q tests/risk/test_risk_check_order_daily_limits.py tests/risk/test_risk_rejection_codes.py
