name: Diagnose PR890 full suite

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      BRACKET_AUTO_RESTORE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install exact dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q
      - name: Capture first failure
        shell: bash
        run: |
          set +e
          python -m pytest -q -x --tb=long > /tmp/pr890-full-suite.txt 2>&1
          echo $? > /tmp/pr890-full-suite.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr890-full-suite
          path: |
            /tmp/pr890-full-suite.txt
            /tmp/pr890-full-suite.status
      - name: Preserve result
        run: exit "$(cat /tmp/pr890-full-suite.status)"
