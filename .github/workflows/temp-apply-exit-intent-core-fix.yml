name: Temporary targeted exit-intent core edit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/explicit-exit-intent-bypasses-entry-gates
          fetch-depth: 0
      - name: Apply exact core edit and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/nifty_scalper_bot/execution/order_manager_core.py')
          text = path.read_text(encoding='utf-8')
          old = '''        is_system_exit = any(
              x in normalized_tag for x in ["exit", "stop", "target", "square", "guard"]
          )'''
          new = '''        is_system_exit = normalized_intent in {"EXIT", "REDUCE"} or any(
              x in normalized_tag for x in ["exit", "stop", "target", "square", "guard"]
          )'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target expression, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm -f .tmp_exit_intent_patch_trigger
          rm .github/workflows/temp-apply-exit-intent-core-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/nifty_scalper_bot/execution/order_manager_core.py .github/workflows/temp-apply-exit-intent-core-fix.yml .tmp_exit_intent_patch_trigger
          git commit -m "fix: make reducing intent authoritative for gate bypass"
          git push origin HEAD:fix/explicit-exit-intent-bypasses-entry-gates
