name: one-shot-atomic-basket-fix

on:
  push:
    branches:
      - fix/canonical-live-entry-blockers-20260917

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-live-entry-blockers-20260917
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/one_shot_atomic_basket_fix.py
      - run: |
          rm tools/one_shot_atomic_basket_fix.py
          rm .github/workflows/one-shot-atomic-basket-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/nifty_scalper_bot/core/app.py tools/one_shot_atomic_basket_fix.py .github/workflows/one-shot-atomic-basket-fix.yml
          git commit -m "fix(core): make selected basket commit delivery-atomic"
          git push origin HEAD:fix/canonical-live-entry-blockers-20260917
