name: Fix margin reject cooldown once

on:
  push:
    branches:
      - fix/margin-reject-retry-cooldown-20260805

permissions:
  contents: write

jobs:
  patch-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/margin-reject-retry-cooldown-20260805
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q
      - name: Apply targeted correction and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          runner = Path('src/nifty_scalper_bot/strategies/runner.py')
          text = runner.read_text()
          old = '                "insufficient_margin",\n                "available_balance_unavailable",'
          new = '                "insufficient_margin",\n                "margin needed=",\n                "margin_no_qty",\n                "available_balance_unavailable",'
          if old not in text:
              raise SystemExit('margin reject classifier needle not found')
          runner.write_text(text.replace(old, new, 1))

          test = Path('tests/strategies/test_order_rejected_observability.py')
          body = test.read_text()
          addition = '''\n\ndef test_margin_needed_rejection_is_deterministic_risk_capacity() -> None:\n    assert (\n        StrategyRunner._deterministic_execution_reject_reason(\n            "MARGIN needed=11225.50"\n        )\n        == "risk_capacity_unavailable"\n    )\n\n\ndef test_margin_no_qty_rejection_is_deterministic_risk_capacity() -> None:\n    assert (\n        StrategyRunner._deterministic_execution_reject_reason("margin_no_qty")\n        == "risk_capacity_unavailable"\n    )\n'''
          if 'test_margin_needed_rejection_is_deterministic_risk_capacity' not in body:
              test.write_text(body + addition)
          PY
      - name: Focused regression
        run: python -m pytest -q tests/strategies/test_order_rejected_observability.py
      - name: Adjacent runner and execution tests
        run: |
          python -m pytest -q \
            tests/strategies/test_order_rejected_observability.py \
            tests/execution/test_margin_engine.py \
            tests/execution/test_margin_clamp.py \
            tests/execution/test_order_manager_trade_plan.py
      - name: Quality checks
        run: |
          python -m compileall -q src tests
          python -m ruff check tests/strategies/test_order_rejected_observability.py
          python -m black --check tests/strategies/test_order_rejected_observability.py
          git diff --check
      - name: Full suite
        env:
          BRACKET_AUTO_RESTORE: 'false'
        run: python -m pytest -q
      - name: Commit validated correction
        run: |
          rm .github/workflows/fix-margin-reject-cooldown-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nifty_scalper_bot/strategies/runner.py tests/strategies/test_order_rejected_observability.py .github/workflows/fix-margin-reject-cooldown-once.yml
          git commit -m 'fix(runner): suppress repeated deterministic margin retries'
          git push origin HEAD:fix/margin-reject-retry-cooldown-20260805
