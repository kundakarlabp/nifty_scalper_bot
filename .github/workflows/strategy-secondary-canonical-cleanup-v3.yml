name: Strategy secondary canonical cleanup v3

on:
  push:
    branches:
      - strategy-secondary-canonical-cleanup-20260912

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply and validate canonical source
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -q '\[secondary-canonicalized\]'; then
            echo 'validated source commit already applied'
            exit 0
          fi
          python scripts/_secondary_strategy_canonicalize.py
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m compileall -q src
          python -m pytest -q \
            tests/strategies/test_secondary_strategy_canonical_contracts.py \
            tests/strategies/test_signal_observability_contract.py \
            tests/strategies/test_orderflow_context_only_role.py \
            tests/strategies/test_elite_builder_mode.py
          python -m ruff check --select E9,F,I \
            src/nifty_scalper_bot/strategies/elite_strategies/order_flow.py \
            src/nifty_scalper_bot/strategies/elite_strategies/oi_max_pain.py \
            src/nifty_scalper_bot/strategies/elite_strategies/gamma_scalping.py \
            src/nifty_scalper_bot/strategies/elite_tuesday_gamma_buyer.py \
            src/nifty_scalper_bot/strategies/elite_validator.py \
            tests/strategies/test_secondary_strategy_canonical_contracts.py \
            tests/strategies/test_signal_observability_contract.py
          python -m black --check --diff \
            src/nifty_scalper_bot/strategies/elite_strategies/oi_max_pain.py \
            src/nifty_scalper_bot/strategies/elite_strategies/gamma_scalping.py \
            src/nifty_scalper_bot/strategies/elite_validator.py \
            tests/strategies/test_secondary_strategy_canonical_contracts.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .env.example \
            src/nifty_scalper_bot/strategies/elite_strategies/order_flow.py \
            src/nifty_scalper_bot/strategies/elite_strategies/order_flow_live_context_patch.py \
            src/nifty_scalper_bot/strategies/elite_tuesday_gamma_buyer.py \
            tests/strategies/test_signal_observability_contract.py
          git commit -m 'Canonicalize remaining secondary strategy seams [secondary-canonicalized]'
          git push origin HEAD:strategy-secondary-canonical-cleanup-20260912
