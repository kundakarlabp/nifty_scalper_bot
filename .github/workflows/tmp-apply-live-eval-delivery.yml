name: tmp-apply-live-eval-delivery

on:
  push:
    branches:
      - fix/live-eval-delivery-20260826

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[skip patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-eval-delivery-20260826
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Add regression test only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/data/test_mdm_callback_dispatch.py')
          text = p.read_text()
          marker = 'def test_datahub_repairs_stale_mdm_delegate_subscription() -> None:'
          if marker not in text:
              text += '''\n\ndef test_datahub_repairs_stale_mdm_delegate_subscription() -> None:\n    """Stale DataHub bookkeeping must not sever the live MDM -> DataHub bridge."""\n    mdm = MarketDataManager(DummyBroker(), websocket=None)\n    hub = DataHub(mdm)\n    symbol = "NFO:NIFTY26AUG25000CE"\n    token = 123\n    mdm.register_symbol(symbol, token)\n\n    # Reproduce production drift: DataHub remembers a delegate subscription,\n    # while the actual MDM callback set no longer contains DataHub.ingest_tick_sync.\n    hub._mdm_subscribed_symbols.add(symbol)\n    assert hub.ingest_tick_sync not in mdm._subscribers[mdm._canonical_symbol(symbol)]\n\n    seen: list[dict[str, Any]] = []\n\n    def runner_callback(tick: dict[str, Any]) -> None:\n        seen.append(tick)\n\n    hub.subscribe_ticks(symbol, runner_callback, token=token, force_live=True)\n\n    assert hub.ingest_tick_sync in mdm._subscribers[mdm._canonical_symbol(symbol)]\n    mdm._emit_tick(\n        symbol,\n        {\n            "symbol": symbol,\n            "instrument_token": token,\n            "ltp": 101.0,\n            "bid": 100.9,\n            "ask": 101.1,\n        },\n        source="ws",\n    )\n    assert seen\n    assert seen[-1]["ltp"] == 101.0\n'''
              p.write_text(text)
          PY

      - name: Prove regression is red before source fix
        shell: bash
        run: |
          set +e
          pytest -q tests/data/test_mdm_callback_dispatch.py::test_datahub_repairs_stale_mdm_delegate_subscription
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo 'Regression unexpectedly passed before source fix' >&2
            exit 1
          fi
          echo 'Expected RED reproduced.'

      - name: Apply narrow source repair
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          mdm_path = Path('src/nifty_scalper_bot/data/market_data_manager.py')
          mdm = mdm_path.read_text()
          if 'def has_subscription(self, symbol: str, callback: TickCallback) -> bool:' not in mdm:
              needle = '''    def unsubscribe(self, symbol: str, callback: TickCallback) -> None:\n        """Remove *callback* from subscribers of *symbol*."""\n'''
              insert = '''    def has_subscription(self, symbol: str, callback: TickCallback) -> bool:\n        """Return whether the exact callback is registered for canonical symbol ticks."""\n        symbol = self._canonical_symbol(symbol)\n        with self._lock:\n            return callback in self._subscribers.get(symbol, set())\n\n    def unsubscribe(self, symbol: str, callback: TickCallback) -> None:\n        """Remove *callback* from subscribers of *symbol*."""\n'''
              if needle not in mdm:
                  raise SystemExit('MDM unsubscribe insertion anchor not found')
              mdm = mdm.replace(needle, insert, 1)
              mdm_path.write_text(mdm)

          hub_path = Path('src/nifty_scalper_bot/data/data_hub.py')
          hub = hub_path.read_text()
          pattern = re.compile(
              r'''        if symbol in self\._mdm_subscribed_symbols:\n(?P<body>.*?)            return\n        mdm_sub = getattr\(self\._mdm, "subscribe", None\)\n''',
              re.S,
          )
          m = pattern.search(hub)
          if not m:
              if 'DATAHUB_MDM_SUBSCRIPTION_DRIFT_REPAIR' not in hub:
                  raise SystemExit('DataHub subscription repair anchor not found')
          else:
              replacement = '''        mdm_sub = getattr(self._mdm, "subscribe", None)\n        mdm_has_subscription = getattr(self._mdm, "has_subscription", None)\n        actual_mdm_subscription = False\n        if callable(mdm_has_subscription):\n            try:\n                actual_mdm_subscription = bool(\n                    mdm_has_subscription(symbol, self.ingest_tick_sync)\n                )\n            except Exception:\n                actual_mdm_subscription = False\n        elif symbol in self._mdm_subscribed_symbols:\n            # Compatibility for legacy MDM stubs without an identity probe.\n            actual_mdm_subscription = True\n\n        if symbol in self._mdm_subscribed_symbols and actual_mdm_subscription:\n            self._set_subscription_state(\n                symbol,\n                SubscriptionState.QUEUED,\n                reason="already_queued",\n            )\n            LOGGER.info(\n                "DATAHUB_LIVE_SUBSCRIBE symbol=%s subscribed=true reason=already_subscribed",\n                symbol,\n                extra={\n                    "event": "DATAHUB_LIVE_SUBSCRIBE",\n                    "symbol": symbol,\n                    "trace_id": trace_id,\n                    "subscribed": True,\n                    "reason": "already_subscribed",\n                    "mdm_delegate_called": False,\n                },\n            )\n            return\n\n        if symbol in self._mdm_subscribed_symbols and not actual_mdm_subscription:\n            self._mdm_subscribed_symbols.discard(symbol)\n            LOGGER.warning(\n                "DATAHUB_MDM_SUBSCRIPTION_DRIFT_REPAIR symbol=%s action=reassert_delegate",\n                symbol,\n                extra={\n                    "event": "DATAHUB_MDM_SUBSCRIPTION_DRIFT_REPAIR",\n                    "symbol": symbol,\n                    "trace_id": trace_id,\n                    "action": "reassert_delegate",\n                },\n            )\n\n'''
              hub = hub[:m.start()] + replacement + hub[m.end():]
              hub_path.write_text(hub)
          PY

      - name: Focused tests and compile
        run: |
          pytest -q tests/data/test_mdm_callback_dispatch.py tests/core/test_selected_option_runtime_delivery.py tests/data/test_datahub_subscription_state.py tests/data/test_datahub_token_subscription_bridge.py
          python -m compileall -q src

      - name: Commit source and regression, remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-apply-live-eval-delivery.yml
          git add src/nifty_scalper_bot/data/market_data_manager.py src/nifty_scalper_bot/data/data_hub.py tests/data/test_mdm_callback_dispatch.py
          git commit -m 'fix(data): repair stale MDM to DataHub tick delivery [skip patch]'
          git push origin HEAD:fix/live-eval-delivery-20260826
