name: Railway Redeploy

on:
  workflow_run:
    workflows: ["Live Exit Safety CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  redeploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Railway deployment hook when configured
        env:
          RAILWAY_DEPLOY_HOOK_URL: ${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${RAILWAY_DEPLOY_HOOK_URL}" ]; then
            echo "Railway native GitHub deployment remains primary; optional deploy hook is not configured."
            exit 0
          fi
          curl --fail --show-error --silent \
            --retry 3 --retry-all-errors \
            --request POST "${RAILWAY_DEPLOY_HOOK_URL}"
