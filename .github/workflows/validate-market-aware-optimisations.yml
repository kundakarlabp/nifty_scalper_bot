          python -m compileall -q src dashboard scripts tests
      - name: Focused market-aware tests
        env:
          BRACKET_AUTO_RESTORE: "false"
        run: |
          test -f tests/strategies/test_vwap_mean_reversion.py
          test -f tests/strategies/test_elite_builder_mode.py
          test -f tests/execution/test_execution_policy.py
          test -f tests/execution/test_execution_safety_audit_fixes.py
          python -m pytest -q tests/strategies/test_vwap_mean_reversion.py tests/strategies/test_elite_builder_mode.py tests/execution/test_execution_policy.py tests/execution/test_execution_safety_audit_fixes.py
      - name: Execution safety regression tests
        env:
          BRACKET_AUTO_RESTORE: "false"
        run: |
          python -m pytest -q tests/test_execution_path_contract.py tests/execution/test_runtime_order_facade.py tests/execution/test_runtime_bracket_facade.py tests/execution/test_bracket_exit_state_machine.py tests/execution/test_virtual_bracket_safety.py tests/execution/test_live_exit_hardening.py
      - name: Full repository suite
        env:
          BRACKET_AUTO_RESTORE: "false"
        run: python -m pytest -q
      - name: Verify committed tree unchanged
        run: git diff --exit-code
      - name: Package validated candidate
        run: |
          mkdir -p /tmp/candidate
          cp -R src tests /tmp/candidate/
