name: Validate Market-Aware Optimisations

on:
  pull_request:
  push:
    branches:
      - feat/market-aware-execution-optimisations-20260629

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q
      - name: Compile and diff check
        run: |
          git diff --check
          python -m compileall -q src dashboard scripts tests
      - name: SSOT entry exit risk guard tests
        env:
          BRACKET_AUTO_RESTORE: "false"
        run: |
          python -m pytest -q tests/execution/test_operator_exit_intent_contract.py tests/execution/test_protective_order_intent_patch.py tests/execution/test_entry_geometry_guard.py tests/execution/test_manual_exit_classification.py tests/execution/test_manual_order_quarantine.py tests/risk/test_risk_check_order_daily_limits.py
      - name: Notification ping auth tests
        env:
          BRACKET_AUTO_RESTORE: "false"
        run: python -m pytest -q tests/notifications/test_operator_telegram.py -k 'ping or unauthorized'
      - name: Notification subsystem selftest tests
        env:
          BRACKET_AUTO_RESTORE: "false"
        run: python -m pytest -q tests/notifications/test_operator_telegram.py -k 'missing_subsystem or selftest'
      - name: Notification handler why tests
        env:
          BRACKET_AUTO_RESTORE: "false"
        run: python -m pytest -q tests/notifications/test_operator_telegram.py -k 'handler_exception or why'
      - name: Notification complete file
        env:
          BRACKET_AUTO_RESTORE: "false"
        run: python -m pytest -q tests/notifications/test_operator_telegram.py
