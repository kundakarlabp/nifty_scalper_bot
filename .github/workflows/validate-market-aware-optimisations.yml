name: Validate Market-Aware Optimisations

on:
  pull_request:
  push:
    branches:
      - feat/market-aware-execution-optimisations-20260629

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q
      - name: Apply focused futures-context patch
        if: github.head_ref == 'fix/remaining-live-path-hardening'
        run: python .github/apply_futures_context_fix.py
      - name: Compile and diff check
        run: |
          python -m compileall -q src tests
          git diff --check
      - name: Focused futures-context tests
        if: github.head_ref == 'fix/remaining-live-path-hardening'
        run: |
          CONTEXT_TEST=$(find tests -name 'test_strategy_manager_context_to_option_propagation.py' -print -quit)
          VWAP_TEST=$(find tests -name 'test_vwap_pro_side_domain.py' -print -quit)
          test -n "$CONTEXT_TEST"
          test -n "$VWAP_TEST"
          python -m pytest -q "$CONTEXT_TEST" "$VWAP_TEST"
      - name: Core and strategy suites
        if: github.head_ref == 'fix/remaining-live-path-hardening'
        run: python -m pytest -q tests/core tests/strategies
      - name: Live simulation
        if: github.head_ref == 'fix/remaining-live-path-hardening'
        run: python -m pytest -q -m live_runtime_e2e tests/e2e/live_sim
      - name: Full suite
        if: github.head_ref == 'fix/remaining-live-path-hardening'
        run: python -m pytest -q
      - name: Commit validated correction and restore CI workflow
        if: github.head_ref == 'fix/remaining-live-path-hardening'
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/validate-market-aware-optimisations.yml
          rm -f .github/workflows/apply-futures-context-fix.yml .github/apply_futures_context_fix.py
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests .github
          git commit -m "fix: preserve authoritative futures context semantics"
          git push origin HEAD:${{ github.head_ref }}
      - name: Operator check execution tests
        if: github.head_ref != 'fix/remaining-live-path-hardening'
        env:
          BRACKET_AUTO_RESTORE: "false"
        run: python -m pytest -q tests/notifications/test_operator_telegram.py -k 'check_execution'
      - name: Operator stale tests
        if: github.head_ref != 'fix/remaining-live-path-hardening'
        env:
          BRACKET_AUTO_RESTORE: "false"
        run: python -m pytest -q tests/notifications/test_operator_telegram.py -k 'stale'
      - name: Operator remaining unique tests
        if: github.head_ref != 'fix/remaining-live-path-hardening'
        env:
          BRACKET_AUTO_RESTORE: "false"
        run: python -m pytest -q tests/notifications/test_operator_telegram.py -k 'unique or legacy'
      - name: Notification complete file
        if: github.head_ref != 'fix/remaining-live-path-hardening'
        env:
          BRACKET_AUTO_RESTORE: "false"
        run: python -m pytest -q tests/notifications/test_operator_telegram.py
