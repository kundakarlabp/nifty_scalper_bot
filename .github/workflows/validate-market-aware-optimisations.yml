name: Validate Market-Aware Optimisations

on:
  pull_request:
  push:
    branches:
      - feat/market-aware-execution-optimisations-20260629

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q
      - name: Compile and diff check
        run: python -m compileall -q src tests
      - name: Operator check execution tests
        env:
          BRACKET_AUTO_RESTORE: "false"
        run: python -m pytest -q tests/notifications/test_operator_telegram.py -k 'check_execution'
      - name: Operator stale tests
        env:
          BRACKET_AUTO_RESTORE: "false"
        run: python -m pytest -q tests/notifications/test_operator_telegram.py -k 'stale'
      - name: Operator remaining unique tests
        env:
          BRACKET_AUTO_RESTORE: "false"
        run: python -m pytest -q tests/notifications/test_operator_telegram.py -k 'unique or legacy'
      - name: Notification complete file
        env:
          BRACKET_AUTO_RESTORE: "false"
        run: python -m pytest -q tests/notifications/test_operator_telegram.py
