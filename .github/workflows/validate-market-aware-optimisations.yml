name: Validate Market-Aware Optimisations

on:
  pull_request:
  push:
    branches:
      - feat/market-aware-execution-optimisations-20260629

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q
      - name: Apply focused futures-context patch
        if: github.head_ref == 'fix/remaining-live-path-hardening'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/apply_futures_context_fix.py')
          text = path.read_text()
          old = '''        source_timestamp = indicators.get("timestamp") or indicators.get("context_timestamp_epoch") or 0.0
        source_age_seconds = resolve_tick_age_seconds(indicators)
        snapshot = {
'''
          new = '''        source_age_seconds = resolve_tick_age_seconds(indicators)
        if source_age_seconds is None:
            for source in (
                getattr(self, "_market_data_manager", None),
                getattr(self, "_data_hub", None),
            ):
                age_getter = getattr(source, "time_since_last_tick", None)
                if not callable(age_getter):
                    continue
                try:
                    candidate_age = age_getter(symbol)
                    source_age_seconds = None if candidate_age is None else max(0.0, float(candidate_age))
                except (TypeError, ValueError, RuntimeError):
                    source_age_seconds = None
                if source_age_seconds is not None:
                    break
        source_timestamp = indicators.get("timestamp") or indicators.get("context_timestamp_epoch") or 0.0
        if not source_timestamp and source_age_seconds is not None:
            source_timestamp = time.time() - source_age_seconds
        snapshot = {
'''
          if old not in text:
              raise SystemExit('patch-script provenance anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace(
              '    assert snapshot["timestamp"] == 0.0\n',
              '    assert snapshot["timestamp"] < snapshot["snapshot_updated_at"]\n',
              1,
          )
          path.write_text(text)
          PY
          python .github/apply_futures_context_fix.py
      - name: Compile and diff check
        run: |
          python -m compileall -q src tests
          git diff --check
      - name: Focused futures-context tests
        if: github.head_ref == 'fix/remaining-live-path-hardening'
        run: |
          mapfile -t TEST_FILES < <(find tests -type f \( -name 'test_strategy_manager*.py' -o -name 'test_vwap*.py' \) | sort)
          test ${#TEST_FILES[@]} -gt 0
          printf '%s\n' "${TEST_FILES[@]}"
          python -m pytest -q --tb=short "${TEST_FILES[@]}"
      - name: Core and strategy suites
        if: github.head_ref == 'fix/remaining-live-path-hardening'
        run: python -m pytest -q --tb=short tests/core tests/strategies
      - name: Live simulation
        if: github.head_ref == 'fix/remaining-live-path-hardening'
        run: python -m pytest -q -m live_runtime_e2e tests/e2e/live_sim
      - name: Full suite
        if: github.head_ref == 'fix/remaining-live-path-hardening'
        run: python -m pytest -q
      - name: Commit validated correction and restore CI workflow
        if: github.head_ref == 'fix/remaining-live-path-hardening'
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/validate-market-aware-optimisations.yml
          rm -f .github/workflows/apply-futures-context-fix.yml .github/apply_futures_context_fix.py
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests .github
          git commit -m "fix: preserve authoritative futures context semantics"
          git push origin HEAD:${{ github.head_ref }}
      - name: Operator check execution tests
        if: github.head_ref != 'fix/remaining-live-path-hardening'
        env:
          BRACKET_AUTO_RESTORE: "false"
        run: python -m pytest -q tests/notifications/test_operator_telegram.py -k 'check_execution'
      - name: Operator stale tests
        if: github.head_ref != 'fix/remaining-live-path-hardening'
        env:
          BRACKET_AUTO_RESTORE: "false"
        run: python -m pytest -q tests/notifications/test_operator_telegram.py -k 'stale'
      - name: Operator remaining unique tests
        if: github.head_ref != 'fix/remaining-live-path-hardening'
        env:
          BRACKET_AUTO_RESTORE: "false"
        run: python -m pytest -q tests/notifications/test_operator_telegram.py -k 'unique or legacy'
      - name: Notification complete file
        if: github.head_ref != 'fix/remaining-live-path-hardening'
        env:
          BRACKET_AUTO_RESTORE: "false"
        run: python -m pytest -q tests/notifications/test_operator_telegram.py
