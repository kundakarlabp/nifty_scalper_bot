name: Validate Market-Aware Optimisations

on:
  pull_request:
  push:
    branches:
      - feat/market-aware-execution-optimisations-20260629

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q
      - name: Compile and diff check
        run: python -m compileall -q src tests
      - name: Operator check execution tests
        env:
          BRACKET_AUTO_RESTORE: "false"
        run: python -m pytest -q tests/notifications/test_operator_telegram.py -k 'check_execution'
      - name: Operator stale tests
        env:
          BRACKET_AUTO_RESTORE: "false"
        run: python -m pytest -q tests/notifications/test_operator_telegram.py -k 'stale'
      - name: Operator remaining unique tests
        env:
          BRACKET_AUTO_RESTORE: "false"
        run: python -m pytest -q tests/notifications/test_operator_telegram.py -k 'unique or legacy'
      - name: Notification complete file
        env:
          BRACKET_AUTO_RESTORE: "false"
        run: python -m pytest -q tests/notifications/test_operator_telegram.py

  strategy-stall-fix-once:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/strategy-stall-production'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strategy-stall-production
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Add focused regressions
        env:
          TESTS_B64: 
        run: echo "$TESTS_B64" | base64 -d >> tests/strategies/test_runner_market_closed_watchdog.py
      - name: Prove regressions fail before correction
        run: |
          if pytest -q tests/strategies/test_runner_market_closed_watchdog.py -k 'single_owner or active_risk_breaker'; then
            echo 'Expected pre-fix failure did not occur'
            exit 1
          fi
      - name: Apply minimal runner correction
        env:
          PATCH_B64: 
        run: echo "$PATCH_B64" | base64 -d | python
      - name: Validate focused and full trading path
        run: |
          python -m compileall -q src/nifty_scalper_bot/strategies/runner.py
          pytest -q tests/strategies/test_runner_market_closed_watchdog.py
          pytest -q tests/core tests/strategies tests/execution
          pytest -q tests/e2e/live_sim
          pytest -q
      - name: Commit clean correction
        run: |
          rm -f .github/workflows/tmp-strategy-stall-fix.yml .github/strategy-stall-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: suppress intentional strategy stall alarms'
          git push origin HEAD:fix/strategy-stall-production
