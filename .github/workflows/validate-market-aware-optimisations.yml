name: Validate Market-Aware Optimisations

on:
  pull_request:
  push:
    branches:
      - feat/market-aware-execution-optimisations-20260629

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q
      - name: Compile and diff check
        run: |
          git diff --check
          python -m compileall -q src dashboard scripts tests
      - name: Focused market-aware tests
        env:
          BRACKET_AUTO_RESTORE: "false"
        shell: bash
        run: |
          set +e
          test -f tests/strategies/test_vwap_mean_reversion.py
          test -f tests/strategies/test_elite_builder_mode.py
          test -f tests/execution/test_execution_policy.py
          test -f tests/execution/test_execution_safety_audit_fixes.py
          python -m pytest -q tests/strategies/test_vwap_mean_reversion.py tests/strategies/test_elite_builder_mode.py tests/execution/test_execution_policy.py tests/execution/test_execution_safety_audit_fixes.py > focused-pytest-output.txt 2>&1
          echo $? > focused-pytest-exit-code.txt
          exit 0
      - name: Execution safety regression tests
        env:
          BRACKET_AUTO_RESTORE: "false"
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_execution_path_contract.py tests/execution/test_runtime_order_facade.py tests/execution/test_runtime_bracket_facade.py tests/execution/test_bracket_exit_state_machine.py tests/execution/test_virtual_bracket_safety.py tests/execution/test_live_exit_hardening.py > safety-pytest-output.txt 2>&1
          echo $? > safety-pytest-exit-code.txt
          exit 0
      - name: Full repository suite
        env:
          BRACKET_AUTO_RESTORE: "false"
        shell: bash
        run: |
          set +e
          python -m pytest -q > full-pytest-output.txt 2>&1
          echo $? > full-pytest-exit-code.txt
          exit 0
      - name: Build audit report
        shell: bash
        run: |
          python tools/repo_janitor.py > janitor-output.txt 2>&1
          tar -czf repository-snapshot.tar.gz src tests pyproject.toml pytest.ini
      - name: Upload test audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-suite-audit
          path: |
            focused-pytest-output.txt
            focused-pytest-exit-code.txt
            safety-pytest-output.txt
            safety-pytest-exit-code.txt
            full-pytest-output.txt
            full-pytest-exit-code.txt
            janitor-output.txt
            JANITOR_REPORT.json
            repository-snapshot.tar.gz
          if-no-files-found: error
      - name: Enforce test success
        shell: bash
        run: |
          test "$(cat focused-pytest-exit-code.txt)" = "0"
          test "$(cat safety-pytest-exit-code.txt)" = "0"
          test "$(cat full-pytest-exit-code.txt)" = "0"
      - name: Verify committed tree unchanged
        run: git diff --exit-code
