name: P0 P1 Runtime Hardening Recovery Once

on:
  push:
    branches:
      - fix/p0-p1-runtime-hardening-recovery-20260806

permissions:
  contents: write

jobs:
  apply-validate-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      BRACKET_AUTO_RESTORE: "false"
      NSB_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-p1-runtime-hardening-recovery-20260806
          fetch-depth: 100

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q

      - name: Reconstruct and compile patch units
        run: |
          cat scripts/p0p1_chunks/worker.part.* | base64 -d > /tmp/apply_worker.py
          cat scripts/p0p1_chunks/watchdog.raw.* > /tmp/apply_watchdog.py
          cat scripts/p0p1_chunks/app_main.part.* | base64 -d > /tmp/apply_app_main.py
          cat scripts/p0p1_chunks/tests.part.* | base64 -d > /tmp/apply_tests.py
          python -m py_compile \
            /tmp/apply_worker.py \
            scripts/apply_reconcile.py \
            scripts/fix_worker_stop_wakeup_v2.py \
            /tmp/apply_watchdog.py \
            /tmp/apply_app_main.py \
            /tmp/apply_tests.py

      - name: Apply actual P0 and P1 corrections
        run: |
          python /tmp/apply_worker.py
          python scripts/fix_worker_stop_wakeup_v2.py
          python scripts/apply_reconcile.py
          python /tmp/apply_watchdog.py
          python /tmp/apply_app_main.py
          python /tmp/apply_tests.py

      - name: Format intended Python files
        run: |
          python -m black \
            src/nifty_scalper_bot/data/market_data_hardening.py \
            src/nifty_scalper_bot/execution/position_manager.py \
            src/nifty_scalper_bot/infra/watchdog.py \
            src/nifty_scalper_bot/core/app.py \
            src/nifty_scalper_bot/main.py \
            tests/data/test_fallback_tick_worker_lifecycle.py \
            tests/execution/test_position_reconcile_singleflight.py \
            tests/infra/test_market_data_supervisor.py \
            tests/core/test_minimum_lot_affordability_readiness.py

      - name: Focused and adjacent regressions
        run: |
          python -m pytest -q \
            tests/data/test_fallback_tick_worker_lifecycle.py \
            tests/data/test_mdm_tick_coalescing.py \
            tests/data/test_event_loop_thread_telemetry.py \
            tests/execution/test_position_reconcile_singleflight.py \
            tests/execution/test_canonical_execution_recovery.py \
            tests/infra/test_market_data_supervisor.py \
            tests/core/test_minimum_lot_affordability_readiness.py \
            tests/core/test_runtime_readiness.py \
            tests/e2e/live_sim/test_live_runtime_startup_contract.py

      - name: Compile and changed-file quality
        run: |
          python -m compileall -q src dashboard scripts
          python -m ruff check \
            src/nifty_scalper_bot/data/market_data_hardening.py \
            src/nifty_scalper_bot/execution/position_manager.py \
            src/nifty_scalper_bot/infra/watchdog.py \
            src/nifty_scalper_bot/core/app.py \
            src/nifty_scalper_bot/main.py \
            tests/data/test_fallback_tick_worker_lifecycle.py \
            tests/execution/test_position_reconcile_singleflight.py \
            tests/infra/test_market_data_supervisor.py \
            tests/core/test_minimum_lot_affordability_readiness.py
          python -m black --check \
            src/nifty_scalper_bot/data/market_data_hardening.py \
            src/nifty_scalper_bot/execution/position_manager.py \
            src/nifty_scalper_bot/infra/watchdog.py \
            src/nifty_scalper_bot/core/app.py \
            src/nifty_scalper_bot/main.py \
            tests/data/test_fallback_tick_worker_lifecycle.py \
            tests/execution/test_position_reconcile_singleflight.py \
            tests/infra/test_market_data_supervisor.py \
            tests/core/test_minimum_lot_affordability_readiness.py

      - name: Complete repository suite
        run: python -m pytest -q

      - name: Remove generated and leaked temporary artifacts
        run: |
          git checkout -- positions.json 2>/dev/null || true
          rm -rf .pytest-data-dir .pytest_cache diagnostics
          rm -f \
            .github/workflows/p0-p1-format-diagnostic.yml \
            .github/workflows/p0-p1-runtime-hardening-once.yml \
            .github/workflows/p0-p1-runtime-hardening-v2.yml \
            .github/workflows/p0-p1-runtime-hardening-recovery-once.yml \
            scripts/apply_reconcile.py \
            scripts/fix_worker_stop_wakeup.py \
            scripts/fix_worker_stop_wakeup_v2.py
          rm -rf scripts/p0p1_chunks

      - name: Verify final production diff scope
        run: |
          git status --short
          python - <<'PY'
          import subprocess

          intended = {
              'src/nifty_scalper_bot/data/market_data_hardening.py',
              'src/nifty_scalper_bot/execution/position_manager.py',
              'src/nifty_scalper_bot/infra/watchdog.py',
              'src/nifty_scalper_bot/core/app.py',
              'src/nifty_scalper_bot/main.py',
              'tests/data/test_fallback_tick_worker_lifecycle.py',
              'tests/execution/test_position_reconcile_singleflight.py',
              'tests/infra/test_market_data_supervisor.py',
              'tests/core/test_minimum_lot_affordability_readiness.py',
          }
          cleanup_prefixes = (
              '.github/workflows/p0-p1-',
              'scripts/p0p1_chunks/',
          )
          cleanup_files = {
              'scripts/apply_reconcile.py',
              'scripts/fix_worker_stop_wakeup.py',
              'scripts/fix_worker_stop_wakeup_v2.py',
          }
          lines = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          changed = {line[3:] for line in lines if len(line) > 3}
          unexpected = sorted(
              path for path in changed
              if path not in intended
              and path not in cleanup_files
              and not path.startswith(cleanup_prefixes)
          )
          missing = sorted(path for path in intended if path not in changed)
          if unexpected:
              raise SystemExit(f'unexpected files: {unexpected}')
          if missing:
              raise SystemExit(f'missing intended changes: {missing}')
          print('validated final paths:', sorted(changed))
          PY

      - name: Commit validated production correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(runtime): apply P0/P1 hardening and remove leaked validation assets'
          git push origin HEAD:fix/p0-p1-runtime-hardening-recovery-20260806
