name: Fix PR1187 final history depth

on:
  push:
    branches:
      - fix/candle-engine-ssot-consolidation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply canonical projection-depth fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/nifty_scalper_bot/strategies/runner.py')
          text = path.read_text()
          old = '''        try:\n            rows = self._get_mdm_bars(normalized, max(target, indicator_before))\n        except (AttributeError, TypeError, ValueError) as exc:\n            rows = []\n            failure_reason = f"mdm_history_read_failed:{type(exc).__name__}"\n'''
          new = '''        # Runner/Indicator are derived projections of CandleEngine-owned MDM history.\n        # Do not truncate a warm canonical cache to the execution-readiness minimum:\n        # deeper cached bars are required by derived indicators such as ADX (28 bars)\n        # even when the selected-option readiness minimum is lower.  This is a\n        # cache-only read; it never triggers broker history from the tick path.\n        read_limit = max(target, indicator_before)\n        for provider in (\n            getattr(self, "_market_data", None),\n            getattr(self, "_data_hub", None),\n        ):\n            capacity_for = getattr(provider, "history_capacity_for", None)\n            if not callable(capacity_for):\n                continue\n            try:\n                canonical_capacity = int(capacity_for(normalized))\n            except (AttributeError, TypeError, ValueError):\n                continue\n            except Exception:\n                continue\n            if canonical_capacity > 0:\n                read_limit = max(read_limit, canonical_capacity)\n                break\n        try:\n            rows = self._get_mdm_bars(normalized, read_limit)\n        except (AttributeError, TypeError, ValueError) as exc:\n            rows = []\n            failure_reason = f"mdm_history_read_failed:{type(exc).__name__}"\n'''
          if old not in text:
              raise SystemExit('target sync_history_from_mdm block not found exactly once')
          if text.count(old) != 1:
              raise SystemExit(f'target block count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q
      - name: Syntax and targeted regressions
        env:
          ALLOW_NETWORK: 'false'
          ALLOW_REAL_BROKER: 'false'
          BROKER_SIMULATION: 'true'
          EXECUTION_MODE: 'LIVE_SIMULATION'
          BRACKET_AUTO_RESTORE: 'false'
        run: |
          python -m py_compile src/nifty_scalper_bot/strategies/runner.py
          python -m pytest -q \
            tests/strategies/test_canonical_history_depth_expansion.py \
            tests/core/test_underlying_context_history_propagation.py \
            tests/e2e/live_sim/test_live_runtime_startup_contract.py::test_live_runtime_bullish_spot_future_selects_ce_and_exits_target
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-pr1187-final-history-depth.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nifty_scalper_bot/strategies/runner.py tests/strategies/test_canonical_history_depth_expansion.py tests/core/test_underlying_context_history_propagation.py .github/workflows/fix-pr1187-final-history-depth.yml
          git diff --cached --check
          git commit -m 'fix: mirror canonical history depth into derived state'
          git push origin HEAD:fix/candle-engine-ssot-consolidation
