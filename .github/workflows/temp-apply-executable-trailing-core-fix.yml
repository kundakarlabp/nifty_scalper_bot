name: Temporary targeted executable trailing core edit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/executable-trailing-watermark
          fetch-depth: 0
      - name: Apply exact trailing watermark edit and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/nifty_scalper_bot/execution/bracket_core.py')
          text = path.read_text(encoding='utf-8')

          marker = "    def _is_trail_candidate_allowed(\n"
          helper = '''    def _trailing_executable_state(\n        self, bracket: BracketState, ltp: float\n    ) -> tuple[float, float]:\n        \"\"\"Return executable trail price and a monotonic persisted watermark.\"\"\"\n        price, _source = self._executable_exit_price(bracket, ltp)\n        entry = float(bracket.entry_price or price or ltp)\n        config = bracket.trailing_config\n        key = (\n            \"_highest_executable_exit_price\"\n            if bracket.side == \"BUY\"\n            else \"_lowest_executable_exit_price\"\n        )\n        try:\n            previous = float(config.get(key, entry) or entry)\n        except (TypeError, ValueError):\n            previous = entry\n        if not math.isfinite(previous) or previous <= 0:\n            previous = entry\n        if bracket.side == \"BUY\":\n            watermark = max(entry, previous, float(price))\n        else:\n            watermark = min(entry, previous, float(price))\n        config[key] = _round_to_tick(watermark)\n        return float(price), float(config[key])\n\n'''
          if text.count(marker) != 1:
              raise SystemExit(f'expected one trail-candidate marker, found {text.count(marker)}')
          text = text.replace(marker, helper + marker)

          old_candidate_activation = "        activation_r = self._trail_activation_r(bracket)\n\n        if bracket.side == \"BUY\":"
          new_candidate_activation = "        activation_r = self._trail_activation_r(bracket)\n        ltp, trail_watermark = self._trailing_executable_state(bracket, ltp)\n\n        if bracket.side == \"BUY\":"
          if text.count(old_candidate_activation) != 1:
              raise SystemExit(f'candidate activation match count={text.count(old_candidate_activation)}')
          text = text.replace(old_candidate_activation, new_candidate_activation)

          old_buy_mfe = "                mfe = max(float(bracket.highest_ltp or entry), ltp) - entry"
          new_buy_mfe = "                mfe = max(float(trail_watermark or entry), ltp) - entry"
          old_sell_water = "            low_water = float(bracket.lowest_ltp or entry)"
          new_sell_water = "            low_water = float(trail_watermark or entry)"
          if text.count(old_buy_mfe) != 1 or text.count(old_sell_water) != 1:
              raise SystemExit('unexpected trail candidate watermark occurrences')
          text = text.replace(old_buy_mfe, new_buy_mfe).replace(old_sell_water, new_sell_water)

          old_apply_entry = "        entry = bracket.entry_price\n        if entry <= 0:\n            return False\n\n        current_sl = bracket.sl_trigger_price"
          new_apply_entry = "        entry = bracket.entry_price\n        if entry <= 0:\n            return False\n        ltp, high_water = self._trailing_executable_state(bracket, float(ltp))\n\n        current_sl = bracket.sl_trigger_price"
          if text.count(old_apply_entry) != 1:
              raise SystemExit(f'apply entry match count={text.count(old_apply_entry)}')
          text = text.replace(old_apply_entry, new_apply_entry)

          old_metrics = '''        # Calculate profit metrics\n        if bracket.side == \"BUY\":\n            profit_pct = ((ltp - entry) / entry) * 100\n            high_water = bracket.highest_ltp\n            profit_points = ltp - entry\n        else:\n            profit_pct = ((entry - ltp) / entry) * 100\n            high_water = bracket.lowest_ltp\n            profit_points = entry - ltp'''
          new_metrics = '''        # Calculate profit metrics from executable price; LTP watermarks remain\n        # informational and are not allowed to tighten live protection.\n        if bracket.side == \"BUY\":\n            profit_pct = ((ltp - entry) / entry) * 100\n            profit_points = ltp - entry\n        else:\n            profit_pct = ((entry - ltp) / entry) * 100\n            profit_points = entry - ltp'''
          if text.count(old_metrics) != 1:
              raise SystemExit(f'profit metrics match count={text.count(old_metrics)}')
          text = text.replace(old_metrics, new_metrics)

          old_tier_mfe = '''        if bracket.side == \"BUY\":\n            mfe = float(bracket.highest_ltp or ltp or entry) - entry\n        else:\n            mfe = entry - float(bracket.lowest_ltp or ltp or entry)'''
          new_tier_mfe = '''        if bracket.side == \"BUY\":\n            mfe = float(high_water or ltp or entry) - entry\n        else:\n            mfe = entry - float(high_water or ltp or entry)'''
          if text.count(old_tier_mfe) != 1:
              raise SystemExit(f'tier MFE match count={text.count(old_tier_mfe)}')
          text = text.replace(old_tier_mfe, new_tier_mfe)

          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/temp-apply-executable-trailing-core-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/nifty_scalper_bot/execution/bracket_core.py .github/workflows/temp-apply-executable-trailing-core-fix.yml
          git commit -m "fix: base trailing ratchet on executable watermark"
          git push origin HEAD:fix/executable-trailing-watermark
