name: Apply focused live rearm readiness fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-rearm-pd-nameerror-20260703
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply minimal fix and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('src/nifty_scalper_bot/core/app.py')
          source = app_path.read_text(encoding='utf-8')
          marker = 'import pytz\n'
          pandas_import = 'import pandas as pd\n'
          if pandas_import not in source:
              if source.count(marker) != 1:
                  raise SystemExit(f'expected one {marker!r}, found {source.count(marker)}')
              source = source.replace(marker, pandas_import + marker, 1)
              app_path.write_text(source, encoding='utf-8')

          test_path = Path('tests/core/test_live_rearm_pandas_binding.py')
          test_path.write_text('''from __future__ import annotations

import ast
from pathlib import Path


def _app_tree() -> ast.Module:
    source = Path("src/nifty_scalper_bot/core/app.py").read_text(encoding="utf-8")
    return ast.parse(source)


def test_live_rearm_readiness_binds_pandas_alias() -> None:
    tree = _app_tree()
    imports = {
        alias.asname
        for node in tree.body
        if isinstance(node, ast.Import)
        for alias in node.names
        if alias.name == "pandas"
    }
    assert "pd" in imports


def test_runtime_readiness_timestamp_fallback_uses_bound_pd_alias() -> None:
    tree = _app_tree()
    function = next(
        node
        for node in tree.body
        if isinstance(node, (ast.AsyncFunctionDef, ast.FunctionDef))
        and node.name == "_recompute_and_push_runtime_readiness"
    )
    pd_attributes = {
        node.attr
        for node in ast.walk(function)
        if isinstance(node, ast.Attribute)
        and isinstance(node.value, ast.Name)
        and node.value.id == "pd"
    }
    assert {"to_datetime", "isna", "Timestamp"}.issubset(pd_attributes)
''', encoding='utf-8')
          PY

      - name: Focused validation
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m py_compile src/nifty_scalper_bot/core/app.py tests/core/test_live_rearm_pandas_binding.py
          python -m pytest -q tests/core/test_live_rearm_pandas_binding.py
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('src/nifty_scalper_bot/core/app.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source)
          pandas_aliases = {
              alias.asname
              for node in tree.body
              if isinstance(node, ast.Import)
              for alias in node.names
              if alias.name == 'pandas'
          }
          assert 'pd' in pandas_aliases
          fn = next(
              node for node in tree.body
              if isinstance(node, ast.AsyncFunctionDef)
              and node.name == '_recompute_and_push_runtime_readiness'
          )
          pd_loads = [
              node for node in ast.walk(fn)
              if isinstance(node, ast.Name)
              and node.id == 'pd'
              and isinstance(node.ctx, ast.Load)
          ]
          assert pd_loads
          assert source.count('import pandas as pd\n') == 1
          print(f'focused validation passed: pd_loads={len(pd_loads)}')
          PY

      - name: Commit validated patch
        shell: bash
        run: |
          rm -f .github/workflows/live-rearm-pd-fix.yml
          rm -f .github/live-rearm-patch-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: bind pandas in live readiness rearm path'
          git push origin HEAD:fix/live-rearm-pd-nameerror-20260703
