name: Temporary Full Test Diagnostics

on:
  push:
    branches:
      - codex/test-suite-repair-2026-07-02

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BRACKET_AUTO_RESTORE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q
      - name: Run complete suite without early stop
        shell: bash
        run: |
          set +e
          python -m compileall -q src dashboard scripts tests > compile-output.txt 2>&1
          echo $? > compile-exit-code.txt
          python -m pytest -q --maxfail=0 > full-pytest-output.txt 2>&1
          echo $? > full-pytest-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: complete-test-diagnostics
          path: |
            compile-output.txt
            compile-exit-code.txt
            full-pytest-output.txt
            full-pytest-exit-code.txt
          if-no-files-found: error
