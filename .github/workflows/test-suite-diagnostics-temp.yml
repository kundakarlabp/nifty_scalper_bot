name: Temporary Targeted Test Validation

on:
  pull_request:
  push:
    branches:
      - codex/test-suite-repair-2026-07-02

permissions:
  contents: read

jobs:
  validate-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRACKET_AUTO_RESTORE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q
      - name: Compile tests
        run: python -m compileall -q tests
      - name: Validate repaired and consolidated tests
        run: |
          python -m pytest -q \
            tests/core/test_app_runner_symbol_gate.py \
            tests/streaming/test_stream_supervisor_fallback.py \
            tests/execution/test_execution_safety_audit_fixes.py::test_bracket_state_is_written_and_restored_with_ledger_recovery_fields \
            tests/strategies/test_vwap_mean_reversion.py \
            tests/strategies/test_elite_builder_mode.py \
            tests/execution/test_execution_policy.py
