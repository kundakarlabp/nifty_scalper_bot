name: Canonicalize runner quality owner once

on:
  push:
    branches:
      - canonical-runner-quality-owner-20260913
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonical-runner-quality-owner-20260913
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply focused migration
        run: python tools/canonicalize_runner_quality_once.py
      - name: Validate focused migration
        run: |
          python -m pip install -e '.[dev]' -q
          python -m compileall -q src/nifty_scalper_bot/strategies
          python -m pytest -q \
            tests/strategies/test_runner_final_quality_owner.py \
            tests/strategies/test_signal_quality_strategy_thresholds.py \
            tests/strategies/test_candidate_specific_option_readiness.py \
            tests/strategies/test_option_score_fails_closed.py
          git diff --check
      - name: Publish validated source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/nifty_scalper_bot/strategies/runner.py \
            src/nifty_scalper_bot/strategies/elite_strategies/orb_pro.py \
            tests/strategies/test_runner_final_quality_owner.py
          if git diff --cached --quiet; then
            echo 'No source change required.'
            exit 0
          fi
          git commit -m 'Refactor: make runner final quality the single score owner'
          git push origin HEAD:canonical-runner-quality-owner-20260913
