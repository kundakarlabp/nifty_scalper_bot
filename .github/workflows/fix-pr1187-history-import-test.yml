name: Fix PR1187 history import test

on:
  push:
    branches:
      - fix/candle-engine-ssot-consolidation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Migrate rollover test to CandleEngine capacity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/data/test_mdm_history_import_result_contract.py')
          text = path.read_text()
          old_import = 'from nifty_scalper_bot.data.market_data_manager import MarketDataManager\n'
          new_import = 'from nifty_scalper_bot.data.candle_engine import CandleEngine\nfrom nifty_scalper_bot.data.market_data_manager import MarketDataManager\n'
          if old_import not in text:
              raise SystemExit('MarketDataManager import anchor missing')
          text = text.replace(old_import, new_import, 1)
          old = '''def test_history_import_new_bar_counter_idempotent_and_rollover() -> None:\n    mdm = _mdm()\n    mdm._cache_len = 1\n    first = mdm.import_historical_ohlc(SYMBOL, [_bar()])\n'''
          new = '''def test_history_import_new_bar_counter_idempotent_and_rollover() -> None:\n    mdm = _mdm()\n    # Raw tick retention is independent from finalized OHLC retention. Exercise\n    # rollover by configuring the authoritative CandleEngine itself.\n    mdm._cache_len = 1\n    mdm._engines[SYMBOL] = CandleEngine(max_bars=1, symbol=SYMBOL)\n    first = mdm.import_historical_ohlc(SYMBOL, [_bar()])\n'''
          if text.count(old) != 1:
              raise SystemExit(f'rollover anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
      - name: Run migrated contract tests
        env:
          BRACKET_AUTO_RESTORE: 'false'
        run: |
          python -m pytest -q tests/data/test_mdm_history_import_result_contract.py
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-pr1187-history-import-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/data/test_mdm_history_import_result_contract.py .github/workflows/fix-pr1187-history-import-test.yml
          git diff --cached --check
          git commit -m 'test: decouple history rollover from tick cache'
          git push origin HEAD:fix/candle-engine-ssot-consolidation
