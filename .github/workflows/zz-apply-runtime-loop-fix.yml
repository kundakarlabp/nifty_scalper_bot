name: Apply authoritative runtime-loop history fix

on:
  push:
    branches:
      - fix/runtime-delivery-liveness-20260804

permissions:
  contents: write

jobs:
  apply-tested-loop-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-delivery-liveness-20260804
          fetch-depth: 0
      - name: Decode and verify patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/runtime-loop-fix.patch.gz.b64 | gzip -d > /tmp/runtime-loop-fix.patch
          echo '3549ef520e4a337b613cdcd06eec175fbbc3d88e4b3cb8f71edb8542cbf3f406  /tmp/runtime-loop-fix.patch' | sha256sum -c -
          git apply --check /tmp/runtime-loop-fix.patch
      - name: Apply exact TDD-validated fix
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/runtime-loop-fix.patch
          rm -f .github/runtime-loop-fix.patch.gz.b64
          rm -f .github/workflows/zz-apply-runtime-loop-fix.yml
          git diff --check
          python -m compileall -q src tests
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(runtime): keep history hydration on the authoritative loop'
          git push origin HEAD:fix/runtime-delivery-liveness-20260804
