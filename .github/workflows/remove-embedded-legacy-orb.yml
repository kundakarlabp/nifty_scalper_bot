name: Remove embedded legacy ORB once

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'canonical-strategy-catalog-cleanup-20260913'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonical-strategy-catalog-cleanup-20260913
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove embedded legacy ORB implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/nifty_scalper_bot/strategies/signal_generator.py')
          text = path.read_text(encoding='utf-8')
          marker = '\nclass OpeningRangeBreakoutStrategy(Strategy):'
          count = text.count(marker)
          if count == 0:
              print('Embedded legacy ORB already absent; no source mutation needed.')
              raise SystemExit(0)
          assert count == 1, f'expected one embedded legacy ORB class, found {count}'
          start = text.index(marker)
          end = text.find('\nclass ', start + len(marker))
          assert end > start, 'could not identify next class boundary'
          text = text[:start] + text[end:]
          text = text.replace('    "OpeningRangeBreakoutStrategy",\n', '')
          assert marker not in text
          path.write_text(text, encoding='utf-8')
          PY
          python -m pip install black -q
          python -m black src/nifty_scalper_bot/strategies/signal_generator.py
          python -m compileall -q src/nifty_scalper_bot/strategies/signal_generator.py
          if grep -q 'class OpeningRangeBreakoutStrategy' src/nifty_scalper_bot/strategies/signal_generator.py; then
            echo 'legacy ORB class remains' >&2
            exit 1
          fi
      - name: Publish migrated source
        shell: bash
        run: |
          if git diff --quiet -- src/nifty_scalper_bot/strategies/signal_generator.py; then
            echo 'No source change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nifty_scalper_bot/strategies/signal_generator.py
          git commit -m 'Refactor: remove embedded legacy ORB implementation'
          git push origin HEAD:canonical-strategy-catalog-cleanup-20260913
