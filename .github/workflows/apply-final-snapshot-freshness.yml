name: Apply final snapshot freshness
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_final_snapshot_freshness.py'
permissions:
  contents: write
jobs:
  apply-test-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply canonical transform on current main
        run: |
          git checkout -B fix/final-snapshot-freshness
          python scripts/apply_final_snapshot_freshness.py
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Focused freshness tests
        run: |
          pytest -q tests/execution/test_final_snapshot_freshness.py tests/strategies/test_runner_final_snapshot_freshness_contract.py
      - name: Full regression suite
        run: pytest -q
      - name: Commit and push validated change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nifty_scalper_bot/strategies/runner.py tests/strategies/test_runner_final_snapshot_freshness_contract.py
          git commit -m 'fix: arm final live entry freshness checks'
          git push --force origin fix/final-snapshot-freshness
