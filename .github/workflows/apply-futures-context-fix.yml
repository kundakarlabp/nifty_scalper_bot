name: Apply futures context correction

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.head_ref == 'fix/remaining-live-path-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply minimal futures-context patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          manager_path = Path('src/nifty_scalper_bot/core/strategy_manager.py')
          text = manager_path.read_text()

          text = text.replace(
              '        previous_snapshot = dict(self._latest_context_snapshots.get(role, {}) or {})\n',
              '',
              1,
          )

          old = '''        derived_direction, derived_confidence, derived_reasons = self._derive_context_direction(indicators, role=role)
        context_kind = (
            "price_direction"
            if role == "spot_context"
            else "volume_flow"
            if role == "futures_context"
            else "unknown"
        )
        current_volume = _num("volume")
        current_avg_volume = _num("avg_volume")
        current_vwap = _num("vwap", "exchange_vwap", "session_vwap")
        current_close = _num("close", "ltp", "price")
        futures_volume_ratio = _num("futures_volume_ratio")
        futures_volume_ratio_source = "indicator"
        if role == "futures_context" and (futures_volume_ratio is None or futures_volume_ratio <= 0):
            if (
                current_volume is not None
                and current_avg_volume is not None
                and current_avg_volume > 0
            ):
                futures_volume_ratio = current_volume / max(current_avg_volume, 1e-9)
                futures_volume_ratio_source = "derived_volume_avg"
        vwap_slope = _num("vwap_slope")
        vwap_slope_source = "indicator"
        if role == "futures_context" and (vwap_slope is None or abs(vwap_slope) <= 1e-12):
            prev_vwap = previous_snapshot.get("vwap")
            try:
                prev_vwap_f = float(prev_vwap) if prev_vwap is not None else None
            except (TypeError, ValueError):
                prev_vwap_f = None
            if current_vwap is not None and prev_vwap_f and prev_vwap_f > 0:
                vwap_slope = (current_vwap - prev_vwap_f) / prev_vwap_f
                vwap_slope_source = "derived_previous_snapshot"
        ema_slope = _num("ema_slope")
        if role == "futures_context" and (ema_slope is None or abs(ema_slope) <= 1e-12):
            prev_close = previous_snapshot.get("close") or previous_snapshot.get("ltp")
            try:
                prev_close_f = float(prev_close) if prev_close is not None else None
            except (TypeError, ValueError):
                prev_close_f = None
            if current_close is not None and prev_close_f and prev_close_f > 0:
                ema_slope = (current_close - prev_close_f) / prev_close_f
'''
          new = '''        context_kind = (
            "price_direction"
            if role == "spot_context"
            else "volume_flow"
            if role == "futures_context"
            else "unknown"
        )
        current_volume = _num("volume")
        current_avg_volume = _num("avg_volume")
        futures_volume_ratio = _num("futures_volume_ratio")
        futures_volume_ratio_source = "indicator" if futures_volume_ratio is not None else "unavailable"
        if (
            role == "futures_context"
            and futures_volume_ratio is None
            and current_volume is not None
            and current_avg_volume is not None
            and current_avg_volume > 0
        ):
            futures_volume_ratio = current_volume / current_avg_volume
            futures_volume_ratio_source = "derived_volume_avg"
        vwap_slope = _num("vwap_slope")
        ema_slope = _num("ema_slope")
        vwap_slope_source = "indicator" if vwap_slope is not None else "unavailable"
        direction_inputs = dict(indicators)
        direction_inputs.update(
            futures_volume_ratio=futures_volume_ratio,
            vwap_slope=vwap_slope,
            ema_slope=ema_slope,
        )
        derived_direction, derived_confidence, derived_reasons = self._derive_context_direction(
            direction_inputs,
            role=role,
        )
'''
          if old not in text:
              raise SystemExit('strategy_manager metric block not found')
          text = text.replace(old, new, 1)

          old = '''        snapshot = {
            "symbol": symbol, "role": role, "context_kind": context_kind, "timestamp": time.time(),
'''
          new = '''        source_timestamp = indicators.get("timestamp") or indicators.get("context_timestamp_epoch") or 0.0
        source_age_seconds = resolve_tick_age_seconds(indicators)
        snapshot = {
            "symbol": symbol, "role": role, "context_kind": context_kind,
            "timestamp": source_timestamp, "snapshot_updated_at": time.time(),
            "tick_age_s": source_age_seconds,
'''
          if old not in text:
              raise SystemExit('strategy_manager snapshot header not found')
          text = text.replace(old, new, 1)
          text = text.replace('            "context_timestamp_epoch": time.time(),\n', '            "context_timestamp_epoch": source_timestamp,\n', 1)

          text = text.replace('        vwap_slope = _f("vwap_slope") or 0.0\n', '        vwap_slope = _f("vwap_slope")\n', 1)
          text = text.replace('        ema_slope = _f("ema_slope") or 0.0\n', '        ema_slope = _f("ema_slope")\n', 1)
          text = text.replace('        futures_volume_ratio = _f("futures_volume_ratio") or 0.0\n', '        futures_volume_ratio = _f("futures_volume_ratio")\n', 1)
          text = text.replace(
              '            if close >= vwap: ce_score += 1.0; reasons.append("close_above_vwap")\n            else: pe_score += 1.0; reasons.append("close_below_vwap")\n',
              '            if close > vwap: ce_score += 1.0; reasons.append("close_above_vwap")\n            elif close < vwap: pe_score += 1.0; reasons.append("close_below_vwap")\n',
              1,
          )
          text = text.replace(
              '            if ema_fast >= ema_slow: ce_score += 1.0; reasons.append("ema_fast_above_slow")\n            else: pe_score += 1.0; reasons.append("ema_fast_below_slow")\n',
              '            if ema_fast > ema_slow: ce_score += 1.0; reasons.append("ema_fast_above_slow")\n            elif ema_fast < ema_slow: pe_score += 1.0; reasons.append("ema_fast_below_slow")\n',
              1,
          )
          text = text.replace(
              '            if close >= ema_50: ce_score += 0.5; reasons.append("close_above_ema50")\n            else: pe_score += 0.5; reasons.append("close_below_ema50")\n',
              '            if close > ema_50: ce_score += 0.5; reasons.append("close_above_ema50")\n            elif close < ema_50: pe_score += 0.5; reasons.append("close_below_ema50")\n',
              1,
          )
          text = text.replace('        if vwap_slope > 0: ce_score += 0.5; reasons.append("vwap_slope_positive")\n        elif vwap_slope < 0: pe_score += 0.5; reasons.append("vwap_slope_negative")\n', '        if vwap_slope is not None and vwap_slope > 0: ce_score += 0.5; reasons.append("vwap_slope_positive")\n        elif vwap_slope is not None and vwap_slope < 0: pe_score += 0.5; reasons.append("vwap_slope_negative")\n', 1)
          text = text.replace('        if ema_slope > 0: ce_score += 0.5; reasons.append("ema_slope_positive")\n        elif ema_slope < 0: pe_score += 0.5; reasons.append("ema_slope_negative")\n', '        if ema_slope is not None and ema_slope > 0: ce_score += 0.5; reasons.append("ema_slope_positive")\n        elif ema_slope is not None and ema_slope < 0: pe_score += 0.5; reasons.append("ema_slope_negative")\n', 1)
          text = text.replace('        if role == "futures_context" and futures_volume_ratio >= 1.0:\n', '        if role == "futures_context" and futures_volume_ratio is not None and futures_volume_ratio >= 1.0:\n', 1)

          text = text.replace(
              '            if fut_usable:\n                indicators.setdefault("futures_context", fut_ctx)\n',
              '            if fut_fresh:\n                indicators["futures_context"] = fut_ctx\n',
              1,
          )
          old = '                indicators["context_age_seconds"] = min(now_ts - float(spot_ctx.get("timestamp", now_ts)) if spot_usable else max_context_age + 1, now_ts - float(fut_ctx.get("timestamp", now_ts)) if fut_usable else max_context_age + 1)\n'
          new = '''                usable_context_ages = [
                    age
                    for age, usable in (
                        (spot_tick_age_s, spot_usable),
                        (fut_tick_age_s, fut_usable),
                    )
                    if usable and age is not None
                ]
                indicators["context_age_seconds"] = min(usable_context_ages) if usable_context_ages else max_context_age + 1
'''
          if old not in text:
              raise SystemExit('context age line not found')
          text = text.replace(old, new, 1)
          text = text.replace('                indicators.setdefault("futures_volume_ratio", fut_ctx.get("futures_volume_ratio"))\n', '                indicators["futures_volume_ratio"] = fut_ctx.get("futures_volume_ratio")\n', 1)
          text = text.replace('                indicators.setdefault("futures_vwap", fut_ctx.get("vwap"))\n', '                indicators["futures_vwap"] = fut_ctx.get("vwap")\n', 1)
          text = text.replace('                indicators.setdefault("futures_vwap_slope", fut_ctx.get("vwap_slope"))\n', '                indicators["futures_vwap_slope"] = fut_ctx.get("vwap_slope")\n', 1)
          manager_path.write_text(text)

          vwap_path = Path('src/nifty_scalper_bot/strategies/elite_strategies/vwap_pro.py')
          text = vwap_path.read_text()
          old = '''            futures_vwap_slope = float(indicators.get('futures_vwap_slope') or 0.0)
            futures_volume_ratio = float(indicators.get('futures_volume_ratio') or 0.0)
'''
          new = '''            def _optional_float(value: Any) -> float | None:
                try:
                    return None if value is None else float(value)
                except (TypeError, ValueError):
                    return None

            futures_vwap_slope = _optional_float(indicators.get('futures_vwap_slope'))
            futures_volume_ratio = _optional_float(indicators.get('futures_volume_ratio'))
'''
          if old not in text:
              raise SystemExit('VWAPPro futures parse block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              "            fut_vol_support = (contract_side == 'CE' and futures_volume_ratio >= 1.0) or (contract_side == 'PE' and futures_volume_ratio >= 1.0)\n",
              "            fut_vol_support = futures_volume_ratio is not None and futures_volume_ratio >= 1.0\n",
              1,
          )
          old = '''            slope_available = abs(futures_vwap_slope) > self._futures_slope_neutral_eps
            if slope_available:
                slope_support = (contract_side == 'CE' and futures_vwap_slope > 0) or (contract_side == 'PE' and futures_vwap_slope < 0)
                if slope_support:
                    score += 1.0
                    reasons.append('futures_slope_alignment')
                else:
                    reasons.append('futures_slope_conflict')
            else:
                slope_support = False
                reasons.append('futures_slope_neutral')
'''
          new = '''            if futures_vwap_slope is None:
                slope_support = False
                reasons.append('futures_slope_unavailable')
            elif abs(futures_vwap_slope) <= self._futures_slope_neutral_eps:
                slope_support = False
                reasons.append('futures_slope_neutral')
            else:
                slope_support = (contract_side == 'CE' and futures_vwap_slope > 0) or (contract_side == 'PE' and futures_vwap_slope < 0)
                if slope_support:
                    score += 1.0
                    reasons.append('futures_slope_alignment')
                else:
                    reasons.append('futures_slope_conflict')
'''
          if old not in text:
              raise SystemExit('VWAPPro slope block not found')
          text = text.replace(old, new, 1)
          vwap_path.write_text(text)

          tests = list(Path('tests').rglob('test_strategy_manager_context_to_option_propagation.py'))
          if not tests:
              raise SystemExit('context propagation test file not found')
          test_path = tests[0]
          test_text = test_path.read_text()
          marker = 'test_futures_context_preserves_source_age_and_neutrality'
          if marker not in test_text:
              test_text += '''


def test_futures_context_preserves_source_age_and_neutrality() -> None:
    from nifty_scalper_bot.core.strategy_manager import StrategyManager

    manager = object.__new__(StrategyManager)
    manager._latest_context_snapshots = {}
    manager._update_context_snapshot(
        symbol="NFO:NIFTY26JULFUT",
        indicators={
            "close": 25000.0,
            "vwap": 25000.0,
            "ema_fast": 25000.0,
            "ema_slow": 25000.0,
            "ema_50": 25000.0,
            "vwap_slope": 0.0,
            "ema_slope": 0.0,
            "tick_age_s": 180.0,
        },
        role="futures_context",
    )
    snapshot = manager._latest_context_snapshots["futures_context"]
    assert snapshot["tick_age_s"] == 180.0
    assert snapshot["timestamp"] == 0.0
    assert snapshot["vwap_slope"] == 0.0
    assert snapshot["direction_bias"] is None


def test_futures_context_uses_same_evaluation_slope_and_never_snapshot_delta() -> None:
    from nifty_scalper_bot.core.strategy_manager import StrategyManager

    manager = object.__new__(StrategyManager)
    manager._latest_context_snapshots = {
        "futures_context": {"vwap": 100.0, "close": 100.0}
    }
    manager._update_context_snapshot(
        symbol="NFO:NIFTY26JULFUT",
        indicators={"close": 101.0, "vwap": 101.0, "vwap_slope": 0.001, "tick_age_s": 0.1},
        role="futures_context",
    )
    snapshot = manager._latest_context_snapshots["futures_context"]
    assert snapshot["vwap_slope"] == 0.001
    assert snapshot["direction_bias"] == "CE"
    assert "vwap_slope_positive" in snapshot["direction_context_reasons"]

    manager._update_context_snapshot(
        symbol="NFO:NIFTY26JULFUT",
        indicators={"close": 102.0, "vwap": 102.0, "tick_age_s": 0.1},
        role="futures_context",
    )
    assert manager._latest_context_snapshots["futures_context"]["vwap_slope"] is None
'''
              test_path.write_text(test_text)
          PY

      - name: Compile and focused tests
        run: |
          python -m compileall -q src tests
          python -m pytest -q $(find tests -name 'test_strategy_manager_context_to_option_propagation.py' -print -quit) $(find tests -name 'test_vwap_pro_side_domain.py' -print -quit)

      - name: Core and strategy suites
        run: python -m pytest -q tests/core tests/strategies

      - name: Live simulation
        run: python -m pytest -q -m live_runtime_e2e tests/e2e/live_sim

      - name: Full suite
        run: python -m pytest -q

      - name: Commit validated correction and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-futures-context-fix.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests .github/workflows/apply-futures-context-fix.yml
          git commit -m "fix: preserve authoritative futures context semantics"
          git push origin HEAD:${{ github.head_ref }}
