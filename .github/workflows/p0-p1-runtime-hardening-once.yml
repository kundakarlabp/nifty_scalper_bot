name: P0 P1 Runtime Hardening Once

on:
  push:
    branches:
      - fix/p0-p1-runtime-hardening-20260806

permissions:
  contents: write

jobs:
  apply-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      BRACKET_AUTO_RESTORE: "false"
      NSB_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-p1-runtime-hardening-20260806
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q
      - name: Apply P0 and P1 corrections
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/apply_p0_p1.py
          python /tmp/apply_p0_p1.py
      - name: Format changed Python files
        run: |
          python -m black \
            src/nifty_scalper_bot/data/market_data_hardening.py \
            src/nifty_scalper_bot/execution/position_manager.py \
            src/nifty_scalper_bot/infra/watchdog.py \
            src/nifty_scalper_bot/core/app.py \
            src/nifty_scalper_bot/main.py \
            tests/data/test_fallback_tick_worker_lifecycle.py \
            tests/execution/test_position_reconcile_singleflight.py \
            tests/infra/test_market_data_supervisor.py \
            tests/core/test_minimum_lot_affordability_readiness.py
      - name: Focused and adjacent regressions
        run: |
          python -m pytest -q \
            tests/data/test_fallback_tick_worker_lifecycle.py \
            tests/data/test_mdm_tick_coalescing.py \
            tests/data/test_event_loop_thread_telemetry.py \
            tests/execution/test_position_reconcile_singleflight.py \
            tests/execution/test_canonical_execution_recovery.py \
            tests/execution/test_position_reconcile_runtime.py \
            tests/infra/test_market_data_supervisor.py \
            tests/core/test_minimum_lot_affordability_readiness.py \
            tests/core/test_runtime_readiness.py \
            tests/e2e/live_sim/test_live_runtime_startup_contract.py
      - name: Compile and changed-file quality
        run: |
          python -m compileall -q src dashboard scripts
          python -m ruff check \
            src/nifty_scalper_bot/data/market_data_hardening.py \
            src/nifty_scalper_bot/execution/position_manager.py \
            src/nifty_scalper_bot/infra/watchdog.py \
            src/nifty_scalper_bot/core/app.py \
            src/nifty_scalper_bot/main.py \
            tests/data/test_fallback_tick_worker_lifecycle.py \
            tests/execution/test_position_reconcile_singleflight.py \
            tests/infra/test_market_data_supervisor.py \
            tests/core/test_minimum_lot_affordability_readiness.py
          python -m black --check \
            src/nifty_scalper_bot/data/market_data_hardening.py \
            src/nifty_scalper_bot/execution/position_manager.py \
            src/nifty_scalper_bot/infra/watchdog.py \
            src/nifty_scalper_bot/core/app.py \
            src/nifty_scalper_bot/main.py \
            tests/data/test_fallback_tick_worker_lifecycle.py \
            tests/execution/test_position_reconcile_singleflight.py \
            tests/infra/test_market_data_supervisor.py \
            tests/core/test_minimum_lot_affordability_readiness.py
      - name: Full repository suite
        run: python -m pytest -q
      - name: Clean generated artifacts and temporary workflow
        run: |
          git checkout -- positions.json 2>/dev/null || true
          rm -rf .pytest-data-dir .pytest_cache
          rm -f .github/workflows/p0-p1-runtime-hardening-once.yml
      - name: Verify production diff scope
        run: |
          git status --short
          python - <<'PY'
          import subprocess
          allowed = {
              'src/nifty_scalper_bot/data/market_data_hardening.py',
              'src/nifty_scalper_bot/execution/position_manager.py',
              'src/nifty_scalper_bot/infra/watchdog.py',
              'src/nifty_scalper_bot/core/app.py',
              'src/nifty_scalper_bot/main.py',
              'tests/data/test_fallback_tick_worker_lifecycle.py',
              'tests/execution/test_position_reconcile_singleflight.py',
              'tests/infra/test_market_data_supervisor.py',
              'tests/core/test_minimum_lot_affordability_readiness.py',
          }
          paths = set(subprocess.check_output(['git','status','--porcelain'], text=True).splitlines())
          changed = {line[3:] for line in paths if len(line) > 3}
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f'unexpected files: {unexpected}')
          print('validated files:', sorted(changed))
          PY
      - name: Commit validated correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(runtime): harden worker reconciliation and feed supervision [skip ci]'
          git push origin HEAD:fix/p0-p1-runtime-hardening-20260806
