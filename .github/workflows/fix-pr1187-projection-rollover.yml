name: Fix PR1187 projection rollover diagnostic

on:
  push:
    branches:
      - fix/candle-engine-ssot-consolidation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/candle-engine-ssot-consolidation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply bounded-rollover divergence fix
        run: python .github/scripts/fix_pr1187_projection_rollover.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
      - name: Run rollover and corruption regressions
        run: |
          python -m compileall -q src/nifty_scalper_bot/data/market_data_manager.py
          python -m pytest -q \
            tests/data/test_mdm_runner_candle_engine_registry.py::test_normal_projection_append_and_rolling_maxlen_do_not_count_divergence \
            tests/data/test_mdm_history_import_result_contract.py::test_projection_divergence_detects_equal_length_ohlcv_mismatch \
            tests/data/test_mdm_history_import_result_contract.py::test_projection_refresh_reuses_precomputed_timestamp_fingerprints \
            tests/data/test_candle_engine_authoritative_mdm_reads.py
      - name: Remove one-shot helpers and commit
        run: |
          rm .github/workflows/fix-pr1187-projection-rollover.yml
          rm .github/scripts/fix_pr1187_projection_rollover.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nifty_scalper_bot/data/market_data_manager.py .github/workflows/fix-pr1187-projection-rollover.yml .github/scripts/fix_pr1187_projection_rollover.py
          git commit -m 'fix: ignore normal CandleEngine projection rollover divergence'
          git push origin HEAD:fix/candle-engine-ssot-consolidation
