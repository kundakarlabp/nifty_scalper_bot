name: One-shot P0 candle backlog integrity fix

on:
  push:
    branches:
      - fix/p0-candle-backlog-integrity-20260805

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Add regression and focused production fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          production = Path('src/nifty_scalper_bot/data/market_data_hardening.py')
          text = production.read_text(encoding='utf-8')
          old = '''    if now_ts is None:\n        return 0\n\n    engines = list(getattr(self, "_engines", {}).items())\n'''
          new = '''    if now_ts is None:\n        return 0\n\n    # Candle finalisation and bounded tick draining share the owning event loop.\n    # Do not make a minute immutable while accepted ticks are still pending or\n    # currently being drained; otherwise those ticks are rejected later as\n    # finalized_minute and the resulting OHLC/indicator state is incomplete.\n    pending_ticks = max(int(getattr(self, "_pending_tick_count", 0) or 0), 0)\n    drain_active = max(int(getattr(self, "_tick_drain_active", 0) or 0), 0)\n    if pending_ticks or drain_active:\n        return 0\n\n    engines = list(getattr(self, "_engines", {}).items())\n'''
          if old not in text:
              raise SystemExit('target candle flush block not found')
          production.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/data/test_candle_flush_backlog_integrity.py')
          test.write_text('''from __future__ import annotations\n\nimport pandas as pd\n\nfrom nifty_scalper_bot.data.market_data_hardening import _flush_due_candles\n\n\nclass _Engine:\n    def __init__(self) -> None:\n        self.current_candle = {\n            "timestamp": pd.Timestamp("2026-08-05 10:29:00", tz="Asia/Kolkata"),\n            "open": 100.0,\n            "high": 101.0,\n            "low": 99.0,\n            "close": 100.5,\n            "volume": 10,\n        }\n        self.flush_calls = 0\n\n    def flush(self):\n        self.flush_calls += 1\n        candle = dict(self.current_candle)\n        self.current_candle = None\n        return candle\n\n\nclass _Logger:\n    def error(self, *args, **kwargs) -> None:\n        raise AssertionError(args)\n\n    def debug(self, *args, **kwargs) -> None:\n        pass\n\n    def info(self, *args, **kwargs) -> None:\n        pass\n\n\nclass _Manager:\n    def __init__(self) -> None:\n        self._engines = {"NFO:NIFTY2681124600PE": _Engine()}\n        self._pending_tick_count = 1\n        self._tick_drain_active = 0\n        self._last_candle_flush_log_mono = 0.0\n        self._logger = _Logger()\n\n\ndef test_clock_flush_waits_for_accepted_tick_backlog() -> None:\n    manager = _Manager()\n    now = pd.Timestamp("2026-08-05 10:30:05", tz="Asia/Kolkata")\n\n    assert _flush_due_candles(manager, now=now, grace_seconds=1.5) == 0\n    assert manager._engines["NFO:NIFTY2681124600PE"].flush_calls == 0\n\n    manager._pending_tick_count = 0\n    assert _flush_due_candles(manager, now=now, grace_seconds=1.5) == 1\n    assert manager._engines["NFO:NIFTY2681124600PE"].flush_calls == 1\n\n\ndef test_clock_flush_waits_while_tick_drain_is_active() -> None:\n    manager = _Manager()\n    manager._pending_tick_count = 0\n    manager._tick_drain_active = 1\n    now = pd.Timestamp("2026-08-05 10:30:05", tz="Asia/Kolkata")\n\n    assert _flush_due_candles(manager, now=now, grace_seconds=1.5) == 0\n    assert manager._engines["NFO:NIFTY2681124600PE"].flush_calls == 0\n''', encoding='utf-8')
          PY
      - name: Focused tests
        run: pytest -q tests/data/test_candle_flush_backlog_integrity.py tests/data/test_mdm_tick_coalescing.py
      - name: Data tests
        run: pytest -q tests/data
      - name: Compile and changed-code quality
        run: |
          python -m compileall -q src tests/data/test_candle_flush_backlog_integrity.py
          ruff check tests/data/test_candle_flush_backlog_integrity.py
          black --check tests/data/test_candle_flush_backlog_integrity.py
          git diff --check
      - name: Full tests
        run: pytest -q
      - name: Commit validated change
        shell: bash
        run: |
          rm .github/workflows/one-shot-p0-candle-backlog-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/nifty_scalper_bot/data/market_data_hardening.py tests/data/test_candle_flush_backlog_integrity.py .github/workflows/one-shot-p0-candle-backlog-fix.yml
          git commit -m 'fix(data): defer candle flush while accepted ticks are pending'
          git push
