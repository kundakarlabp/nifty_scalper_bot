name: Apply Lightsail live-safety stages

on:
  push:
    branches:
      - codex/lightsail-live-safety-2026-06-25
    paths:
      - scripts/apply_lightsail_live_safety.py
      - .github/workflows/apply-lightsail-live-safety.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lightsail-live-safety-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staged-implementation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/lightsail-live-safety-2026-06-25

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install streamlit

      - name: Configure staged commit identity
        run: |
          git config user.name 'Bhanu Bot'
          git config user.email 'bot@nifty-scalper'

      - name: Stage 1 — canonical quote readiness and OrderFlow stability
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/nifty_scalper_bot/strategies/elite_strategies/order_flow.py')
          text = path.read_text()
          old = "'quote_update_version': indicators.get('quote_update_version'),"
          new = "'quote_update_version': quote_update_version,"
          if text.count(old) == 2:
              text = text.replace(old, new, 1)
              path.write_text(text)
          elif text.count(old) != 1:
              raise SystemExit(f'unexpected quote_update_version anchor count: {text.count(old)}')
          PY
          python scripts/apply_lightsail_live_safety.py --stage quote
          python -m compileall -q src
          python -m pytest -q \
            tests/execution/test_execution_quote_readiness.py \
            tests/strategies/test_base_elite_live_gates.py \
            tests/strategies/test_order_flow_execution_quote_gate.py
          git add \
            src/nifty_scalper_bot/execution/readiness.py \
            src/nifty_scalper_bot/strategies/elite_strategies/base_elite.py \
            src/nifty_scalper_bot/strategies/elite_strategies/order_flow.py \
            src/nifty_scalper_bot/strategies/trade_selector.py \
            tests/execution/test_execution_quote_readiness.py \
            tests/strategies/test_base_elite_live_gates.py \
            tests/strategies/test_order_flow_execution_quote_gate.py
          git commit -m 'fix(stage 1): unify live quote readiness and stabilize OrderFlow'
          git push origin HEAD:codex/lightsail-live-safety-2026-06-25

      - name: Stage 2 — fail-closed broker and runner execution gates
        run: |
          python scripts/apply_lightsail_live_safety.py --stage runtime
          python -m compileall -q src
          python -m pytest -q \
            tests/execution/test_runtime_order_manager_health_fail_closed.py \
            tests/strategies/test_runner_live_fail_closed.py \
            tests/strategies/test_runner_signal_result.py
          git add \
            src/nifty_scalper_bot/execution/runtime_order_manager.py \
            src/nifty_scalper_bot/strategies/runner.py \
            src/nifty_scalper_bot/data/candle_engine.py \
            tests/execution/test_runtime_order_manager_health_fail_closed.py \
            tests/strategies/test_runner_live_fail_closed.py
          git commit -m 'fix(stage 2): fail closed on unknown live execution state'
          git push origin HEAD:codex/lightsail-live-safety-2026-06-25

      - name: Stage 3 — truthful and efficient Lightsail operations console
        run: |
          python scripts/apply_lightsail_live_safety.py --stage dashboard
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('dashboard/event_buffer.py')
          text = path.read_text()
          pattern = r'_TRACE_RE = re\.compile\(r"\\btrace_id=\(\[\^\\s,\}\]\+\)"\).*?\n\n\nclass EventRing:'
          replacement = '''_TRACE_RE = re.compile(r"\\btrace_id=([^\\s,}]+)")


def _terminal_event_key(row: dict[str, str]) -> tuple[str, str] | None:
    message = row.get("message", "")
    if "SIGNAL_EXECUTION_RESULT" not in message:
        return None
    match = _TRACE_RE.search(message)
    if not match:
        return None
    outcome = re.search(r"accepted=([^\\s]+).*?reason=([^\\s]+)", message)
    signature = outcome.group(0) if outcome else message
    return match.group(1), signature


def deduplicate_events(rows: Iterable[dict[str, str]]) -> list[dict[str, str]]:
    """Remove duplicate terminal outcomes while preserving event order."""
    output: list[dict[str, str]] = []
    terminal_seen: set[tuple[str, str]] = set()
    for row in rows:
        key = _terminal_event_key(row)
        if key is not None:
            if key in terminal_seen:
                continue
            terminal_seen.add(key)
        output.append(row)
    return output


class EventRing:'''
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('could not replace dashboard terminal dedup helper')
          text = text.replace(
              '        self.restarts = 0\n        threading.Thread',
              '        self.restarts = 0\n        self._terminal_results_seen: set[tuple[str, str]] = set()\n        threading.Thread',
              1,
          )
          old = '''                    if event:
                        with self.lock:
                            candidate = deduplicate_events([*self.rows, event])
                            if len(candidate) > len(self.rows):
                                self.rows.append(event)
                                self.last_event = time.time()
'''
          new = '''                    if event:
                        with self.lock:
                            terminal_key = _terminal_event_key(event)
                            if terminal_key is not None and terminal_key in self._terminal_results_seen:
                                continue
                            if terminal_key is not None:
                                self._terminal_results_seen.add(terminal_key)
                            if not self.rows or self.rows[-1] != event:
                                self.rows.append(event)
                                self.last_event = time.time()
'''
          if old not in text:
              raise SystemExit('could not replace live event dedup path')
          path.write_text(text.replace(old, new, 1))
          PY
          python -m compileall -q dashboard
          python -m pytest -q tests/dashboard/test_event_buffer.py
          git add \
            dashboard/event_buffer.py \
            dashboard/operations_console.py \
            tests/dashboard/test_event_buffer.py
          git commit -m 'fix(stage 3): make operations status truthful and deduplicate outcomes'
          git push origin HEAD:codex/lightsail-live-safety-2026-06-25

      - name: Stage 4 — Lightsail deployment validation and rollback
        run: |
          python scripts/apply_lightsail_live_safety.py --stage lightsail
          bash -n deploy/lightsail_setup.sh
          python -m compileall -q src dashboard
          git add \
            deploy/lightsail_setup.sh \
            deploy/LIGHTSAIL_DEPLOYMENT.md \
            ARCHITECTURE_TRADING_PATH.md
          git commit -m 'fix(stage 4): harden AWS Lightsail deployment and rollback'
          git push origin HEAD:codex/lightsail-live-safety-2026-06-25

      - name: Full regression suite
        run: |
          python -m pytest -q

      - name: Record validated branch marker
        run: |
          cat > LIGHTSAIL_SAFETY_VALIDATION.md <<'EOF'
          # Lightsail live-safety validation

          This branch was produced in four guarded stages and passed the complete
          pytest suite on GitHub Actions before review. Production deployment is AWS
          Lightsail/systemd; Railway is not part of the execution architecture.
          EOF
          git add LIGHTSAIL_SAFETY_VALIDATION.md
          git commit -m 'test: record successful Lightsail safety regression run'
          git push origin HEAD:codex/lightsail-live-safety-2026-06-25
