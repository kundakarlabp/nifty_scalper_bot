name: Temporary strategy stall validation
on: [push]
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strategy-stall-single-owner
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Prove regressions fail before fix
        run: |
          cp tests/strategies/test_runner_market_closed_watchdog.py /tmp/watchdog_test.py
          python .github/tmp_strategy_stall_patch.py
          cp src/nifty_scalper_bot/strategies/runner.py /tmp/fixed_runner.py
          cp tests/strategies/test_runner_market_closed_watchdog.py /tmp/fixed_test.py
          git checkout -- src/nifty_scalper_bot/strategies/runner.py tests/strategies/test_runner_market_closed_watchdog.py
          cp /tmp/fixed_test.py tests/strategies/test_runner_market_closed_watchdog.py
          if pytest -q tests/strategies/test_runner_market_closed_watchdog.py -k 'single_owner or active_risk_breaker'; then
            echo 'Expected pre-fix failure did not occur'
            exit 1
          fi
          cp /tmp/fixed_runner.py src/nifty_scalper_bot/strategies/runner.py
      - name: Focused validation
        run: |
          python -m compileall -q src/nifty_scalper_bot/strategies/runner.py
          pytest -q tests/strategies/test_runner_market_closed_watchdog.py
      - name: Trading-path validation
        run: |
          pytest -q tests/core tests/strategies tests/execution
          pytest -q tests/e2e/live_sim
          pytest -q
      - name: Commit validated patch
        run: |
          rm .github/workflows/tmp-strategy-stall-fix.yml .github/tmp_strategy_stall_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nifty_scalper_bot/strategies/runner.py tests/strategies/test_runner_market_closed_watchdog.py .github/workflows/tmp-strategy-stall-fix.yml .github/tmp_strategy_stall_patch.py
          git commit -m 'fix: suppress intentional strategy stall alarms'
          git push origin HEAD:fix/strategy-stall-single-owner
