name: Finalize futures context PR

on:
  push:
    branches:
      - fix/remaining-live-path-hardening

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remaining-live-path-hardening
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q

      - name: Apply focused futures-context correction
        run: python .github/apply_futures_context_fix.py

      - name: Compile and focused tests
        run: |
          python -m compileall -q src tests
          git diff --check
          mapfile -t TEST_FILES < <(find tests -type f \( -name 'test_strategy_manager*.py' -o -name 'test_vwap*.py' \) | sort)
          test ${#TEST_FILES[@]} -gt 0
          python -m pytest -q --tb=short "${TEST_FILES[@]}"

      - name: Core and strategy suites
        run: python -m pytest -q --tb=short tests/core tests/strategies

      - name: Live simulation
        run: python -m pytest -q -m live_runtime_e2e tests/e2e/live_sim

      - name: Full suite
        run: python -m pytest -q

      - name: Remove temporary machinery and commit clean diff
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/validate-market-aware-optimisations.yml
          rm -f \
            .github/apply_futures_context_fix.py \
            .github/workflows/apply-futures-context-fix.yml \
            .github/workflows/futures-context-finalize.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests .github
          git status --short
          git commit -m 'fix: preserve authoritative futures context semantics'
          git push origin HEAD:fix/remaining-live-path-hardening
