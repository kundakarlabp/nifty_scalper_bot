name: Apply history event classification fix on PR

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply_history_event_classification_fix_once.py
      - .github/workflows/apply-history-event-classification-fix-pr.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q
      - name: Apply exact parser and regression patches
        run: python scripts/apply_history_event_classification_fix_once.py
      - name: Focused dashboard parser tests
        run: python -m pytest -q tests/dashboard/test_event_buffer_truth.py tests/dashboard/test_superlite_event_truth.py
      - name: Commit parser fix and remove one-shot helpers
        shell: bash
        run: |
          rm -f scripts/apply_history_event_classification_fix_once.py
          rm -f .github/workflows/apply-history-event-classification-fix-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: classify option-context history warmup misses as system events"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
