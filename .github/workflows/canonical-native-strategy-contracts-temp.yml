name: Canonical native strategy contracts temp

on:
  push:
    branches:
      - canonical-native-strategy-contracts-20260912

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !startsWith(github.event.head_commit.message, 'Canonicalize native strategy contracts') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonical-native-strategy-contracts-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest black ruff
      - name: Apply canonical migration
        run: |
          python .github/scripts/canonicalize_native_strategy_contracts.py
          python .github/scripts/remove_indicator_runtime_installer.py
          sed -i '/^import hashlib$/d' src/nifty_scalper_bot/strategies/signal_generator.py
      - name: Format new and directly rewritten small owners
        run: |
          python -m black \
            src/nifty_scalper_bot/strategies/signal_identity.py \
            src/nifty_scalper_bot/strategies/runtime_context_contract.py \
            src/nifty_scalper_bot/strategies/__init__.py \
            tests/strategies/test_identity_contract_installed.py \
            tests/strategies/test_runtime_context_contract_autoinstall.py
          python -m ruff check --fix --select I001 \
            src/nifty_scalper_bot/strategies/signal_identity.py \
            src/nifty_scalper_bot/strategies/signal_generator.py \
            src/nifty_scalper_bot/strategies/indicators.py
      - name: Compile and check introduced correctness
        run: |
          python -m compileall -q src/nifty_scalper_bot/strategies src/nifty_scalper_bot/execution/runtime_order_manager.py src/nifty_scalper_bot/execution/stop_rearm_contract_patch.py
          python -m ruff check --select F821,F822,F823 \
            src/nifty_scalper_bot/strategies \
            src/nifty_scalper_bot/execution/runtime_order_manager.py \
            src/nifty_scalper_bot/execution/stop_rearm_contract_patch.py
          python -m ruff check --select F401,F811,F821,F822,F823,I001 \
            src/nifty_scalper_bot/strategies/signal_identity.py \
            src/nifty_scalper_bot/strategies/runtime_context_contract.py \
            src/nifty_scalper_bot/strategies/__init__.py
      - name: Run identity and runtime-context regression suite
        env:
          ALLOW_NETWORK: 'false'
          ALLOW_REAL_BROKER: 'false'
          BROKER_SIMULATION: 'true'
        run: |
          python -m pytest -q \
            tests/strategies/test_identity_contract_installed.py \
            tests/strategies/test_runtime_context_contract.py \
            tests/strategies/test_runtime_context_contract_autoinstall.py \
            tests/strategies/test_setup_anchor_identity.py \
            tests/strategies/test_signal_observability_contract.py \
            tests/strategies/test_vwap_thesis_history_recovery.py \
            tests/execution/test_stop_rearm_setup_context.py \
            tests/risk/test_structural_stop_rearm.py
      - name: Assert no strategy monkey-patch installer remains
        run: |
          ! grep -R "signal_identity_patch" -n src tests
          ! grep -R "install_indicator_runtime_context_contract" -n src/nifty_scalper_bot/strategies
          ! grep -R "_elite_signal_observability_patch\|_stable_setup_identity_patch\|_live_direction_contract_installed" -n src/nifty_scalper_bot/strategies
      - name: Commit validated source migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git diff --cached --quiet && { echo 'No migration changes'; exit 1; }
          git commit -m 'Canonicalize native strategy contracts'
          git push origin HEAD:canonical-native-strategy-contracts-20260912
