name: P0 P1 Worker Source Capture

on:
  push:
    branches:
      - fix/p0-p1-runtime-hardening-final-20260806

permissions:
  contents: read

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-p1-runtime-hardening-final-20260806
      - name: Reconstruct and apply worker base patch
        run: |
          cat scripts/p0p1_chunks/worker.part.* | base64 -d > /tmp/apply_worker.py
          python -m py_compile /tmp/apply_worker.py
          python /tmp/apply_worker.py
          python -m py_compile src/nifty_scalper_bot/data/market_data_hardening.py
      - uses: actions/upload-artifact@v4
        with:
          name: p0-p1-generated-worker-${{ github.run_id }}
          path: src/nifty_scalper_bot/data/market_data_hardening.py
          retention-days: 3
