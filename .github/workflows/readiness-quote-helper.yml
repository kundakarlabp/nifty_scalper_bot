name: Readiness quote helper

on:
  pull_request:
    branches:
      - ci/readiness-quote-helper-base

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/readiness-freshest-cached-quote'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/readiness-freshest-cached-quote
          fetch-depth: 50
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
      - name: Apply source correction
        run: python scripts/apply_readiness_quote_fix.py
      - name: Focused validation
        run: |
          python -m pytest -q tests/core/test_history_readiness_cached_quote_priority.py tests/core/test_readiness_live_tick_proof.py
          python -m compileall -q src
      - name: Clean temporary helpers and commit
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/live-exit-safety-ci.yml
          rm -f .ci-trigger
          rm -f .github/workflows/tdd-history-readiness-quote-priority.yml
          rm -f .github/workflows/tdd-history-readiness-quote-priority-2.yml
          rm -f .github/workflows/apply-readiness-quote-fix.yml
          rm -f .github/workflows/apply-readiness-quote-fix-pr.yml
          rm -f scripts/apply_readiness_quote_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nifty_scalper_bot/core/history_readiness.py tests/core/test_history_readiness_cached_quote_priority.py .github/workflows .ci-trigger scripts/apply_readiness_quote_fix.py
          git commit -m 'fix: use canonical MDM quote for live readiness'
          git push origin HEAD:fix/readiness-freshest-cached-quote
