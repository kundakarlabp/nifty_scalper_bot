name: Fix futures context indicators once

on:
  push:
    branches:
      - fix/futures-context-indicators-20260805

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/futures-context-indicators-20260805
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q
      - name: Apply correction and regression
        run: |
          python .github/scripts/apply_futures_context_fix.py
          python -m black -q tests/core/test_strategy_manager_context_age.py
      - name: Focused regression
        run: python -m pytest -q tests/core/test_strategy_manager_context_age.py
      - name: Adjacent futures context tests
        run: |
          python -m pytest -q \
            tests/core/test_strategy_manager_context_age.py \
            tests/core/test_futures_resolver_fallback.py \
            tests/strategies/test_active_futures_resolution.py \
            tests/strategies/test_runner_symbol_role_gate.py \
            tests/core/test_strategy_live_safety.py \
            tests/strategies/test_vwap_pro_none_futures_context.py
      - name: Quality checks
        run: |
          python -m compileall -q src tests
          python -m ruff check --select E9,F63,F7,F82 src/nifty_scalper_bot/core/strategy_manager.py
          python -m ruff check tests/core/test_strategy_manager_context_age.py
          python -m black --check tests/core/test_strategy_manager_context_age.py
          git diff --check
      - name: Full suite
        env:
          BRACKET_AUTO_RESTORE: "false"
        run: python -m pytest -q
      - name: Commit validated correction
        run: |
          rm .github/workflows/fix-futures-context-indicators-once.yml
          rm .github/scripts/apply_futures_context_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nifty_scalper_bot/core/strategy_manager.py tests/core/test_strategy_manager_context_age.py .github/workflows/fix-futures-context-indicators-once.yml .github/scripts/apply_futures_context_fix.py
          git commit -m 'fix(strategy): restore futures context EMA availability'
          git push origin HEAD:fix/futures-context-indicators-20260805
