name: Minimal log follow-up

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.head_ref == 'fix/minimal-log-followups'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio
      - name: Add regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/strategies/test_runner_market_closed_watchdog.py')
          text = path.read_text(encoding='utf-8')
          marker = 'test_direction_context_zero_slope_is_not_missing'
          if marker not in text:
              text += '''\n\ndef test_direction_context_zero_slope_is_not_missing():\n    from nifty_scalper_bot.strategies.runner import StrategyRunner\n\n    runner = StrategyRunner.__new__(StrategyRunner)\n    runner._context_required_bars = 0\n    reason, diagnostics = runner._direction_context_missing_reason(\n        {\n            "spot_snapshot": {"symbol": "NSE:NIFTY"},\n            "futures_snapshot": {"symbol": "NFO:NIFTY26JULFUT"},\n            "spot_vwap": 24000.0,\n            "futures_vwap_slope": 0.0,\n            "futures_volume_ratio": 1.0,\n            "regime_snapshot": {"regime": "RANGE"},\n        }\n    )\n\n    assert reason != "missing_futures_slope"\n    assert diagnostics["futures_vwap_slope"] == 0.0\n'''
              path.write_text(text, encoding='utf-8')
          PY
      - name: Prove regression fails before fix
        run: |
          set +e
          python -m pytest -q tests/strategies/test_runner_market_closed_watchdog.py -k zero_slope_is_not_missing
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Regression test unexpectedly passed before production fix.'
            exit 1
          fi
      - name: Apply minimal production fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/nifty_scalper_bot/strategies/runner.py')
          text = path.read_text(encoding='utf-8')
          old = 'elif futures_vwap_slope in (None, 0, 0.0):\n            reason = "missing_futures_slope"'
          new = 'elif futures_vwap_slope is None:\n            reason = "missing_futures_slope"'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one target block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Focused validation
        run: |
          python -m compileall -q src tests
          python -m pytest -q tests/strategies/test_runner_market_closed_watchdog.py
      - name: Trading-path validation
        env:
          EXECUTION_MODE: ''
          BROKER_SIMULATION: ''
          ALLOW_REAL_BROKER: ''
        run: |
          python -m pytest -q tests/core tests/strategies tests/execution
          python -m pytest -q -m live_runtime_e2e tests/e2e/live_sim
          python -m pytest -q
      - name: Commit validated patch
        run: |
          rm .github/workflows/minimal-log-followup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nifty_scalper_bot/strategies/runner.py tests/strategies/test_runner_market_closed_watchdog.py .github/workflows/minimal-log-followup.yml
          git commit -m 'fix: preserve neutral futures slope diagnostics'
          git push origin HEAD:${{ github.head_ref }}
