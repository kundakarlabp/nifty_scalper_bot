name: P0 P1 Position Source Capture

on:
  push:
    branches:
      - fix/p0-p1-runtime-hardening-final-20260806

permissions:
  contents: read

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-p1-runtime-hardening-final-20260806
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install black -q
      - name: Apply complete P0/P1 generation sequence
        run: |
          cat scripts/p0p1_chunks/worker.part.* | base64 -d > /tmp/apply_worker.py
          cat scripts/p0p1_chunks/watchdog.raw.* > /tmp/apply_watchdog.py
          cat scripts/p0p1_chunks/app_main.part.* | base64 -d > /tmp/apply_app_main.py
          cat scripts/p0p1_chunks/tests.part.* | base64 -d > /tmp/apply_tests.py
          python /tmp/apply_worker.py
          python scripts/fix_worker_stop_wakeup_final.py
          python scripts/apply_reconcile.py
          python scripts/fix_reconcile_wrappers_final.py
          python /tmp/apply_watchdog.py
          python scripts/fix_watchdog_generated_final.py
          python /tmp/apply_app_main.py
          python /tmp/apply_tests.py
          python -m black src/nifty_scalper_bot/execution/position_manager.py
          python -m py_compile src/nifty_scalper_bot/execution/position_manager.py
      - uses: actions/upload-artifact@v4
        with:
          name: p0-p1-generated-position-${{ github.run_id }}
          path: src/nifty_scalper_bot/execution/position_manager.py
          retention-days: 3
