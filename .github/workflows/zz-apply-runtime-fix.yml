name: Apply tested runtime fix

on:
  push:
    branches:
      - fix/runtime-delivery-liveness-20260804

permissions:
  contents: write

jobs:
  apply-tested-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-delivery-liveness-20260804
          fetch-depth: 0
      - name: Decode and verify patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/runtime-fix.patch.gz.b64 | gzip -d > /tmp/runtime-fix.patch
          echo '323ed8c27486e4d5d57d14a6d8a567b67bf2fb296128d8e093ebd014ab2282e7  /tmp/runtime-fix.patch' | sha256sum -c -
          git apply --check /tmp/runtime-fix.patch
      - name: Apply exact locally tested diff
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/runtime-fix.patch
          rm -f .github/runtime-fix.patch.gz.b64
          rm -f .github/workflows/zz-apply-runtime-fix.yml
          git diff --check
          python -m compileall -q src tests
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(runtime): restore selected-option delivery and evaluator liveness'
          git push origin HEAD:fix/runtime-delivery-liveness-20260804
