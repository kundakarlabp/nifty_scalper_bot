name: One-shot readiness history integrity TDD

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-targeted-fix:
    if: github.head_ref == 'fix/readiness-history-integrity-20260805'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Prove regressions on untouched code
        run: python .github/scripts/apply_readiness_history_integrity_fix.py red
      - name: Apply narrow production fix
        run: python .github/scripts/apply_readiness_history_integrity_fix.py apply
      - name: Focused integrity regressions
        run: python -m pytest -q tests/strategies/test_runtime_history_activation_integrity.py
      - name: Related history regressions
        run: |
          python -m pytest -q tests/strategies/test_canonical_runner_history_sync.py
          python -m pytest -q tests/data/test_canonical_history_hydration.py
      - name: Related spot readiness regressions
        run: python -m pytest -q tests/test_market_data_manager_spot_readiness.py
      - name: Compile
        run: python -m compileall -q src/nifty_scalper_bot
      - name: Scoped Ruff
        id: ruff
        shell: bash
        run: |
          set +e
          python -m ruff check \
            src/nifty_scalper_bot/strategies/runner.py \
            src/nifty_scalper_bot/data/market_data_manager.py \
            tests/strategies/test_runtime_history_activation_integrity.py \
            2>&1 | tee /tmp/readiness-history-ruff.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Upload Ruff output
        if: failure() && steps.ruff.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: readiness-history-ruff-output
          path: /tmp/readiness-history-ruff.txt
      - name: Scoped Black
        run: |
          python -m black --check \
            src/nifty_scalper_bot/strategies/runner.py \
            src/nifty_scalper_bot/data/market_data_manager.py \
            tests/strategies/test_runtime_history_activation_integrity.py
      - name: Diff integrity
        run: git diff --check
      - name: Commit clean implementation
        run: python .github/scripts/apply_readiness_history_integrity_fix.py commit
