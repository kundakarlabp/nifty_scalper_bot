name: One-shot readiness history integrity TDD

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-targeted-fix:
    if: github.head_ref == 'fix/readiness-history-integrity-20260805'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Prove regressions, apply narrow fix, validate and commit
        run: python .github/scripts/apply_readiness_history_integrity_fix.py
