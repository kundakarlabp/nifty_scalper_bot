name: Temporary MDM Projection TDD

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/nifty_scalper_bot/data/market_data_manager.py'
      - 'tests/data/test_mdm_history_import_result_contract.py'
      - '.github/workflows/tmp-mdm-projection-tdd.yml'

permissions:
  contents: write

jobs:
  focused-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply focused projection hot-path fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/nifty_scalper_bot/data/market_data_manager.py')
          text = path.read_text()

          old = '''        previous_latest = self._latest_projection_timestamp(previous)\n        lag_before_seconds, lag_before_bars = self._projection_lag(\n            completed, canonical_latest_ts, previous_latest\n        )\n'''
          new = '''        previous_latest = self._latest_projection_timestamp(\n            previous, fingerprint=previous_fingerprint\n        )\n        lag_before_seconds, lag_before_bars = self._projection_lag(\n            completed,\n            canonical_latest_ts,\n            previous_latest,\n            completed_fingerprint=canonical_fingerprint,\n        )\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'previous, fingerprint=previous_fingerprint' not in text:
              raise SystemExit('previous projection anchor not found')

          old = '''        refreshed_latest = self._latest_projection_timestamp(projected)\n        lag_after_seconds, lag_after_bars = self._projection_lag(\n            completed, canonical_latest_ts, refreshed_latest\n        )\n'''
          new = '''        projected_fingerprint = canonical_fingerprint[-self._cache_len :]\n        refreshed_latest = self._latest_projection_timestamp(\n            projected, fingerprint=projected_fingerprint\n        )\n        lag_after_seconds, lag_after_bars = self._projection_lag(\n            completed,\n            canonical_latest_ts,\n            refreshed_latest,\n            completed_fingerprint=canonical_fingerprint,\n        )\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'projected, fingerprint=projected_fingerprint' not in text:
              raise SystemExit('refreshed projection anchor not found')

          old = '''    def _latest_projection_timestamp(\n        self, rows: Iterable[Mapping[str, Any]]\n    ) -> pd.Timestamp | None:\n        latest: pd.Timestamp | None = None\n        for row in rows:\n            normalized_ts = self._normalize_bar_timestamp(row)\n            if normalized_ts is None:\n                continue\n            candidate = pd.Timestamp(normalized_ts[0])\n            if latest is None or candidate > latest:\n                latest = candidate\n        return latest\n'''
          new = '''    def _latest_projection_timestamp(\n        self,\n        rows: Iterable[Mapping[str, Any]],\n        *,\n        fingerprint: Sequence[tuple[Any, float, float, float, float, float]]\n        | None = None,\n    ) -> pd.Timestamp | None:\n        if fingerprint is not None:\n            latest_key = max(\n                (item[0] for item in fingerprint if item[0] is not None),\n                default=None,\n            )\n            return pd.Timestamp(latest_key) if latest_key is not None else None\n        latest: pd.Timestamp | None = None\n        for row in rows:\n            normalized_ts = self._normalize_bar_timestamp(row)\n            if normalized_ts is None:\n                continue\n            candidate = pd.Timestamp(normalized_ts[0])\n            if latest is None or candidate > latest:\n                latest = candidate\n        return latest\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'fingerprint: Sequence[tuple[Any, float, float, float, float, float]]' not in text:
              raise SystemExit('latest projection helper anchor not found')

          old = '''    def _projection_lag(\n        self,\n        completed: Sequence[Mapping[str, Any]],\n        canonical_latest: pd.Timestamp | None,\n        projection_latest: pd.Timestamp | None,\n    ) -> tuple[float, float]:\n        if canonical_latest is None:\n            return 0.0, 0.0\n        if projection_latest is None:\n            return (60.0 * len(completed), float(len(completed)))\n        lag_seconds = max(0.0, (canonical_latest - projection_latest).total_seconds())\n        if lag_seconds <= 0.0:\n            return 0.0, 0.0\n        bars = 0\n        projection_dt = projection_latest.to_pydatetime()\n        for row in completed:\n            normalized_ts = self._normalize_bar_timestamp(row)\n            if normalized_ts is not None and normalized_ts[0] > projection_dt:\n                bars += 1\n        return lag_seconds, float(bars)\n'''
          new = '''    def _projection_lag(\n        self,\n        completed: Sequence[Mapping[str, Any]],\n        canonical_latest: pd.Timestamp | None,\n        projection_latest: pd.Timestamp | None,\n        *,\n        completed_fingerprint: Sequence[\n            tuple[Any, float, float, float, float, float]\n        ]\n        | None = None,\n    ) -> tuple[float, float]:\n        if canonical_latest is None:\n            return 0.0, 0.0\n        if projection_latest is None:\n            return (60.0 * len(completed), float(len(completed)))\n        lag_seconds = max(0.0, (canonical_latest - projection_latest).total_seconds())\n        if lag_seconds <= 0.0:\n            return 0.0, 0.0\n        projection_dt = projection_latest.to_pydatetime()\n        if completed_fingerprint is not None:\n            bars = sum(\n                1\n                for item in completed_fingerprint\n                if item[0] is not None and item[0] > projection_dt\n            )\n            return lag_seconds, float(bars)\n        bars = 0\n        for row in completed:\n            normalized_ts = self._normalize_bar_timestamp(row)\n            if normalized_ts is not None and normalized_ts[0] > projection_dt:\n                bars += 1\n        return lag_seconds, float(bars)\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'completed_fingerprint: Sequence[' not in text:
              raise SystemExit('projection lag helper anchor not found')

          path.write_text(text)
          PY
      - uses: psf/black@stable
        with:
          options: "--quiet"
          src: "src/nifty_scalper_bot/data/market_data_manager.py"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
      - name: Focused and adjacent projection tests
        env:
          BRACKET_AUTO_RESTORE: 'false'
        run: |
          python -m pytest -q \
            tests/data/test_mdm_history_import_result_contract.py \
            tests/data/test_candle_engine_ssot_static_audit.py
      - name: Compile and diff integrity
        run: |
          python -m compileall -q src
          git diff --check
      - name: Commit validated source fix
        run: |
          if git diff --quiet -- src/nifty_scalper_bot/data/market_data_manager.py; then
            echo 'Source already contains validated fix.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nifty_scalper_bot/data/market_data_manager.py
          git commit -m 'perf(mdm): reuse candle projection timestamp fingerprints'
          git push origin HEAD:${{ github.head_ref }}
