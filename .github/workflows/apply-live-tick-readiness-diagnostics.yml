name: Apply live-tick readiness diagnostic fix on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/live-tick-readiness-diagnostics'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Apply exact diagnostic patch
        run: python .github/scripts/apply_live_tick_readiness_diagnostics.py
      - name: Focused readiness diagnostic tests
        run: python -m pytest -q tests/core/test_live_tick_readiness_diagnostics.py
      - name: Commit fix and remove one-shot helpers
        run: |
          rm .github/scripts/apply_live_tick_readiness_diagnostics.py
          rm .github/workflows/apply-live-tick-readiness-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/nifty_scalper_bot/core/app.py tests/core/test_live_tick_readiness_diagnostics.py .github/scripts/apply_live_tick_readiness_diagnostics.py .github/workflows/apply-live-tick-readiness-diagnostics.yml
          git commit -m "fix: clarify live-tick readiness diagnostics"
          git push origin HEAD:${{ github.head_ref }}
