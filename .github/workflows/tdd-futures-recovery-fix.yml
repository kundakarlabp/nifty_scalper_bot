name: TDD Futures Recovery Fix

on:
  push:
    branches:
      - fix/futures-live-tick-recovery-deadlock

permissions:
  contents: write

jobs:
  tdd-futures-recovery:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q

      - name: Prove regression is red before source change
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/streaming/test_futures_live_tick_recovery_deadlock.py
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected the new regression to fail against unmodified main.'
            exit 1
          fi
          echo "Red phase reproduced as expected (pytest exit $status)."

      - name: Apply focused existing-code correction
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('src/nifty_scalper_bot/core/polling_failover_runtime.py')
          text = runtime.read_text()
          old = '''    feed_health = _safe_feed_health(mdm)\n    data_age_ms = _safe_data_age_ms(mdm)\n    lagging = bool(\n'''
          new = '''    feed_health = _safe_feed_health(mdm)\n    data_age_ms = _safe_data_age_ms(mdm)\n    # Canonical live readiness is stricter than transport-arrival health.  If it\n    # is fail-closed on a stale futures market event, reuse the existing required-\n    # symbol recovery authority instead of allowing recent WS packet arrivals to\n    # suppress REST recovery.\n    live_block_reason = str(getattr(ctx, "live_block_reason", "") or "")\n    if "futures_live_tick_stale" in live_block_reason:\n        feed_health = dict(feed_health)\n        feed_health["required_symbol_recovery_active"] = True\n    lagging = bool(\n'''
          if text.count(old) != 1:
              raise SystemExit('polling_failover_runtime patch anchor mismatch')
          runtime.write_text(text.replace(old, new, 1))

          poller = Path('src/nifty_scalper_bot/streaming/polling_streamer.py')
          text = poller.read_text()
          old = '''                        # Only poll if WS is not fresh (local arrival time)\n                        if not (self._data_hub and self._data_hub.is_ws_fresh(symbol)):\n                            candidates.append((token, last_arr))\n'''
          new = '''                        # Standby stays WS-sparse.  Once the supervisor explicitly\n                        # activates polling recovery, do not let recent packet arrival\n                        # cancel the REST repair of stale market-event data.\n                        if (\n                            not self._websocket_mode_enabled\n                            or not (\n                                self._data_hub\n                                and self._data_hub.is_ws_fresh(symbol)\n                            )\n                        ):\n                            candidates.append((token, last_arr))\n'''
          if text.count(old) != 1:
              raise SystemExit('polling_streamer patch anchor mismatch')
          poller.write_text(text.replace(old, new, 1))
          PY

      - name: Green focused regression and adjacent contracts
        run: |
          python -m pytest -q \
            tests/streaming/test_futures_live_tick_recovery_deadlock.py \
            tests/streaming/test_stream_supervisor_fallback.py \
            tests/core/test_polling_failover_runtime_installation.py
          python -m compileall -q src tests
          git diff --check

      - name: Commit focused source correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/nifty_scalper_bot/core/polling_failover_runtime.py \
            src/nifty_scalper_bot/streaming/polling_streamer.py
          git commit -m 'fix: recover stale futures market data under live ws'
          git push origin HEAD:fix/futures-live-tick-recovery-deadlock
