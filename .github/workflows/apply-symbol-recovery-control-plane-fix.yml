name: Apply native symbol recovery control-plane fix

on:
  push:
    branches:
      - fix/symbol-recovery-control-plane-20260717

permissions:
  contents: write

jobs:
  apply-fix:
    if: "!contains(github.event.head_commit.message, '[native-symbol-recovery-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/symbol-recovery-control-plane-20260717
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply deterministic native edits
        run: python scripts/apply_symbol_recovery_control_plane_fix.py
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run focused control-plane regressions
        run: >-
          python -m pytest -q
          tests/data/test_mdm_tick_coalescing.py
          tests/core/test_polling_failover_runtime_installation.py
          tests/core/test_runtime_install_proof.py
      - name: Remove one-shot migration assets
        run: |
          rm scripts/apply_symbol_recovery_control_plane_fix.py
          rm .github/workflows/apply-symbol-recovery-control-plane-fix.yml
      - name: Commit native source and tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix symbol recovery and transport failure classification [native-symbol-recovery-applied]'
          git push origin HEAD:fix/symbol-recovery-control-plane-20260717
