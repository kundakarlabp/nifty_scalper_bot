name: Minimum Lot Affordability Final

on:
  push:
    branches:
      - fix/minimum-lot-affordability-readiness-20260806

permissions:
  contents: write

concurrency:
  group: minimum-lot-affordability-final
  cancel-in-progress: false

jobs:
  implement-validate-commit:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/minimum-lot-affordability-readiness-20260806
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Apply production patch and corrected full-path regressions
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(
              ".github/workflows/minimum-lot-affordability-once.yml"
          ).read_text(encoding="utf-8")
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Format changed Python"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          patch_script = textwrap.dedent(workflow[start:end])
          exec(compile(patch_script, "affordability_patch.py", "exec"), {})

          test_path = Path(
              "tests/core/test_minimum_lot_affordability_readiness.py"
          )
          test_text = test_path.read_text(encoding="utf-8")
          old = '''            set_runtime_readiness=lambda **kw: calls.append(kw),\n        ),'''
          new = '''            set_runtime_readiness=lambda **kw: calls.append(kw),\n            has_datahub_subscription=lambda *args, **kwargs: True,\n        ),'''
          assert test_text.count(old) == 1, test_text.count(old)
          test_text = test_text.replace(old, new, 1)
          old = '''    assert ctx.readiness_decision.primary_blocker == "minimum_lot_unaffordable"'''
          new = '''    assert (\n        ctx.live_block_reason\n        == "execution_not_armed:minimum_lot_unaffordable"\n    )'''
          assert test_text.count(old) == 1, test_text.count(old)
          test_text = test_text.replace(old, new, 1)
          old = '''    assert ctx.readiness_decision.primary_blocker is None'''
          new = '''    assert ctx.live_block_reason is None'''
          assert test_text.count(old) == 1, test_text.count(old)
          test_text = test_text.replace(old, new, 1)
          test_path.write_text(test_text, encoding="utf-8")
          PY

      - name: Format changed Python
        run: |
          python -m black \
            src/nifty_scalper_bot/execution/affordability.py \
            src/nifty_scalper_bot/execution/readiness.py \
            src/nifty_scalper_bot/core/app.py \
            src/nifty_scalper_bot/main.py \
            tests/execution/test_minimum_lot_affordability.py \
            tests/core/test_minimum_lot_affordability_readiness.py

      - name: Focused and adjacent regressions
        run: |
          python -m pytest -q \
            tests/execution/test_minimum_lot_affordability.py \
            tests/core/test_minimum_lot_affordability_readiness.py \
            tests/core/test_readiness_semantics.py \
            tests/core/test_readiness_live_tick_proof.py \
            tests/core/test_startup_risk_balance.py \
            tests/execution/test_margin_engine.py \
            tests/execution/test_margin_freshness_zero_balance.py \
            tests/execution/test_readiness_priority.py \
            tests/execution/test_readiness_execution_safety_blockers.py \
            tests/test_main_health_readiness.py \
            tests/test_market_open_rearm_loop.py

      - name: Static quality
        run: |
          python -m compileall -q src/nifty_scalper_bot
          python -m ruff check \
            src/nifty_scalper_bot/execution/affordability.py \
            src/nifty_scalper_bot/execution/readiness.py \
            src/nifty_scalper_bot/core/app.py \
            src/nifty_scalper_bot/main.py \
            tests/execution/test_minimum_lot_affordability.py \
            tests/core/test_minimum_lot_affordability_readiness.py
          python -m black --check \
            src/nifty_scalper_bot/execution/affordability.py \
            src/nifty_scalper_bot/execution/readiness.py \
            src/nifty_scalper_bot/core/app.py \
            src/nifty_scalper_bot/main.py \
            tests/execution/test_minimum_lot_affordability.py \
            tests/core/test_minimum_lot_affordability_readiness.py

      - name: Complete repository suite
        run: python -m pytest -q

      - name: Verify intended change surface
        run: |
          python - <<'PY'
          import subprocess

          expected = {
              "src/nifty_scalper_bot/execution/affordability.py",
              "src/nifty_scalper_bot/execution/readiness.py",
              "src/nifty_scalper_bot/core/app.py",
              "src/nifty_scalper_bot/main.py",
              "tests/execution/test_minimum_lot_affordability.py",
              "tests/core/test_minimum_lot_affordability_readiness.py",
              ".github/workflows/minimum-lot-affordability-once.yml",
              ".github/workflows/minimum-lot-affordability-retry.yml",
              ".github/workflows/minimum-lot-affordability-final.yml",
          }
          lines = subprocess.check_output(
              ["git", "status", "--porcelain"], text=True
          ).splitlines()
          actual = {line[3:] for line in lines if len(line) >= 4}
          unexpected = actual - expected
          missing = expected - actual
          if unexpected or missing:
              raise SystemExit(
                  f"change surface mismatch unexpected={sorted(unexpected)} "
                  f"missing={sorted(missing)}"
              )
          PY

      - name: Commit validated correction and remove temporary workflows
        run: |
          git rm \
            .github/workflows/minimum-lot-affordability-once.yml \
            .github/workflows/minimum-lot-affordability-retry.yml \
            .github/workflows/minimum-lot-affordability-final.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/nifty_scalper_bot/execution/affordability.py \
            src/nifty_scalper_bot/execution/readiness.py \
            src/nifty_scalper_bot/core/app.py \
            src/nifty_scalper_bot/main.py \
            tests/execution/test_minimum_lot_affordability.py \
            tests/core/test_minimum_lot_affordability_readiness.py
          git commit -m 'fix(execution): gate live readiness on minimum lot affordability [skip ci]'
          git push origin HEAD:fix/minimum-lot-affordability-readiness-20260806
