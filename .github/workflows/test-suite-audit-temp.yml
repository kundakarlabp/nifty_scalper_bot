name: Temporary Test Suite Audit

on:
  push:
    branches:
      - codex/test-suite-repair-2026-07-02

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BRACKET_AUTO_RESTORE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q
      - name: Capture repository and diagnostics
        shell: bash
        run: |
          set +e
          python -m compileall -q src dashboard scripts tests > compile-output.txt 2>&1
          echo $? > compile-exit-code.txt
          python tools/repo_janitor.py > janitor-output.txt 2>&1
          python -m pytest -q \
            tests/strategies/test_vwap_mean_reversion.py \
            tests/strategies/test_elite_builder_mode.py \
            tests/execution/test_market_aware_time_stop.py \
            tests/execution/test_execution_policy.py \
            tests/execution/test_execution_safety_audit_fixes.py \
            > focused-pytest-output.txt 2>&1
          echo $? > focused-pytest-exit-code.txt
          tar -czf repository-snapshot.tar.gz src tests pyproject.toml pytest.ini
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: test-suite-audit
          path: |
            compile-output.txt
            compile-exit-code.txt
            focused-pytest-output.txt
            focused-pytest-exit-code.txt
            janitor-output.txt
            JANITOR_REPORT.json
            repository-snapshot.tar.gz
          if-no-files-found: error
