name: Temporary Test Fixture Repair

on:
  push:
    branches:
      - codex/test-suite-repair-2026-07-02

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/test-suite-repair-2026-07-02
      - name: Repair bracket restore test fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/execution/test_execution_safety_audit_fixes.py")
          text = path.read_text(encoding="utf-8")
          old = '''def test_bracket_state_is_written_and_restored_with_ledger_recovery_fields(tmp_path, monkeypatch) -> None:
              monkeypatch.setenv("DATA_DIR", str(tmp_path))
          '''
          new = '''def test_bracket_state_is_written_and_restored_with_ledger_recovery_fields(tmp_path, monkeypatch) -> None:
              monkeypatch.setenv("DATA_DIR", str(tmp_path))
              monkeypatch.setenv("BRACKET_AUTO_RESTORE", "true")
          '''
          if text.count(old) != 1:
              raise SystemExit("expected bracket restore test anchor exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/execution/test_execution_safety_audit_fixes.py
          git commit -m "test: enable restore in persistence fixture"
          git push origin HEAD:codex/test-suite-repair-2026-07-02
