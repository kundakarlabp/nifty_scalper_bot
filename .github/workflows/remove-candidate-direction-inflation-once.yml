name: Remove candidate direction inflation once

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'fix-runner-direction-evidence-20260913'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-runner-direction-evidence-20260913
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply minimal runner fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runner_path = Path('src/nifty_scalper_bot/strategies/runner.py')
          runner = runner_path.read_text(encoding='utf-8')
          old = '''                if str(candidate.side or "").upper() == option_side:\n                    metadata["direction_score"] = max(\n                        float(metadata.get("direction_score", 0.0) or 0.0), 7.5\n                    )\n'''
          marker = 'Candidate identity is not independent underlying-direction evidence.'
          replacement = '''                # Candidate identity is not independent underlying-direction evidence.\n                # Candidate selection may contribute option/data/RR quality only;\n                # direction quality must come from the strategy/context path.\n'''
          count = runner.count(old)
          if count == 1:
              runner = runner.replace(old, replacement, 1)
              runner_path.write_text(runner, encoding='utf-8')
          elif marker not in runner:
              raise AssertionError(f'candidate direction boost expected once, found {count}')

          test_path = Path('tests/strategies/test_option_score_fails_closed.py')
          test_text = test_path.read_text(encoding='utf-8')
          test_name = 'test_candidate_identity_never_inflates_underlying_direction_score'
          if test_name not in test_text:
              test_text += '''\n\ndef test_candidate_identity_never_inflates_underlying_direction_score() -> None:\n    source = _RUNNER.read_text(encoding="utf-8")\n    assert 'if str(candidate.side or "").upper() == option_side:' not in source\n    assert 'Candidate identity is not independent underlying-direction evidence.' in source\n'''
              test_path.write_text(test_text, encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          python -m pip install -e '.[dev]' -q
          python -m compileall -q src/nifty_scalper_bot/strategies
          python -m pytest -q \
            tests/strategies/test_option_score_fails_closed.py \
            tests/strategies/test_runner_cooldowns.py
          git diff --check
      - name: Publish source change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nifty_scalper_bot/strategies/runner.py tests/strategies/test_option_score_fails_closed.py
          if git diff --cached --quiet; then
            echo 'No source change required.'
            exit 0
          fi
          git commit -m 'Fix: keep candidate identity out of direction score'
          git push origin HEAD:fix-runner-direction-evidence-20260913
