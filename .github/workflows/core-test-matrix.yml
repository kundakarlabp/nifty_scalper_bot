name: Core Test Matrix

on:
  pull_request:
    paths:
      - "tests/core/**"
      - "src/nifty_scalper_bot/core/**"
      - "Dockerfile"
      - "railway.toml"
      - ".github/workflows/core-test-matrix.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - id: files
        run: echo "files=$(find tests/core -maxdepth 1 -name 'test_*.py' -printf '%p\n' | sort | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.discover.outputs.files) }}
    name: ${{ matrix.file }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
      - name: Run core test file
        run: python -m pytest -q --tb=short "${{ matrix.file }}"
