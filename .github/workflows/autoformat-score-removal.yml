name: Autoformat score-removal branch

on:
  push:
    branches:
      - fix/structural-entry-contract-no-scoring

permissions:
  contents: write

jobs:
  black:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/structural-entry-contract-no-scoring
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install formatter from project dev dependencies
        run: python -m pip install -e '.[dev]' -q
      - name: Format all Python changed from main
        shell: bash
        run: |
          git fetch --no-tags origin main --depth=50
          mapfile -t files < <(git diff --diff-filter=ACMR --name-only origin/main...HEAD -- '*.py' \
            | grep -E '^(src|dashboard|scripts|tests)/' || true)
          if ((${#files[@]})); then
            python -m black "${files[@]}"
          fi
      - name: Commit formatter output when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already Black-clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.py'
          git commit -m "style: Black-format score-removal changes"
          git push origin HEAD:fix/structural-entry-contract-no-scoring
