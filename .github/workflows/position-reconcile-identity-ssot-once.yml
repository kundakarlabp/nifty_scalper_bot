name: Position reconcile identity SSOT migration

on:
  push:
    branches:
      - codex/native-position-reconcile-identity-ssot

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BRACKET_AUTO_RESTORE: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/native-position-reconcile-identity-ssot
          fetch-depth: 50

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply exact-match SSOT migration
        run: python scripts/migrate_position_reconcile_identity_ssot.py

      - name: Preserve existing Position ownership diagnostic
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/nifty_scalper_bot/execution/position_identity_extension.py")
          text = path.read_text(encoding="utf-8")
          if "def _install_position_ownership_property()" in text:
              raise SystemExit("ownership property unexpectedly retained by migration")
          marker = "\n\ndef _restore_persistent_state_methods(cls: Any) -> None:\n"
          if text.count(marker) != 1:
              raise SystemExit("persistent-state anchor changed")
          ownership = '''

          def _install_position_ownership_property() -> None:
              """Expose durable bot ownership to existing orphan/capital diagnostics."""

              position_cls = getattr(_position_manager, "Position", None)
              if position_cls is None or hasattr(position_cls, "strategy_name"):
                  return

              def strategy_name(position: Any) -> str:
                  return "BotManaged" if str(getattr(position, "order_id", "") or "").strip() else ""

              position_cls.strategy_name = property(strategy_name)
          '''
          text = text.replace(marker, ownership + marker, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q

      - name: Format new files and validate touched production code
        run: |
          python -m black \
            src/nifty_scalper_bot/execution/position_reconciliation_identity.py \
            tests/execution/test_position_reconciliation_identity_ssot.py
          python -m ruff check --select F821,F811 \
            src/nifty_scalper_bot/execution/position_manager.py \
            src/nifty_scalper_bot/execution/position_identity_extension.py \
            src/nifty_scalper_bot/execution/position_reconciliation_identity.py \
            tests/execution/test_position_reconciliation_identity_ssot.py
          python -m compileall -q src
          git diff --check

      - name: Focused reconciliation safety regressions
        run: |
          python -m pytest -q \
            tests/execution/test_position_reconciliation_identity_ssot.py \
            tests/execution/test_reconciliation_ownership_guards.py \
            tests/execution/test_broker_exposure_quarantine.py \
            tests/execution/test_manual_order_quarantine.py \
            tests/execution/test_execution_safety_audit_fixes.py

      - name: Remove one-time migration tooling
        run: |
          rm scripts/migrate_position_reconcile_identity_ssot.py
          rm .github/workflows/position-reconcile-identity-ssot-once.yml
          git diff --check

      - name: Commit validated source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Canonicalize PositionManager identity reconciliation"
          git push origin HEAD:codex/native-position-reconcile-identity-ssot
