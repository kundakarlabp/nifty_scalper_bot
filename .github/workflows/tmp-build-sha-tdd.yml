name: Temporary Build SHA TDD

on:
  pull_request:
    branches: [main]
    paths:
      - 'deploy/lightsail_release.sh'
      - 'tests/architecture/test_lightsail_release_contract.py'
      - '.github/workflows/tmp-build-sha-tdd.yml'

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest -q
      - run: python -m pytest -q tests/architecture/test_lightsail_release_contract.py
