name: P0 P1 Runtime Hardening Clean V3

on:
  push:
    branches:
      - fix/p0-p1-runtime-hardening-final-20260806

permissions:
  contents: write

jobs:
  apply-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      BRACKET_AUTO_RESTORE: "false"
      NSB_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-p1-runtime-hardening-final-20260806
          fetch-depth: 100
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q
      - name: Reconstruct and compile correction units
        run: |
          cat scripts/p0p1_chunks/worker.part.* | base64 -d > /tmp/apply_worker.py
          cat scripts/p0p1_chunks/watchdog.raw.* > /tmp/apply_watchdog.py
          cat scripts/p0p1_chunks/app_main.part.* | base64 -d > /tmp/apply_app_main.py
          cat scripts/p0p1_chunks/tests.part.* | base64 -d > /tmp/apply_tests.py
          echo 'ca9ac8d76e2caf6a0aa42fdf28d255fd26da137f5e6c6bb402d171fc5c299f58  /tmp/apply_worker.py' | sha256sum -c -
          echo 'c49d3238888eb7a532b48ebad2f7bd34452ef29254d36dd4335dd04fd7e1dc23  /tmp/apply_app_main.py' | sha256sum -c -
          echo 'e35286ba58dae12743e9acb4162fe7f17d845b7f5ad96cf267488936461b0404  /tmp/apply_tests.py' | sha256sum -c -
          python -m py_compile \
            /tmp/apply_worker.py \
            scripts/apply_reconcile.py \
            scripts/fix_worker_stop_wakeup_final.py \
            scripts/fix_reconcile_wrappers_final.py \
            scripts/fix_watchdog_generated_final.py \
            scripts/fix_position_mypy_final.py \
            /tmp/apply_watchdog.py \
            /tmp/apply_app_main.py \
            /tmp/apply_tests.py
      - name: Apply P0 and P1 corrections
        run: |
          python /tmp/apply_worker.py
          python scripts/fix_worker_stop_wakeup_final.py
          python scripts/apply_reconcile.py
          python scripts/fix_reconcile_wrappers_final.py
          python /tmp/apply_watchdog.py
          python scripts/fix_watchdog_generated_final.py
          python /tmp/apply_app_main.py
          python /tmp/apply_tests.py
          python scripts/fix_position_mypy_final.py
      - name: Format corrected files
        run: |
          python -m black \
            src/nifty_scalper_bot/data/market_data_hardening.py \
            src/nifty_scalper_bot/execution/position_manager.py \
            src/nifty_scalper_bot/execution/position_identity_extension.py \
            src/nifty_scalper_bot/execution/broker_exposure_quarantine_extension.py \
            src/nifty_scalper_bot/infra/watchdog.py \
            src/nifty_scalper_bot/core/app.py \
            src/nifty_scalper_bot/main.py \
            tests/data/test_fallback_tick_worker_lifecycle.py \
            tests/execution/test_position_reconcile_singleflight.py \
            tests/infra/test_market_data_supervisor.py \
            tests/core/test_minimum_lot_affordability_readiness.py
      - name: Focused and adjacent regressions
        run: |
          python -m pytest -q \
            tests/data/test_fallback_tick_worker_lifecycle.py \
            tests/data/test_mdm_tick_coalescing.py \
            tests/data/test_event_loop_thread_telemetry.py \
            tests/execution/test_position_reconcile_singleflight.py \
            tests/execution/test_canonical_execution_recovery.py \
            tests/execution/test_broker_exposure_quarantine.py \
            tests/execution/test_manual_order_quarantine.py \
            tests/infra/test_market_data_supervisor.py \
            tests/core/test_minimum_lot_affordability_readiness.py \
            tests/core/test_runtime_readiness.py \
            tests/e2e/live_sim/test_live_runtime_startup_contract.py
      - name: Compile and quality gates
        run: |
          python -m compileall -q src dashboard scripts
          python -m ruff check \
            src/nifty_scalper_bot/data/market_data_hardening.py \
            src/nifty_scalper_bot/execution/position_manager.py \
            src/nifty_scalper_bot/execution/position_identity_extension.py \
            src/nifty_scalper_bot/execution/broker_exposure_quarantine_extension.py \
            src/nifty_scalper_bot/infra/watchdog.py \
            src/nifty_scalper_bot/core/app.py \
            src/nifty_scalper_bot/main.py \
            tests/data/test_fallback_tick_worker_lifecycle.py \
            tests/execution/test_position_reconcile_singleflight.py \
            tests/infra/test_market_data_supervisor.py \
            tests/core/test_minimum_lot_affordability_readiness.py
          python -m black --check \
            src/nifty_scalper_bot/data/market_data_hardening.py \
            src/nifty_scalper_bot/execution/position_manager.py \
            src/nifty_scalper_bot/execution/position_identity_extension.py \
            src/nifty_scalper_bot/execution/broker_exposure_quarantine_extension.py \
            src/nifty_scalper_bot/infra/watchdog.py \
            src/nifty_scalper_bot/core/app.py \
            src/nifty_scalper_bot/main.py \
            tests/data/test_fallback_tick_worker_lifecycle.py \
            tests/execution/test_position_reconcile_singleflight.py \
            tests/infra/test_market_data_supervisor.py \
            tests/core/test_minimum_lot_affordability_readiness.py
          python -m mypy src/nifty_scalper_bot
      - name: Complete repository suite
        run: python -m pytest -q
      - name: Remove all temporary P0/P1 machinery
        run: |
          git checkout -- positions.json 2>/dev/null || true
          rm -rf .pytest_cache .pytest-data-dir diagnostics
          rm -f \
            .github/workflows/p0-p1-format-diagnostic.yml \
            .github/workflows/p0-p1-runtime-hardening-once.yml \
            .github/workflows/p0-p1-runtime-hardening-v2.yml \
            .github/workflows/p0-p1-worker-source-capture.yml \
            .github/workflows/p0-p1-runtime-hardening-final.yml \
            .github/workflows/p0-p1-runtime-hardening-clean.yml \
            .github/workflows/p0-p1-runtime-hardening-clean-v2.yml \
            .github/workflows/p0-p1-runtime-hardening-clean-v3.yml \
            scripts/apply_reconcile.py \
            scripts/fix_worker_stop_wakeup.py \
            scripts/fix_worker_stop_wakeup_v2.py \
            scripts/fix_worker_stop_wakeup_final.py \
            scripts/fix_reconcile_wrappers_final.py \
            scripts/fix_watchdog_generated_final.py \
            scripts/fix_position_mypy_final.py
          rm -rf scripts/p0p1_chunks
      - name: Verify final diff and cleanup scope
        run: |
          git status --short
          python - <<'PY'
          import subprocess

          production = {
              'src/nifty_scalper_bot/data/market_data_hardening.py',
              'src/nifty_scalper_bot/execution/position_manager.py',
              'src/nifty_scalper_bot/execution/position_identity_extension.py',
              'src/nifty_scalper_bot/execution/broker_exposure_quarantine_extension.py',
              'src/nifty_scalper_bot/infra/watchdog.py',
              'src/nifty_scalper_bot/core/app.py',
              'src/nifty_scalper_bot/main.py',
              'tests/data/test_fallback_tick_worker_lifecycle.py',
              'tests/execution/test_position_reconcile_singleflight.py',
              'tests/infra/test_market_data_supervisor.py',
              'tests/core/test_minimum_lot_affordability_readiness.py',
          }
          temporary = {
              '.github/workflows/p0-p1-format-diagnostic.yml',
              '.github/workflows/p0-p1-runtime-hardening-once.yml',
              '.github/workflows/p0-p1-runtime-hardening-v2.yml',
              '.github/workflows/p0-p1-worker-source-capture.yml',
              '.github/workflows/p0-p1-runtime-hardening-final.yml',
              '.github/workflows/p0-p1-runtime-hardening-clean.yml',
              '.github/workflows/p0-p1-runtime-hardening-clean-v2.yml',
              '.github/workflows/p0-p1-runtime-hardening-clean-v3.yml',
              'scripts/apply_reconcile.py',
              'scripts/fix_worker_stop_wakeup.py',
              'scripts/fix_worker_stop_wakeup_v2.py',
              'scripts/fix_worker_stop_wakeup_final.py',
              'scripts/fix_reconcile_wrappers_final.py',
              'scripts/fix_watchdog_generated_final.py',
              'scripts/fix_position_mypy_final.py',
          }
          lines = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          changed = {line[3:] for line in lines if len(line) > 3}
          unexpected = sorted(
              path
              for path in changed
              if path not in production
              and path not in temporary
              and not path.startswith('scripts/p0p1_chunks/')
          )
          if unexpected:
              raise SystemExit(f'unexpected files: {unexpected}')
          missing = sorted(production - changed)
          if missing:
              raise SystemExit(f'missing intended production changes: {missing}')
          print('validated changed files:', sorted(changed))
          PY
      - name: Commit validated production correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(runtime): apply P0/P1 hardening and remove temporary tooling [skip ci]'
          git push origin HEAD:fix/p0-p1-runtime-hardening-final-20260806
