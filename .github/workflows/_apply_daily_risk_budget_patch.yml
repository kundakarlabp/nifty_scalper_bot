name: Apply daily risk budget sizing hardening

on:
  push:
    branches:
      - fix/daily-risk-budget-sizing-20260831

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/daily-risk-budget-sizing-20260831
          fetch-depth: 0

      - name: Apply focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          # 1) Canonical pre-broker entry sizing: apply remaining day-loss budget
          #    by converting the absolute remaining rupee budget into the exact
          #    effective risk percentage consumed by MarginEngine.
          core_path = Path("src/nifty_scalper_bot/execution/order_manager_core.py")
          core = core_path.read_text(encoding="utf-8")
          fn_start = core.index("    def _plan_entry_margin(\n")
          fn_end = core.index("\n    def ", fn_start + 10)
          fn = core[fn_start:fn_end]
          anchor = '''        per_trade_risk_pct = _f("per_trade_risk_pct", 0.5)\n        per_trade_cap_pct = _f("per_trade_cap_pct", per_trade_risk_pct)\n'''
          insertion = '''        per_trade_risk_pct = _f("per_trade_risk_pct", 0.5)\n        per_trade_cap_pct = _f("per_trade_cap_pct", per_trade_risk_pct)\n\n        # The final RiskManager already rejects an entry whose stop-risk exceeds\n        # the remaining daily-loss budget. Feed that same absolute capacity into\n        # the canonical MarginEngine *before* broker submission so an impossible\n        # one-lot setup is rejected at sizing rather than several layers later.\n        # No limit is relaxed: this can only tighten the configured per-trade risk.\n        configured_per_trade_risk_pct = per_trade_risk_pct\n        remaining_daily_risk_budget = None\n        switches = getattr(getattr(self, "_risk_manager", None), "_switches", None)\n        if switches is not None:\n            try:\n                max_day_loss = max(\n                    float(getattr(switches, "max_day_loss", 0.0) or 0.0), 0.0\n                )\n                if max_day_loss > 0.0:\n                    day_loss_reader = getattr(switches, "day_loss", None)\n                    if callable(day_loss_reader):\n                        current_day_loss = max(float(day_loss_reader() or 0.0), 0.0)\n                        remaining_daily_risk_budget = max(\n                            max_day_loss - current_day_loss, 0.0\n                        )\n                    else:\n                        # A configured daily cap with unreadable consumption is\n                        # an indeterminate safety state: fail closed at sizing.\n                        remaining_daily_risk_budget = 0.0\n            except Exception:\n                # Preserve fail-closed semantics when the daily risk circuit exists\n                # but cannot provide a trustworthy remaining budget.\n                remaining_daily_risk_budget = 0.0\n\n        if remaining_daily_risk_budget is not None:\n            if available_balance > 0.0:\n                daily_budget_risk_pct = (\n                    remaining_daily_risk_budget / float(available_balance) * 100.0\n                )\n                per_trade_risk_pct = min(\n                    per_trade_risk_pct, max(daily_budget_risk_pct, 0.0)\n                )\n            else:\n                per_trade_risk_pct = 0.0\n            self._logger.info(\n                "ENTRY_RISK_BUDGET_APPLIED symbol=%s configured_risk_pct=%.4f "\n                "effective_risk_pct=%.4f remaining_daily_risk_budget=%.2f "\n                "available_balance=%.2f",\n                plan.symbol,\n                configured_per_trade_risk_pct,\n                per_trade_risk_pct,\n                remaining_daily_risk_budget,\n                available_balance,\n                extra={\n                    "event": "ENTRY_RISK_BUDGET_APPLIED",\n                    "symbol": plan.symbol,\n                    "configured_per_trade_risk_pct": configured_per_trade_risk_pct,\n                    "effective_per_trade_risk_pct": per_trade_risk_pct,\n                    "remaining_daily_risk_budget": remaining_daily_risk_budget,\n                    "available_balance": available_balance,\n                    "trace_id": plan.trace_id,\n                },\n            )\n'''
          fn = replace_once(fn, anchor, insertion, "order_manager_core risk anchor")
          core = core[:fn_start] + fn + core[fn_end:]
          core_path.write_text(core, encoding="utf-8")

          # 2) Existing health/readiness affordability payload: report risk capacity
          #    separately from cash affordability. Do NOT turn this into a global
          #    readiness blocker because actual stop geometry exists only per signal.
          aff_path = Path("src/nifty_scalper_bot/execution/affordability.py")
          aff = aff_path.read_text(encoding="utf-8")
          dataclass_anchor = '''    margin_factor: float\n    margin_buffer: float\n    balance_source: str\n\n    def to_dict(self) -> dict[str, object]:\n'''
          dataclass_new = '''    margin_factor: float\n    margin_buffer: float\n    balance_source: str\n    per_trade_risk_budget: float | None = None\n    remaining_daily_risk_budget: float | None = None\n    effective_one_lot_risk_budget: float | None = None\n    max_stop_distance_one_lot: float | None = None\n\n    def to_dict(self) -> dict[str, object]:\n'''
          aff = replace_once(aff, dataclass_anchor, dataclass_new, "affordability dataclass")

          eval_marker = '''\ndef evaluate_minimum_lot_affordability(\n'''
          helper = '''\ndef _risk_budget_snapshot(\n    order_manager: Any | None, lot_size: int\n) -> tuple[float | None, float | None, float | None, float | None]:\n    """Return per-trade/day/effective risk budgets and one-lot stop distance.\n\n    This is observability only. The authoritative per-signal decision remains the\n    MarginEngine followed by RiskManager.check_order().\n    """\n    manager = getattr(order_manager, "_risk_manager", None)\n    if manager is None or lot_size <= 0:\n        return None, None, None, None\n\n    balance = _finite_float(getattr(manager, "account_balance", None), minimum=0.0)\n    settings = getattr(manager, "settings", None)\n    risk_pct = _finite_float(\n        getattr(settings, "per_trade_risk_pct", None), minimum=0.0\n    )\n    per_trade = (\n        balance * risk_pct / 100.0\n        if balance is not None and balance > 0.0 and risk_pct is not None\n        else None\n    )\n\n    remaining = None\n    switches = getattr(manager, "_switches", None)\n    if switches is not None:\n        max_day_loss = _finite_float(\n            getattr(switches, "max_day_loss", None), minimum=0.0\n        )\n        if max_day_loss is not None and max_day_loss > 0.0:\n            reader = getattr(switches, "day_loss", None)\n            if callable(reader):\n                try:\n                    current = max(float(reader() or 0.0), 0.0)\n                    remaining = max(max_day_loss - current, 0.0)\n                except Exception:\n                    remaining = 0.0\n            else:\n                remaining = 0.0\n\n    budgets = [value for value in (per_trade, remaining) if value is not None]\n    effective = min(budgets) if budgets else None\n    max_stop_distance = (\n        effective / float(lot_size)\n        if effective is not None and lot_size > 0\n        else None\n    )\n    return per_trade, remaining, effective, max_stop_distance\n\n'''
          aff = replace_once(aff, eval_marker, helper + eval_marker, "affordability helper marker")

          final_anchor = '''    required = ask * lot_size * margin_factor\n    executable_capacity = available * margin_buffer\n    affordable = bool(required > 0 and executable_capacity >= required)\n    return MinimumLotAffordability(\n        normalized_symbol,\n        affordable,\n        True,\n        "affordable" if affordable else "minimum_lot_unaffordable",\n        available,\n        required,\n        executable_capacity,\n        ask,\n        lot_size,\n        margin_factor,\n        margin_buffer,\n        balance_source,\n    )\n'''
          final_new = '''    required = ask * lot_size * margin_factor\n    executable_capacity = available * margin_buffer\n    affordable = bool(required > 0 and executable_capacity >= required)\n    (\n        per_trade_risk_budget,\n        remaining_daily_risk_budget,\n        effective_one_lot_risk_budget,\n        max_stop_distance_one_lot,\n    ) = _risk_budget_snapshot(order_manager, lot_size)\n    return MinimumLotAffordability(\n        normalized_symbol,\n        affordable,\n        True,\n        "affordable" if affordable else "minimum_lot_unaffordable",\n        available,\n        required,\n        executable_capacity,\n        ask,\n        lot_size,\n        margin_factor,\n        margin_buffer,\n        balance_source,\n        per_trade_risk_budget=per_trade_risk_budget,\n        remaining_daily_risk_budget=remaining_daily_risk_budget,\n        effective_one_lot_risk_budget=effective_one_lot_risk_budget,\n        max_stop_distance_one_lot=max_stop_distance_one_lot,\n    )\n'''
          aff = replace_once(aff, final_anchor, final_new, "affordability final return")
          aff_path.write_text(aff, encoding="utf-8")

          # 3) Focused regression reproducing the exact production numbers.
          test_path = Path("tests/execution/test_entry_daily_risk_budget.py")
          test_path.write_text('''from types import SimpleNamespace\n\nimport pytest\n\nfrom nifty_scalper_bot.execution.affordability import evaluate_minimum_lot_affordability\nfrom nifty_scalper_bot.execution.margin_engine import MarginEngine\nfrom nifty_scalper_bot.execution.order_manager_core import OrderManager, TradePlan\n\n\nclass _Switches:\n    def __init__(self, max_day_loss: float, day_loss: float = 0.0) -> None:\n        self.max_day_loss = max_day_loss\n        self._day_loss = day_loss\n\n    def day_loss(self) -> float:\n        return self._day_loss\n\n\ndef _order_manager(*, max_day_loss: float = 319.09, day_loss: float = 0.0):\n    manager = OrderManager.__new__(OrderManager)\n    manager._risk_manager = SimpleNamespace(\n        account_balance=15_954.60,\n        settings=SimpleNamespace(\n            per_trade_risk_pct=5.0,\n            per_trade_cap_pct=100.0,\n            min_lots_per_trade=1,\n            max_lots_per_trade=1,\n            atr_stop_multiple=1.0,\n        ),\n        _switches=_Switches(max_day_loss, day_loss),\n    )\n    manager._margin_engine = MarginEngine(\n        broker=object(), data_hub=None, lot_size_resolver=None, clock=lambda: 0.0\n    )\n    manager._margin_factor = 1.0\n    manager._margin_buffer = 1.0\n    manager._logger = SimpleNamespace(\n        info=lambda *args, **kwargs: None,\n        warning=lambda *args, **kwargs: None,\n        error=lambda *args, **kwargs: None,\n    )\n    manager.resolve_lot_size = lambda _symbol: 65\n    return manager\n\n\ndef _plan(entry: float, stop: float) -> TradePlan:\n    return TradePlan(\n        symbol="NFO:NIFTY2690124050PE",\n        side="BUY",\n        quantity=65,\n        entry_price=entry,\n        stop_loss=stop,\n        take_profit=entry + 2.0 * (entry - stop),\n        product="NRML",\n        requested_lots=1,\n        resolved_lot_size=65,\n        trace_id="daily-risk-regression",\n    )\n\n\ndef test_entry_sizing_rejects_production_one_lot_risk_above_remaining_day_budget():\n    manager = _order_manager(max_day_loss=319.09)\n    plan = _plan(64.65, 59.70)  # 4.95 * 65 = 321.75\n\n    decision = OrderManager._plan_entry_margin(\n        manager,\n        plan=plan,\n        price=64.65,\n        lot_size=65,\n        available_balance=15_954.60,\n    )\n\n    assert not decision.ok\n    assert decision.quantity == 0\n    assert decision.reason == "MARGIN no_qty_after_risk"\n\n\ndef test_entry_sizing_accepts_one_lot_when_stop_risk_fits_remaining_day_budget():\n    manager = _order_manager(max_day_loss=319.09)\n    plan = _plan(65.30, 60.60)  # 4.70 * 65 = 305.50\n\n    decision = OrderManager._plan_entry_margin(\n        manager,\n        plan=plan,\n        price=65.30,\n        lot_size=65,\n        available_balance=15_954.60,\n    )\n\n    assert decision.ok\n    assert decision.quantity == 65\n\n\ndef test_entry_sizing_accounts_for_already_consumed_day_loss_capacity():\n    manager = _order_manager(max_day_loss=319.09, day_loss=100.0)\n    plan = _plan(65.30, 60.60)  # 305.50 > 219.09 remaining\n\n    decision = OrderManager._plan_entry_margin(\n        manager,\n        plan=plan,\n        price=65.30,\n        lot_size=65,\n        available_balance=15_954.60,\n    )\n\n    assert not decision.ok\n    assert decision.quantity == 0\n\n\ndef test_no_configured_daily_cap_preserves_existing_per_trade_risk_policy():\n    manager = _order_manager(max_day_loss=0.0)\n    plan = _plan(64.65, 59.70)\n\n    decision = OrderManager._plan_entry_margin(\n        manager,\n        plan=plan,\n        price=64.65,\n        lot_size=65,\n        available_balance=15_954.60,\n    )\n\n    assert decision.ok\n    assert decision.quantity == 65\n\n\ndef test_affordability_telemetry_exposes_risk_capacity_without_changing_cash_readiness():\n    manager = _order_manager(max_day_loss=319.09)\n    manager._margin_factor = 1.1\n    manager._margin_buffer = 0.9\n\n    decision = evaluate_minimum_lot_affordability(\n        symbol="NFO:NIFTY2690124050PE",\n        quote={"ask": 65.30},\n        order_manager=manager,\n        fallback_balance=15_954.60,\n    )\n\n    assert decision.affordable is True\n    assert decision.remaining_daily_risk_budget == pytest.approx(319.09)\n    assert decision.per_trade_risk_budget == pytest.approx(797.73)\n    assert decision.effective_one_lot_risk_budget == pytest.approx(319.09)\n    assert decision.max_stop_distance_one_lot == pytest.approx(319.09 / 65.0)\n''', encoding="utf-8")
          PY

      - name: Compile changed Python files
        run: |
          python -m py_compile \
            src/nifty_scalper_bot/execution/order_manager_core.py \
            src/nifty_scalper_bot/execution/affordability.py \
            tests/execution/test_entry_daily_risk_budget.py

      - name: Commit patch and remove bootstrap workflow
        shell: bash
        run: |
          rm .github/workflows/_apply_daily_risk_budget_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(risk): size entries against remaining daily loss budget"
          git push origin HEAD:fix/daily-risk-budget-sizing-20260831
