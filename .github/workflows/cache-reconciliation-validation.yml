name: Cache Reconciliation Validation

on:
  push:
    branches:
      - fix/cache-reconciliation-20260626

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q
      - name: Compile source
        run: python -m compileall -q src dashboard
      - name: Focused quote reconciliation tests
        run: |
          python -m pytest -q \
            tests/core/test_selected_option_quote_source_reconciliation.py \
            tests/core/test_hydration_status_propagation.py \
            tests/core/test_live_readiness_recompute.py \
            tests/core/test_readiness_semantics.py \
            tests/core/test_readiness_live_tick_proof.py
      - name: Full test suite
        run: python -m pytest -q
