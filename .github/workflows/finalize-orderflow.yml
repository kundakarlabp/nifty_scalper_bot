name: Finalize OrderFlow hardening

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/end-to-end-runtime-hardening-20260625
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install streamlit -q
      - name: Apply final refinement
        run: python scripts/finalize_orderflow.py
      - name: Validate
        run: |
          python -m compileall -q src dashboard
          bash -n deploy/lightsail_setup.sh
          python -m pytest -q tests/execution/test_quote_readiness.py tests/strategies/test_order_flow_conflict_override.py tests/architecture/test_canonical_bo_ownership.py tests/dashboard/test_event_buffer_truth.py tests/integration/test_canonical_bo_end_to_end.py
          python -m pytest -q
      - name: Commit implementation
        run: |
          git config user.name 'Bhanu Bot'
          git config user.email 'bot@nifty-scalper'
          git add src/nifty_scalper_bot/strategies/elite_strategies/order_flow.py
          git commit -m 'fix: finalize bounded OrderFlow reversal confirmation'
          git push origin HEAD:fix/end-to-end-runtime-hardening-20260625
