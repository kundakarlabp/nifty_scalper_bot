name: One-shot PR definition-site premium geometry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/definition-site-premium-geometry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/definition-site-premium-geometry
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Narrow migration replacement to materialisation boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/one_shot_definition_site_migration.py")
          text = path.read_text(encoding="utf-8")
          old = '''materialise_line = (
              "                signal = dataclasses.replace(signal, metadata=dict(metadata))\\n"
          )
          materialise_call = ''' + "'''" + '''                signal = apply_premium_risk_contract(
                              dataclasses.replace(signal, metadata=dict(metadata)),
                              float(trade_price or 0.0),
                          )
          ''' + "'''" + '''
          '''
          new = '''materialise_line = ''' + "'''" + '''            try:
                          signal = dataclasses.replace(signal, metadata=dict(metadata))
                          signal = self._materialize_option_trade_plan(
          ''' + "'''" + '''
          materialise_call = ''' + "'''" + '''            try:
                          signal = apply_premium_risk_contract(
                              dataclasses.replace(signal, metadata=dict(metadata)),
                              float(trade_price or 0.0),
                          )
                          signal = self._materialize_option_trade_plan(
          ''' + "'''" + '''
          '''
          if text.count(old) != 1:
              raise RuntimeError(
                  f"migration materialisation patch expected once, found {text.count(old)}"
              )
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Execute guarded migration
        run: python tools/one_shot_definition_site_migration.py

      - name: Validate and commit canonical diff
        shell: bash
        run: |
          python -m compileall -q src tests
          git diff --check
          git rm -f --ignore-unmatch \
            .github/workflows/one-shot-definition-site-premium-geometry.yml \
            .github/workflows/one-shot-pr-definition-site-premium-geometry.yml \
            .github/one-shot-definition-site-trigger \
            tools/one_shot_definition_site_migration.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(execution): own premium geometry at definition sites"
          git push origin HEAD:fix/definition-site-premium-geometry
