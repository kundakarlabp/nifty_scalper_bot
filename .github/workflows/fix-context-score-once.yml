name: Fix context score regime weighting once

on:
  push:
    branches:
      - fix/context-score-regime-weight-20260805

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/context-score-regime-weight-20260805
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q
      - name: Apply correction and regressions
        run: python .github/scripts/apply_context_score_fix.py
      - name: Focused single-trigger score tests
        run: python -m pytest -q tests/strategies/test_single_vote_score_floor.py
      - name: Adjacent strategy manager tests
        run: |
          python -m pytest -q \
            tests/strategies/test_single_vote_score_floor.py \
            tests/core/test_strategy_live_safety.py \
            tests/strategies/test_vwap_pro_none_futures_context.py \
            tests/core/test_strategy_manager_context_age.py
      - name: Quality checks
        run: |
          python -m black tests/strategies/test_single_vote_score_floor.py
          python -m compileall -q src tests
          python -m ruff check --select E9,F63,F7,F82 src/nifty_scalper_bot/core/strategy_manager.py
          python -m ruff check tests/strategies/test_single_vote_score_floor.py
          python -m black --check tests/strategies/test_single_vote_score_floor.py
          git diff --check
      - name: Full suite
        env:
          BRACKET_AUTO_RESTORE: 'false'
        run: python -m pytest -q
      - name: Commit validated correction
        run: |
          rm .github/workflows/fix-context-score-once.yml
          rm .github/scripts/apply_context_score_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nifty_scalper_bot/core/strategy_manager.py tests/strategies/test_single_vote_score_floor.py .github/workflows/fix-context-score-once.yml .github/scripts/apply_context_score_fix.py
          git commit -m 'fix(strategy): regime-weight positive context confirmation'
          git push origin HEAD:fix/context-score-regime-weight-20260805
