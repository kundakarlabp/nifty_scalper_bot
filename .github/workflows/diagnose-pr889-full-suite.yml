name: Diagnose PR889 full suite

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      BRACKET_AUTO_RESTORE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - name: Run full suite with compact failure output
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short > /tmp/full-suite.log 2>&1
          status=$?
          echo '===== FAILURE SUMMARY ====='
          if [ "$status" -ne 0 ]; then
            grep -E -A30 -B10 '(^FAILED |^ERROR |short test summary info|AssertionError|TypeError|AttributeError)' /tmp/full-suite.log | tail -n 260 || true
          else
            tail -n 20 /tmp/full-suite.log
          fi
          exit "$status"
