name: Diagnose PR889 full suite

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      BRACKET_AUTO_RESTORE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - name: Run full suite and build compact diagnostic
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short > /tmp/full-suite.log 2>&1
          status=$?
          echo "$status" > /tmp/full-suite.status
          if [ "$status" -ne 0 ]; then
            grep -E -A35 -B12 '(^FAILED |^ERROR |short test summary info|AssertionError|TypeError|AttributeError)' /tmp/full-suite.log | tail -n 320 > /tmp/failure-summary.txt || true
          else
            tail -n 30 /tmp/full-suite.log > /tmp/failure-summary.txt
          fi
          exit 0
      - name: Upload diagnostic summary
        uses: actions/upload-artifact@v4
        with:
          name: pr889-full-suite-diagnostic
          path: |
            /tmp/failure-summary.txt
            /tmp/full-suite.status
          if-no-files-found: error
      - name: Preserve test result
        shell: bash
        run: exit "$(cat /tmp/full-suite.status)"
