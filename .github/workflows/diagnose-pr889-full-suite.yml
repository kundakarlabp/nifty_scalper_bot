name: Commit PR889 constructor safety correction

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  commit-constructor-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/symbol-recovery-control-plane-20260717
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/apply_required_symbol_init_guard.py
      - run: python -m pip install -e '.[dev]'
      - name: Run reproduced constructor-safety regression
        run: python -m pytest -q tests/data/test_canonical_history_hydration.py::test_feed_health_uses_selected_options_not_context_option_staleness
      - name: Commit native source correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nifty_scalper_bot/data/market_data_manager.py
          git commit -m 'Initialize required-symbol lifecycle state safely [required-symbol-init-applied]'
          git push origin HEAD:fix/symbol-recovery-control-plane-20260717
