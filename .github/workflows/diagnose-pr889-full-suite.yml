name: Diagnose PR889 constructor safety

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  diagnose-constructor-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/symbol-recovery-control-plane-20260717
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/apply_required_symbol_init_guard.py
      - run: python -m pip install -e '.[dev]'
      - name: Run exact regression and capture traceback
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/data/test_canonical_history_hydration.py::test_feed_health_uses_selected_options_not_context_option_staleness --tb=long > /tmp/constructor-safety.txt 2>&1
          echo $? > /tmp/constructor-safety.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr889-constructor-safety
          path: |
            /tmp/constructor-safety.txt
            /tmp/constructor-safety.status
      - name: Preserve result
        run: exit "$(cat /tmp/constructor-safety.status)"
