name: PR1220 targeted follow-up

on:
  push:
    branches:
      - cursor/regime-ontology-and-policy-owners-a799

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/regime-ontology-and-policy-owners-a799
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/pr1220_fix.py
          python /tmp/pr1220_fix.py
          git fetch origin main --depth=1
          git checkout origin/main -- positions.json
          git rm .github/workflows/pr1220-targeted-followup.yml
      - name: Validate targeted invariants
        shell: bash
        run: |
          python -m pip install -e '.[dev]' -q
          python -m compileall -q src
          python -m pytest -q tests/config/test_entry_policy_owner.py tests/strategies/test_option_score_fails_closed.py tests/strategies/test_regime_gate_aliases.py tests/strategies/test_entry_eval_coalescing.py
      - name: Commit targeted follow-up
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: tighten PR 1220 ownership invariants [pr1220-auto-fix]'
          git push origin HEAD:cursor/regime-ontology-and-policy-owners-a799
