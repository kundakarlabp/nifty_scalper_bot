name: Minimum Lot Affordability One-Off

on:
  push:
    branches:
      - fix/minimum-lot-affordability-readiness-20260806

permissions:
  contents: write

concurrency:
  group: minimum-lot-affordability-once
  cancel-in-progress: false

jobs:
  implement-validate-commit:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/minimum-lot-affordability-readiness-20260806
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Apply production correction and regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          helper = '''"""Minimum executable-lot affordability for live readiness.

          This module deliberately evaluates only the already-selected contract. It must
          never choose a cheaper strike or bypass the strategy/liquidity selection policy.
          """

          from __future__ import annotations

          import math
          from contextlib import suppress
          from dataclasses import asdict, dataclass
          from typing import Any, Mapping


          @dataclass(frozen=True, slots=True)
          class MinimumLotAffordability:
              symbol: str
              affordable: bool
              determinate: bool
              reason: str
              available: float | None
              required: float | None
              executable_capacity: float | None
              entry_price: float | None
              lot_size: int | None
              margin_factor: float
              margin_buffer: float
              balance_source: str

              def to_dict(self) -> dict[str, object]:
                  return asdict(self)


          def _field(source: Mapping[str, Any] | object | None, *names: str) -> Any:
              if source is None:
                  return None
              for name in names:
                  if isinstance(source, Mapping):
                      value = source.get(name)
                  else:
                      value = getattr(source, name, None)
                  if value not in (None, ""):
                      return value
              return None


          def _finite_float(value: Any, *, minimum: float | None = None) -> float | None:
              with suppress(TypeError, ValueError):
                  parsed = float(value)
                  if math.isfinite(parsed) and (minimum is None or parsed >= minimum):
                      return parsed
              return None


          def _available_balance(
              data_hub: Any | None, fallback_balance: Any | None
          ) -> tuple[float | None, str]:
              getter = getattr(data_hub, "get_available_balance", None)
              if callable(getter):
                  try:
                      raw = getter(force=False)
                  except TypeError:
                      raw = getter()
                  except Exception:
                      raw = None
                  parsed = _finite_float(raw, minimum=0.0)
                  if parsed is not None:
                      return parsed, "data_hub"
              parsed_fallback = _finite_float(fallback_balance, minimum=0.0)
              if parsed_fallback is not None:
                  return parsed_fallback, "broker_balance_snapshot"
              return None, "unavailable"


          def evaluate_minimum_lot_affordability(
              *,
              symbol: str,
              quote: Mapping[str, Any] | object | None,
              order_manager: Any | None,
              data_hub: Any | None = None,
              fallback_balance: Any | None = None,
          ) -> MinimumLotAffordability:
              """Evaluate whether one selected BUY option lot is executable.

              The estimate mirrors the MarginEngine fallback path: ask premium × lot size ×
              margin factor, while the configured margin buffer reserves cash by reducing
              executable balance. Broker submission still performs the authoritative final
              margin check.
              """

              normalized_symbol = str(symbol or "").strip()
              raw_factor = _finite_float(
                  getattr(order_manager, "_margin_factor", None), minimum=0.0
              )
              margin_factor = max(raw_factor or 1.0, 1.0)
              raw_buffer = _finite_float(
                  getattr(order_manager, "_margin_buffer", None), minimum=0.0
              )
              # MarginEngine compares available * buffer against required. Values above
              # 1 would create synthetic buying power, so readiness clamps conservatively.
              margin_buffer = min(raw_buffer if raw_buffer and raw_buffer > 0 else 1.0, 1.0)

              ask = _finite_float(_field(quote, "ask", "best_ask"), minimum=0.0)
              if ask is None or ask <= 0:
                  return MinimumLotAffordability(
                      normalized_symbol,
                      False,
                      False,
                      "executable_quote_unavailable",
                      None,
                      None,
                      None,
                      None,
                      None,
                      margin_factor,
                      margin_buffer,
                      "unresolved",
                  )

              resolver = getattr(order_manager, "resolve_lot_size", None)
              lot_size = 0
              if callable(resolver):
                  with suppress(Exception):
                      lot_size = int(resolver(normalized_symbol) or 0)
              if lot_size <= 0:
                  return MinimumLotAffordability(
                      normalized_symbol,
                      False,
                      False,
                      "lot_size_unresolved",
                      None,
                      None,
                      None,
                      ask,
                      None,
                      margin_factor,
                      margin_buffer,
                      "unresolved",
                  )

              available, balance_source = _available_balance(data_hub, fallback_balance)
              if available is None:
                  return MinimumLotAffordability(
                      normalized_symbol,
                      False,
                      False,
                      "available_balance_unavailable",
                      None,
                      None,
                      None,
                      ask,
                      lot_size,
                      margin_factor,
                      margin_buffer,
                      balance_source,
                  )

              required = ask * lot_size * margin_factor
              executable_capacity = available * margin_buffer
              affordable = bool(required > 0 and executable_capacity >= required)
              return MinimumLotAffordability(
                  normalized_symbol,
                  affordable,
                  True,
                  "affordable" if affordable else "minimum_lot_unaffordable",
                  available,
                  required,
                  executable_capacity,
                  ask,
                  lot_size,
                  margin_factor,
                  margin_buffer,
                  balance_source,
              )


          __all__ = [
              "MinimumLotAffordability",
              "evaluate_minimum_lot_affordability",
          ]
          '''
          Path("src/nifty_scalper_bot/execution/affordability.py").write_text(
              helper, encoding="utf-8"
          )

          readiness_path = Path("src/nifty_scalper_bot/execution/readiness.py")
          readiness = readiness_path.read_text(encoding="utf-8")
          old = '''    "broker_balance_unavailable",\n    "position_reconciliation_failed",'''
          new = '''    "broker_balance_unavailable",\n    "minimum_lot_unaffordable",\n    "execution_capacity_unavailable",\n    "position_reconciliation_failed",'''
          assert readiness.count(old) == 1, readiness.count(old)
          readiness = readiness.replace(old, new, 1)
          readiness_path.write_text(readiness, encoding="utf-8")

          app_path = Path("src/nifty_scalper_bot/core/app.py")
          app = app_path.read_text(encoding="utf-8")
          old = '''from nifty_scalper_bot.execution.quote_readiness import resolve_tick_age_seconds\nfrom nifty_scalper_bot.execution.readiness import ('''
          new = '''from nifty_scalper_bot.execution.affordability import (\n    evaluate_minimum_lot_affordability,\n)\nfrom nifty_scalper_bot.execution.quote_readiness import resolve_tick_age_seconds\nfrom nifty_scalper_bot.execution.readiness import ('''
          assert app.count(old) == 1, app.count(old)
          app = app.replace(old, new, 1)

          old = '''    context_exec_ready: bool = False\n    broker_ready: bool = False\n    broker_auth_invalid: bool = False'''
          new = '''    context_exec_ready: bool = False\n    broker_ready: bool = False\n    execution_capacity_ready: bool = False\n    minimum_lot_affordability_by_symbol: dict[str, dict[str, object]] = field(\n        default_factory=dict\n    )\n    broker_auth_invalid: bool = False'''
          assert app.count(old) == 1, app.count(old)
          app = app.replace(old, new, 1)

          old = '''    broker_ready = bool(\n        getattr(ctx, "broker_client", None) and getattr(ctx, "order_manager", None)\n    )\n    execution_ready_by_symbol: dict[str, bool] = {}\n    if selected_ce:\n        execution_ready_by_symbol[str(selected_ce)] = bool(ce_exec_ready)\n    if selected_pe:\n        execution_ready_by_symbol[str(selected_pe)] = bool(pe_exec_ready)\n    all_selected_options_exec_ready = bool(ce_exec_ready and pe_exec_ready)\n    live_orders_armed = bool(\n        live_mode\n        and market_open\n        and evaluation_ready\n        and context_exec_ready\n        and broker_ready\n        and all_selected_options_exec_ready\n    )\n    missing = []'''
          new = '''    broker_ready = bool(\n        getattr(ctx, "broker_client", None) and getattr(ctx, "order_manager", None)\n    )\n    ce_market_exec_ready = bool(ce_exec_ready)\n    pe_market_exec_ready = bool(pe_exec_ready)\n    affordability_by_symbol: dict[str, dict[str, object]] = {}\n\n    def _minimum_lot_capacity(symbol: str | None, status: object | None):\n        if not symbol or status is None:\n            return None\n        decision = evaluate_minimum_lot_affordability(\n            symbol=str(symbol),\n            quote={\n                "bid": getattr(status, "bid", None),\n                "ask": getattr(status, "ask", None),\n                "ltp": getattr(_snapshot(symbol), "ltp", None),\n            },\n            order_manager=getattr(ctx, "order_manager", None),\n            data_hub=getattr(ctx, "data_hub", None),\n            fallback_balance=(\n                getattr(ctx, "last_valid_broker_balance", None)\n                if bool(getattr(ctx, "broker_balance_valid", False))\n                else None\n            ),\n        )\n        affordability_by_symbol[str(symbol)] = decision.to_dict()\n        return decision\n\n    ce_affordability = (\n        _minimum_lot_capacity(selected_ce, ce_status) if live_mode else None\n    )\n    pe_affordability = (\n        _minimum_lot_capacity(selected_pe, pe_status) if live_mode else None\n    )\n    if live_mode:\n        ce_capacity_ready = bool(\n            ce_market_exec_ready\n            and ce_affordability is not None\n            and ce_affordability.affordable\n        )\n        pe_capacity_ready = bool(\n            pe_market_exec_ready\n            and pe_affordability is not None\n            and pe_affordability.affordable\n        )\n        execution_capacity_ready = bool(ce_capacity_ready or pe_capacity_ready)\n    else:\n        ce_capacity_ready = ce_market_exec_ready\n        pe_capacity_ready = pe_market_exec_ready\n        execution_capacity_ready = True\n    ce_exec_ready = bool(ce_market_exec_ready and ce_capacity_ready)\n    pe_exec_ready = bool(pe_market_exec_ready and pe_capacity_ready)\n    execution_ready_by_symbol: dict[str, bool] = {}\n    if selected_ce:\n        execution_ready_by_symbol[str(selected_ce)] = bool(ce_exec_ready)\n    if selected_pe:\n        execution_ready_by_symbol[str(selected_pe)] = bool(pe_exec_ready)\n    selected_options_data_exec_ready = bool(\n        ce_market_exec_ready and pe_market_exec_ready\n    )\n    all_selected_options_exec_ready = bool(\n        selected_options_data_exec_ready and execution_capacity_ready\n    )\n    live_orders_armed = bool(\n        live_mode\n        and market_open\n        and evaluation_ready\n        and context_exec_ready\n        and broker_ready\n        and all_selected_options_exec_ready\n    )\n    missing = []\n    if (\n        live_mode\n        and selected_options_data_exec_ready\n        and not execution_capacity_ready\n    ):\n        capacity_decisions = [\n            item\n            for item in (ce_affordability, pe_affordability)\n            if item is not None\n        ]\n        if capacity_decisions and all(item.determinate for item in capacity_decisions):\n            missing.append("minimum_lot_unaffordable")\n        else:\n            missing.append("execution_capacity_unavailable")'''
          assert app.count(old) == 1, app.count(old)
          app = app.replace(old, new, 1)

          old = '''    ctx.context_exec_ready = bool(context_exec_ready)\n    ctx.broker_ready = bool(broker_ready)\n    LOGGER.info(\n        "READINESS_BLOCKER_SUMMARY'''
          new = '''    ctx.context_exec_ready = bool(context_exec_ready)\n    ctx.broker_ready = bool(broker_ready)\n    ctx.execution_capacity_ready = bool(execution_capacity_ready)\n    ctx.minimum_lot_affordability_by_symbol = dict(affordability_by_symbol)\n    LOGGER.info(\n        "EXECUTION_CAPACITY_READINESS ready=%s selected_ce=%s selected_pe=%s ce_affordable=%s pe_affordable=%s affordability=%s",\n        bool(execution_capacity_ready),\n        selected_ce,\n        selected_pe,\n        bool(ce_affordability and ce_affordability.affordable),\n        bool(pe_affordability and pe_affordability.affordable),\n        affordability_by_symbol,\n        extra={\n            "event": "EXECUTION_CAPACITY_READINESS",\n            "ready": bool(execution_capacity_ready),\n            "selected_ce": selected_ce,\n            "selected_pe": selected_pe,\n            "affordability_by_symbol": affordability_by_symbol,\n        },\n    )\n    LOGGER.info(\n        "READINESS_BLOCKER_SUMMARY'''
          assert app.count(old) == 1, app.count(old)
          app = app.replace(old, new, 1)
          app_path.write_text(app, encoding="utf-8")

          main_path = Path("src/nifty_scalper_bot/main.py")
          main = main_path.read_text(encoding="utf-8")
          old = '''            "evaluation_ready": bool(getattr(ctx, "evaluation_ready", False)),\n            "live_orders_armed": bool(getattr(ctx, "live_orders_armed", False)),\n        },'''
          new = '''            "evaluation_ready": bool(getattr(ctx, "evaluation_ready", False)),\n            "live_orders_armed": bool(getattr(ctx, "live_orders_armed", False)),\n            "execution_capacity_ready": bool(\n                getattr(ctx, "execution_capacity_ready", False)\n            ),\n        },\n        "minimum_lot_affordability": dict(\n            getattr(ctx, "minimum_lot_affordability_by_symbol", {}) or {}\n        ),'''
          assert main.count(old) == 1, main.count(old)
          main = main.replace(old, new, 1)
          main_path.write_text(main, encoding="utf-8")

          unit_tests = '''from __future__ import annotations

          from types import SimpleNamespace

          from nifty_scalper_bot.execution.affordability import (
              evaluate_minimum_lot_affordability,
          )


          class _OrderManager:
              _margin_factor = 1.0
              _margin_buffer = 0.8

              def resolve_lot_size(self, symbol: str) -> int:
                  return 65


          class _Hub:
              def __init__(self, balance):
                  self.balance = balance

              def get_available_balance(self, force=False):
                  return self.balance


          def test_minimum_lot_unaffordable_uses_ask_lot_and_cash_reserve() -> None:
              result = evaluate_minimum_lot_affordability(
                  symbol="NFO:NIFTY26AUG25000CE",
                  quote={"bid": 171.0, "ask": 172.0, "ltp": 171.5},
                  order_manager=_OrderManager(),
                  data_hub=_Hub(10_000.0),
                  fallback_balance=50_000.0,
              )

              assert result.determinate is True
              assert result.affordable is False
              assert result.reason == "minimum_lot_unaffordable"
              assert result.required == 11_180.0
              assert result.executable_capacity == 8_000.0
              assert result.balance_source == "data_hub"


          def test_minimum_lot_affordable_when_reserved_cash_covers_premium() -> None:
              result = evaluate_minimum_lot_affordability(
                  symbol="NFO:NIFTY26AUG25000CE",
                  quote=SimpleNamespace(ask=172.0),
                  order_manager=_OrderManager(),
                  data_hub=_Hub(15_000.0),
              )

              assert result.determinate is True
              assert result.affordable is True
              assert result.required == 11_180.0
              assert result.executable_capacity == 12_000.0


          def test_zero_balance_is_known_and_not_replaced_by_fallback() -> None:
              result = evaluate_minimum_lot_affordability(
                  symbol="NFO:NIFTY26AUG25000CE",
                  quote={"ask": 100.0},
                  order_manager=_OrderManager(),
                  data_hub=_Hub(0.0),
                  fallback_balance=99_999.0,
              )

              assert result.determinate is True
              assert result.affordable is False
              assert result.available == 0.0
              assert result.balance_source == "data_hub"


          def test_missing_ask_fails_closed_without_ltp_substitution() -> None:
              result = evaluate_minimum_lot_affordability(
                  symbol="NFO:NIFTY26AUG25000CE",
                  quote={"ltp": 100.0},
                  order_manager=_OrderManager(),
                  data_hub=_Hub(50_000.0),
              )

              assert result.determinate is False
              assert result.affordable is False
              assert result.reason == "executable_quote_unavailable"
          '''
          Path("tests/execution/test_minimum_lot_affordability.py").write_text(
              unit_tests, encoding="utf-8"
          )

          integration_tests = '''from __future__ import annotations

          from datetime import UTC, datetime, timedelta
          from types import SimpleNamespace

          import pytest

          from nifty_scalper_bot.core import app


          CE = "NFO:NIFTY26AUG25000CE"
          PE = "NFO:NIFTY26AUG25000PE"


          class _MDM:
              _subscribed_tokens = {11, 12}
              _confirmed_subscriptions = {11, 12}
              _symbol_to_token = {CE: 11, PE: 12}

              def __init__(self, asks: dict[str, float]):
                  self.asks = asks

              def hydrate_active_contract_basket(self, basket=None):
                  return {"hard_ready": True, "missing": [], "symbols": {}}

              def get_symbol_snapshot(self, symbol):
                  ask = self.asks.get(symbol, 100.0)
                  return SimpleNamespace(
                      ltp=ask - 0.5,
                      tick_age_s=1.0,
                      bid=ask - 1.0,
                      ask=ask,
                      tradable_quote=True,
                      depth_available=True,
                  )

              def has_ws_tradable_quote(self, symbols):
                  return True

              def desired_tokens_snapshot(self):
                  return [11, 12]

              def get_ohlc_bars(self, symbol):
                  end = datetime.now(UTC).replace(second=0, microsecond=0)
                  return [
                      {
                          "timestamp": end - timedelta(minutes=30 - idx),
                          "close": 100.0,
                      }
                      for idx in range(30)
                  ]

              def hydrate_symbol_history(self, symbol, **kwargs):
                  return self.get_ohlc_bars(symbol)


          class _OrderManager:
              _margin_factor = 1.0
              _margin_buffer = 0.8

              def resolve_lot_size(self, symbol: str) -> int:
                  return 65


          class _Hub:
              def __init__(self, balance: float):
                  self.balance = balance

              def get_available_balance(self, force=False):
                  return self.balance


          def _context(asks: dict[str, float], balance: float):
              calls = []
              ctx = SimpleNamespace(
                  active_trading_universe={
                      "selected_ce": CE,
                      "selected_pe": PE,
                      "atm_strike": 25000,
                      "option_symbols": [CE, PE],
                      "token_by_symbol": {CE: 11, PE: 12},
                  },
                  active_symbol_tokens={CE: 11, PE: 12},
                  selected_ce=CE,
                  selected_pe=PE,
                  market_data_manager=_MDM(asks),
                  data_hub=_Hub(balance),
                  settings=SimpleNamespace(execution_mode="LIVE"),
                  strategy_runner=SimpleNamespace(
                      get_status=lambda: {"running": True},
                      _indicator_engine=SimpleNamespace(
                          get_history=lambda s: ctx.market_data_manager.get_ohlc_bars(s)
                      ),
                      set_runtime_readiness=lambda **kw: calls.append(kw),
                  ),
                  order_manager=_OrderManager(),
                  broker_client=object(),
                  broker_balance_valid=True,
                  last_valid_broker_balance=balance,
                  position_reconciliation_completed=True,
                  position_reconciliation_failed=False,
              )
              return ctx, calls


          @pytest.mark.asyncio
          async def test_both_selected_contracts_unaffordable_disarm_live_orders(
              monkeypatch,
          ) -> None:
              monkeypatch.setattr(app, "get_market_state", lambda: app.MarketState.OPEN)
              ctx, calls = _context({CE: 172.0, PE: 180.0}, 10_000.0)

              await app._recompute_and_push_runtime_readiness(
                  ctx, reason="minimum_lot_test"
              )

              assert ctx.evaluation_ready is True
              assert ctx.execution_capacity_ready is False
              assert ctx.live_orders_armed is False
              assert ctx.readiness_decision.primary_blocker == "minimum_lot_unaffordable"
              assert ctx.execution_ready_by_symbol == {CE: False, PE: False}
              assert calls[-1]["live_orders_armed"] is False


          @pytest.mark.asyncio
          async def test_one_affordable_side_keeps_global_arming_and_side_gate(
              monkeypatch,
          ) -> None:
              monkeypatch.setattr(app, "get_market_state", lambda: app.MarketState.OPEN)
              ctx, calls = _context({CE: 100.0, PE: 180.0}, 10_000.0)

              await app._recompute_and_push_runtime_readiness(
                  ctx, reason="minimum_lot_test"
              )

              assert ctx.execution_capacity_ready is True
              assert ctx.live_orders_armed is True
              assert ctx.execution_ready_by_symbol == {CE: True, PE: False}
              assert ctx.readiness_decision.primary_blocker is None
              assert calls[-1]["execution_ready_by_symbol"] == {CE: True, PE: False}
              assert calls[-1]["live_orders_armed"] is True
          '''
          Path("tests/core/test_minimum_lot_affordability_readiness.py").write_text(
              integration_tests, encoding="utf-8"
          )
          PY

      - name: Format changed Python
        run: |
          python -m black \
            src/nifty_scalper_bot/execution/affordability.py \
            src/nifty_scalper_bot/execution/readiness.py \
            src/nifty_scalper_bot/core/app.py \
            src/nifty_scalper_bot/main.py \
            tests/execution/test_minimum_lot_affordability.py \
            tests/core/test_minimum_lot_affordability_readiness.py

      - name: Focused regressions
        run: |
          python -m pytest -q \
            tests/execution/test_minimum_lot_affordability.py \
            tests/core/test_minimum_lot_affordability_readiness.py \
            tests/core/test_readiness_semantics.py \
            tests/execution/test_readiness_priority.py \
            tests/execution/test_readiness_execution_safety_blockers.py \
            tests/test_main_health_readiness.py

      - name: Static quality
        run: |
          python -m compileall -q src/nifty_scalper_bot
          python -m ruff check \
            src/nifty_scalper_bot/execution/affordability.py \
            src/nifty_scalper_bot/execution/readiness.py \
            src/nifty_scalper_bot/core/app.py \
            src/nifty_scalper_bot/main.py \
            tests/execution/test_minimum_lot_affordability.py \
            tests/core/test_minimum_lot_affordability_readiness.py
          python -m black --check \
            src/nifty_scalper_bot/execution/affordability.py \
            src/nifty_scalper_bot/execution/readiness.py \
            src/nifty_scalper_bot/core/app.py \
            src/nifty_scalper_bot/main.py \
            tests/execution/test_minimum_lot_affordability.py \
            tests/core/test_minimum_lot_affordability_readiness.py

      - name: Complete repository suite
        run: python -m pytest -q

      - name: Verify intended change surface
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              "src/nifty_scalper_bot/execution/affordability.py",
              "src/nifty_scalper_bot/execution/readiness.py",
              "src/nifty_scalper_bot/core/app.py",
              "src/nifty_scalper_bot/main.py",
              "tests/execution/test_minimum_lot_affordability.py",
              "tests/core/test_minimum_lot_affordability_readiness.py",
              ".github/workflows/minimum-lot-affordability-once.yml",
          }
          lines = subprocess.check_output(
              ["git", "status", "--porcelain"], text=True
          ).splitlines()
          actual = {line[3:] for line in lines if len(line) >= 4}
          unexpected = actual - expected
          missing = expected - actual
          if unexpected or missing:
              raise SystemExit(
                  f"change surface mismatch unexpected={sorted(unexpected)} missing={sorted(missing)}"
              )
          PY

      - name: Commit validated correction and remove temporary workflow
        run: |
          git rm .github/workflows/minimum-lot-affordability-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/nifty_scalper_bot/execution/affordability.py \
            src/nifty_scalper_bot/execution/readiness.py \
            src/nifty_scalper_bot/core/app.py \
            src/nifty_scalper_bot/main.py \
            tests/execution/test_minimum_lot_affordability.py \
            tests/core/test_minimum_lot_affordability_readiness.py
          git commit -m 'fix(execution): gate live readiness on minimum lot affordability [skip ci]'
          git push origin HEAD:fix/minimum-lot-affordability-readiness-20260806
