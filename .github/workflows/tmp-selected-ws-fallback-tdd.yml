name: tmp-selected-ws-fallback-tdd
'on':
  push:
    branches:
      - 'fix/selected-ws-poll-recovery-20260826'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -q -e '.[dev]'
      - name: Run TDD patch harness
        run: python .github/tmp_selected_ws_patch.py
