name: Remove temporary expiry workflow

on:
  push:
    branches:
      - fix/live-sim-expiry-fixture-20260827

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-sim-expiry-fixture-20260827
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-live-sim-expiry-fixture-20260827.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove temporary expiry validation workflow'
          git push origin HEAD:fix/live-sim-expiry-fixture-20260827
