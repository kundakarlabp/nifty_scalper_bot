name: Fix quote version signal identity once

on:
  push:
    branches:
      - fix/quote-version-signal-identity-20260805

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/quote-version-signal-identity-20260805
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -e '.[dev]' -q
          python -m pip install -r dashboard/requirements.txt -q
      - name: Apply correction and regressions
        run: python .github/scripts/apply_quote_version_signal_identity_fix.py
      - name: Correct generated static contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          signal_path = Path('src/nifty_scalper_bot/strategies/signal_identity_patch.py')
          signal_text = signal_path.read_text()
          log_old = (
              '            "ELITE_SIGNAL_GENERATED strategy=%s symbol=%s side=%s '
              'raw_setup_score=%s confidence=%s setup_id=%s setup_anchor=%s '
              'quote_update_version=%s evaluation_snapshot_id=%s",\n'
          )
          log_new = (
              '            (\n'
              '                "ELITE_SIGNAL_GENERATED strategy=%s symbol=%s side=%s "\n'
              '                "raw_setup_score=%s confidence=%s setup_id=%s setup_anchor=%s "\n'
              '                "quote_update_version=%s evaluation_snapshot_id=%s"\n'
              '            ),\n'
          )
          if log_old not in signal_text:
              raise SystemExit('generated observability log anchor missing')
          signal_path.write_text(signal_text.replace(log_old, log_new, 1))

          runner_path = Path('src/nifty_scalper_bot/strategies/runner.py')
          runner_text = runner_path.read_text()
          type_old = (
              'if TYPE_CHECKING:\n'
              '    from nifty_scalper_bot.data.data_hub import DataHub\n'
          )
          type_new = (
              'if TYPE_CHECKING:\n'
              '    from nifty_scalper_bot.data.data_hub import DataHub\n'
              '    from nifty_scalper_bot.execution.order_manager import ExitIntent\n'
          )
          if type_old not in runner_text:
              raise SystemExit('runner TYPE_CHECKING anchor missing')
          runner_path.write_text(runner_text.replace(type_old, type_new, 1))
          PY
      - name: Normalize newly introduced and narrowly modified files
        run: |
          python -m ruff check --fix --exit-zero \
            src/nifty_scalper_bot/strategies/quote_update_identity.py \
            src/nifty_scalper_bot/strategies/signal_identity_patch.py \
            src/nifty_scalper_bot/strategies/runtime_context_contract.py \
            tests/strategies/test_quote_update_identity.py \
            tests/strategies/test_signal_observability_contract.py
          python -m black \
            src/nifty_scalper_bot/strategies/quote_update_identity.py \
            src/nifty_scalper_bot/strategies/signal_identity_patch.py \
            src/nifty_scalper_bot/strategies/runtime_context_contract.py \
            tests/strategies/test_quote_update_identity.py \
            tests/strategies/test_signal_observability_contract.py
      - name: Focused quote identity tests
        run: |
          python -m pytest -q \
            tests/strategies/test_quote_update_identity.py \
            tests/strategies/test_signal_observability_contract.py \
            tests/strategies/test_signal_identity_patch.py \
            tests/strategies/test_runtime_context_contract.py \
            tests/strategies/test_runner_eval_pregate.py
      - name: Adjacent strategy and live-safety tests
        run: |
          python -m pytest -q \
            tests/strategies/test_signal_observability_contract.py \
            tests/strategies/test_signal_identity_patch.py \
            tests/strategies/test_setup_anchor_identity.py \
            tests/strategies/test_runtime_context_contract.py \
            tests/strategies/test_runtime_context_contract_autoinstall.py \
            tests/strategies/test_orderflow_quote_age_contract.py \
            tests/core/test_strategy_live_safety.py
      - name: Quality checks
        run: |
          python -m compileall -q src tests
          python -m ruff check \
            src/nifty_scalper_bot/strategies/quote_update_identity.py \
            src/nifty_scalper_bot/strategies/signal_identity_patch.py \
            src/nifty_scalper_bot/strategies/runtime_context_contract.py \
            tests/strategies/test_quote_update_identity.py
          python -m ruff check --ignore E501 \
            tests/strategies/test_signal_observability_contract.py
          python -m ruff check --select E9,F63,F7,F82 \
            src/nifty_scalper_bot/strategies/runner.py
          python -m black --check \
            src/nifty_scalper_bot/strategies/quote_update_identity.py \
            src/nifty_scalper_bot/strategies/signal_identity_patch.py \
            src/nifty_scalper_bot/strategies/runtime_context_contract.py \
            tests/strategies/test_quote_update_identity.py \
            tests/strategies/test_signal_observability_contract.py
          git diff --check
      - name: Validate intended change surface
        run: |
          python - <<'PY'
          import subprocess

          allowed = {
              'src/nifty_scalper_bot/strategies/quote_update_identity.py',
              'src/nifty_scalper_bot/strategies/runner.py',
              'src/nifty_scalper_bot/strategies/runtime_context_contract.py',
              'src/nifty_scalper_bot/strategies/signal_identity_patch.py',
              'tests/strategies/test_quote_update_identity.py',
              'tests/strategies/test_signal_observability_contract.py',
          }
          changed = {
              line.strip()
              for line in subprocess.check_output(
                  ['git', 'diff', '--name-only'], text=True
              ).splitlines()
              if line.strip()
          }
          unexpected = changed - allowed
          missing = {
              'src/nifty_scalper_bot/strategies/quote_update_identity.py',
              'src/nifty_scalper_bot/strategies/runner.py',
              'src/nifty_scalper_bot/strategies/signal_identity_patch.py',
              'tests/strategies/test_quote_update_identity.py',
              'tests/strategies/test_signal_observability_contract.py',
          } - changed
          if unexpected or missing:
              raise SystemExit(
                  f'unexpected change surface: unexpected={sorted(unexpected)} missing={sorted(missing)}'
              )
          PY
      - name: Full suite with isolated flake confirmation
        env:
          BRACKET_AUTO_RESTORE: 'false'
        run: |
          if python -m pytest -q; then
            exit 0
          fi
          python -m pytest -q tests/e2e/live_sim/test_partial_fill_and_bracket_resize.py
          python -m pytest -q
      - name: Commit validated correction
        run: |
          rm .github/workflows/fix-quote-version-signal-identity-once.yml
          rm .github/scripts/apply_quote_version_signal_identity_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(strategy): propagate quote version into signal identity'
          git push origin HEAD:fix/quote-version-signal-identity-20260805
