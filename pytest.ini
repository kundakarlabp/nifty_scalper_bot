[pytest]
# Known-flaky (async event-loop timing under xdist-free runs): deselected by
# standing decision — see repo history. Remove the deselect once stabilized.
addopts = -q --maxfail=1 --disable-warnings --import-mode=importlib -m "not slow" --deselect tests/core/test_runtime_history_orchestration.py::test_context_option_post_market_suppresses_broker
testpaths = tests
markers =
    slow: longer/simulation tests
    unit: fast unit tests
    prop: property-based tests
    integration: integration scenarios spanning multiple components
    performance: runtime performance checks
    stress: high volume or edge-case scenarios
filterwarnings =
    ignore::DeprecationWarning
pythonpath =
    .
    src
