[build]
builder = "NIXPACKS"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
startCommand = "cd /app && set -a && [ -f .env ] && . ./.env && set +a && python -m uvicorn nifty_scalper_bot.main:app --host 0.0.0.0 --port ${PORT:-8000}"

# Railway native env file loading (backup)
[env]
source = ".env"
